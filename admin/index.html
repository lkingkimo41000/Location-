function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('admin_lang', lang);
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  render();
  showToast(lang === 'ar' ? '🌍 تم التبديل إلى العربية' : '🌍 Basculé vers le français', 'info');

const todayStr = () => new Date().toISOString().slice(0, 10);
const nowStr = () => new Date().toISOString().slice(0, 10) + ' ' + new Date().toTimeString().slice(0, 5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const addDays = (dateStr, n) => { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtMoney = (n) => `${Number(n || 0).toLocaleString("en-US")} د.ج`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function showToast(msg, type = "success") {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.className = "toast"; }, 3500);
}

} catch (e) {
  db = getDefaultData();

}

function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
}

  saveLocal();
  if (dbRef && firebaseReady) {
    dbRef.set(db).catch(() => {});
  }
}

/* ============================================================
   🔥 تهيئة Firebase
   ============================================================ */
function initFirebase() {
  const statusEl = document.getElementById('splash-status');
  try {
    if (typeof firebase === 'undefined') throw new Error('Firebase غير محمل');
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref(STORAGE_KEY);
    firebaseReady = true;
    if (statusEl) statusEl.textContent = t('synced');
    startSync();
  } catch (e) {
    console.warn('فشل تهيئة Firebase:', e.message);
    if (statusEl) statusEl.textContent = t('offline');
    setTimeout(() => {
      if (!appStarted) {
        appStarted = true;
        hideSplash();
        render();
        showToast(t('offline'), 'warning');
      }
    }, 3000);
  }
}

/* ============================================================
   🔄 المزامنة مع Firebase
   ============================================================ */
let firstSync = true;

function startSync() {
  if (!dbRef) return;
  dbRef.on('value', (snapshot) => {
    const remote = snapshot.val();
    if (remote) {
      db = remote;
      saveLocal();
      if (firstSync) {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast(t('synced'), 'success');
        }
      } else {
        render();
      }
    } else if (firstSync) {
      dbRef.set(db).then(() => {
        console.log('✅ تم إرسال البيانات الأولية');
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast(t('synced'), 'success');
        }
      }).catch(() => {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast(t('offline'), 'warning');
        }
      });
    }
  }, () => {
    if (firstSync && !appStarted) {
      firstSync = false;
      setTimeout(() => {
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast(t('offline'), 'warning');
        }
      }, 3000);
    }
  });
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (el) {
    el.classList.add('hidden');
    setTimeout(() => { el.style.display = 'none'; }, 500);
  }
}

function getCarAlerts(car) {
  const t = todayStr();
  const alerts = [];
  const settings = db.settings || { maintenanceAlertKm: 500, insuranceAlertDays: 30 };
  const kmLeft = car.lastOilKm + car.oilIntervalKm - car.currentKm;
  if (kmLeft <= settings.maintenanceAlertKm) {
    alerts.push({ type: 'oil', level: kmLeft <= 0 ? 'danger' : 'warning', emoji: '🛢️', 
      text: kmLeft <= 0 ? `${t('oil_change')} ${Math.abs(kmLeft)} كم` : `${t('oil_change')} ${kmLeft} كم` });
  }
  const insDays = daysBetween(t, car.insuranceExpiry);
  if (insDays <= settings.insuranceAlertDays) {
    alerts.push({ type: 'insurance', level: insDays <= 0 ? 'danger' : 'warning', emoji: '🛡️',
      text: insDays <= 0 ? `${t('renew_insurance')} ${Math.abs(insDays)} يوم` : `${t('renew_insurance')} ${insDays} يوم` });
  }
  const inspDays = daysBetween(t, car.inspectionExpiry);
  if (inspDays <= settings.insuranceAlertDays) {
    alerts.push({ type: 'inspection', level: inspDays <= 0 ? 'danger' : 'warning', emoji: '📋',
      text: inspDays <= 0 ? `${t('renew_inspection')} ${Math.abs(inspDays)} يوم` : `${t('renew_inspection')} ${inspDays} يوم` });
  }
  return alerts;
}

function getStats() {
  const totalCars = db.cars.length;
  const available = db.cars.filter(c => c.status === 'available').length;
  const rented = db.cars.filter(c => c.status === 'rented').length;
  const maintenance = db.cars.filter(c => c.status === 'maintenance').length;
  const totalCustomers = db.customers.length;
  const pendingRes = db.reservations.filter(r => r.status === 'pending').length;
  const activeRes = db.reservations.filter(r => r.status === 'confirmed').length;
  const totalRes = db.reservations.length;
  const totalIncome = db.finances.filter(f => f.type === 'income').reduce((s, f) => s + f.amount, 0);
  const totalExpense = db.finances.filter(f => f.type === 'expense').reduce((s, f) => s + f.amount, 0);
  const netProfit = totalIncome - totalExpense;
  const alerts = db.cars.flatMap(c => getCarAlerts(c));
  const dangerAlerts = alerts.filter(a => a.level === 'danger').length;
  
  return { totalCars, available, rented, maintenance, totalCustomers, pendingRes, activeRes, totalRes, totalIncome, totalExpense, netProfit, dangerAlerts };
}

   🗑️ تغيير رمز حذف الزبائن
   ============================================================ */
function changeDeletePassword() {
  const current = document.getElementById('current-delete-pass').value.trim();
  const newPass = document.getElementById('new-delete-pass').value.trim();
  const confirm = document.getElementById('confirm-delete-pass').value.trim();
  
  const settings = db.settings || {};
  const currentDeletePass = settings.deletePassword || 'admin123';
  
  if (current !== currentDeletePass) {
    showToast(t('wrong_current_code'), 'error');
    return;
  }
  
  if (newPass.length < 4) {
    showToast(t('min_password'), 'error');
    return;
  }
  
  if (newPass !== confirm) {
    showToast(t('fill_fields'), 'error');
    return;
  }
  
  if (!db.settings) db.settings = {};
  db.settings.deletePassword = newPass;
  saveData();
  
  document.getElementById('current-delete-pass').value = '';
  document.getElementById('new-delete-pass').value = '';
  document.getElementById('confirm-delete-pass').value = '';
  
  showToast(t('delete_code_changed'), 'success');
  console.log('🗑️ Nouveau code de suppression:', newPass);
}

function exportCars() {
  let csv = `${t('brand')},${t('model')},${t('year')},${t('plate')},${t('car_status')},${t('daily_price')},${t('km')}\n`;
  db.cars.forEach(c => {
    csv += `${c.brand},${c.model},${c.year},${c.plate},${c.status},${c.dailyPrice},${c.currentKm}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cars_${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Exported', 'success');
}

function confirmReservation(resId) {
  const r = db.reservations.find(r => r.id === resId);
  if (!r) return;
  r.status = 'confirmed';
  r.exitTime = nowStr();
  const car = db.cars.find(c => c.id === r.carId);
  if (car) car.status = 'rented';
  db.finances.push({ id: uid(), type: 'income', category: 'إيجار', amount: r.totalPrice, carId: r.carId, date: nowStr(), note: `خروج السيارة - ${r.customerName}` });
  saveData();
  render();
  showToast(t('booking_confirmed'), 'success');
}

function rejectReservation(resId) {
  const r = db.reservations.find(r => r.id === resId);
  if (!r) return;
  r.status = 'cancelled';
  saveData();
  render();
  showToast(t('booking_rejected'), 'info');
}

function completeReservation(resId) {
  state.modal = { type: 'completeRes', resId };
  render();
}

function submitCompleteRes() {
  const r = db.reservations.find(r => r.id === state.modal.resId);
  if (!r) return;
  const km = Number(document.getElementById('complete-km').value);
  if (!km) return showToast(t('fill_fields'), 'error');
  const car = db.cars.find(c => c.id === r.carId);
  if (car) { car.status = 'available'; car.currentKm = km; }
  r.status = 'completed';
  r.returnTime = nowStr();
  saveData();
  state.modal = null;
  render();
  showToast(t('booking_completed'), 'success');
}

function printContract(resId) {

}

function openManualRental() {
  state.modal = { type: 'manualRental' };
  render();
}

function submitManualRental() {
  const carId = document.getElementById('mr-car').value;
  const customerName = document.getElementById('mr-customer').value.trim();
  const customerPhone = document.getElementById('mr-phone').value.trim();
  const startDate = document.getElementById('mr-start').value;
  const endDate = document.getElementById('mr-end').value;
  
  if (!carId || !customerName || !customerPhone || !startDate || !endDate) {
    return showToast(t('fill_fields'), 'error');
  }
  
  const car = db.cars.find(c => c.id === carId);
  if (!car) return showToast(t('error'), 'error');
  if (car.status !== 'available') return showToast(t('error'), 'error');
  
  let customer = db.customers.find(c => c.phone === customerPhone);
  let customerId;
  
  if (!customer) {
    customerId = uid();
    db.customers.push({ id: customerId, name: customerName, phone: customerPhone, whitelisted: false, blacklisted: false, password: '123456', createdAt: todayStr() });
  } else {
    customerId = customer.id;
    customer.name = customerName;
  }
  
  const days = daysBetween(startDate, endDate);
  const totalPrice = days * car.dailyPrice;
  
  db.reservations.push({ id: uid(), carId, customerId, customerName, customerPhone, startDate, endDate, status: 'confirmed', totalPrice, createdAt: todayStr(), exitTime: nowStr(), isManual: true });
  car.status = 'rented';
  db.finances.push({ id: uid(), type: 'income', category: 'إيجار', amount: totalPrice, carId, date: nowStr(), note: `كراء يدوي - ${car.brand} ${car.model} - ${customerName}` });
  
  saveData();
  state.modal = null;
  render();
  showToast(t('rental_completed'), 'success');
}

// ====== عمليات الزبائن ======
function openAddCustomer() {
  state.modal = { type: 'addCustomer' };
  render();
}

function submitAddCustomer() {
  const name = document.getElementById('ac-name').value.trim();
  const phone = document.getElementById('ac-phone').value.trim();
  if (!name || !phone) return showToast(t('fill_fields'), 'error');
  
  const existing = db.customers.find(c => c.phone === phone);
  if (existing) {
    if (existing.whitelisted) return showToast(t('error'), 'error');
    existing.whitelisted = true;
    existing.blacklisted = false;
    saveData();
    state.modal = null;
    render();
    showToast(t('customer_whitelisted'), 'success');
    return;
  }
  
  db.customers.push({ id: uid(), name, phone, whitelisted: true, blacklisted: false, password: '123456', createdAt: todayStr() });
  saveData();
  state.modal = null;
  render();
  showToast(t('customer_added'), 'success');
}

function toggleWhitelist(custId) {
  const c = db.customers.find(c => c.id === custId);
  if (!c) return;
  c.whitelisted = !c.whitelisted;
  if (c.whitelisted) c.blacklisted = false;
  saveData();
  render();
  showToast(c.whitelisted ? t('customer_whitelisted') : t('info'), 'info');
}

function toggleBlacklist(custId) {
  const c = db.customers.find(c => c.id === custId);
  if (!c) return;
  c.blacklisted = !c.blacklisted;
  if (c.blacklisted) c.whitelisted = false;
  saveData();
  render();
  showToast(c.blacklisted ? t('customer_blacklisted') : t('info'), 'info');
}

function openDeleteCustomer(custId) {
  const customer = db.customers.find(c => c.id === custId);
  if (!customer) return;
  state.modal = { type: 'deleteCustomer', customerId: custId };
  render();
}

function confirmDeleteCustomer() {
  const password = document.getElementById('delete-password').value.trim();
  const customerId = state.modal.customerId;
  const customer = db.customers.find(c => c.id === customerId);
  if (!customer) return;
  
  const settings = db.settings || {};
  const deletePassword = settings.deletePassword || 'admin123';
  
  if (password !== deletePassword) {
    showToast(t('wrong_delete_password'), 'error');
    return;
  }
  
  performDeleteCustomer(customerId);
}

function performDeleteCustomer(customerId) {
  const customer = db.customers.find(c => c.id === customerId);
  if (!customer) return;
  
  const customerName = customer.name;
  const customerPhone = customer.phone;
  
  db.reservations = db.reservations.map(r => {
    if (r.customerId === customerId && (r.status === 'pending' || r.status === 'confirmed')) {
      if (r.status === 'confirmed') {
        const car = db.cars.find(c => c.id === r.carId);
        if (car) car.status = 'available';
      }
      return { ...r, status: 'cancelled' };
    }
    return r;
  });
  
  db.finances.push({ id: uid(), type: 'expense', category: 'حذف زبون', amount: 0, carId: null, date: nowStr(), note: `حذف الزبون ${customerName} (${customerPhone})` });
  db.customers = db.customers.filter(c => c.id !== customerId);
  if (db.passwordResetRequests) {
    db.passwordResetRequests = db.passwordResetRequests.filter(r => r.customerId !== customerId);
  }
  
  saveData();
  state.modal = null;
  render();
  showToast(t('customer_deleted'), 'success');
}

function resetPassword(requestId) {
  const requests = db.passwordResetRequests || [];
  const req = requests.find(r => r.id === requestId);
  if (!req) return;
  const customer = db.customers.find(c => c.id === req.customerId);
  if (!customer) return;
  req.status = 'resolved';
  req.resolvedAt = nowStr();
  saveData();
  render();
  showToast(t('password_reset_sent'), 'success');
}

function rejectPasswordReset(requestId) {
  const requests = db.passwordResetRequests || [];
  const req = requests.find(r => r.id === requestId);
  if (!req) return;
  req.status = 'rejected';
  req.resolvedAt = nowStr();
  saveData();
  render();
  showToast(t('password_reset_rejected'), 'info');
}

function openMaintResolve(carId, kind) {

  render();
}

function submitMaintResolve() {
  const { carId, kind } = state.modal;
  const car = db.cars.find(c => c.id === carId);
  if (!car) return;
  const amount = Number(document.getElementById('maint-amount').value) || 0;
  
  if (kind === 'oil') car.lastOilKm = car.currentKm;
  else if (kind === 'insurance') car.insuranceExpiry = addDays(todayStr(), 365);
  else if (kind === 'inspection') car.inspectionExpiry = addDays(todayStr(), 365);
  
  if (amount > 0) {
    db.finances.push({ id: uid(), type: 'expense', category: kind === 'oil' ? 'تغيير زيت' : kind === 'insurance' ? 'تجديد تأمين' : 'فحص فني', amount, carId: car.id, date: todayStr(), note: `${car.brand} ${car.model} · ${car.plate}` });
  }
  
  saveData();
  state.modal = null;
  render();
  showToast(t('maintenance_updated'), 'success');
}
