<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Adam Location · لوحة التحكم</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0F1216; color: #F1EEE6; min-height: 100vh; }
  
  #splash {
    position: fixed; inset: 0; z-index: 9999; background: #0F1216;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #splash .logo { font-size: 72px; margin-bottom: 10px; }
  #splash h1 { font-size: 28px; color: #F2B134; }
  #splash .loader {
    margin-top: 20px;
    width: 40px; height: 40px;
    border: 4px solid #232833;
    border-top-color: #F2B134;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #splash .status { margin-top: 12px; font-size: 13px; color: #8B93A1; }
  
  .container { max-width: 880px; margin: 0 auto; padding: 0 12px 40px; }
  .card { background: #1A1E25; border: 1px solid #323847; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  
  .btn {
    display: inline-flex; padding: 10px 16px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;
    transition: transform 0.15s; align-items: center; gap: 6px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: #F2B134; color: #1A1305; }
  .btn-success { background: #3FA796; color: #fff; }
  .btn-danger { background: #E5573F; color: #fff; }
  .btn-subtle { background: #232833; color: #F1EEE6; border: 1px solid #323847; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-block { width: 100%; justify-content: center; }
  
  .input {
    width: 100%; padding: 10px 12px; background: #232833; border: 1px solid #323847;
    border-radius: 8px; color: #F1EEE6; font-size: 14px; outline: none;
  }
  .input:focus { border-color: #F2B134; }
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 13px; color: #8B93A1; margin-bottom: 4px; font-weight: bold; }
  
  .text-center { text-align: center; }
  .text-muted { color: #8B93A1; }
  .mt-8 { margin-top: 8px; }
  .mb-8 { margin-bottom: 8px; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: bold;
  }
  .badge-success { background: rgba(63,167,150,0.2); color: #3FA796; border: 1px solid rgba(63,167,150,0.4); }
  .badge-danger { background: rgba(229,87,63,0.2); color: #E5573F; border: 1px solid rgba(229,87,63,0.4); }
  .badge-warning { background: rgba(242,177,52,0.2); color: #F2B134; border: 1px solid rgba(242,177,52,0.4); }
  .badge-info { background: rgba(91,141,239,0.2); color: #5B8DEF; border: 1px solid rgba(91,141,239,0.4); }
  
  .tabbar {
    display: flex; gap: 4px; background: #1A1E25; border: 1px solid #323847;
    border-radius: 12px; padding: 4px; margin-bottom: 16px; overflow-x: auto;
  }
  .tabbar button {
    flex: 1; padding: 10px; border: none; background: transparent; color: #8B93A1;
    font-size: 13px; font-weight: bold; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  .tabbar button.active { background: #F2B134; color: #1A1305; }
  
  .car-item {
    background: #232833; border: 1px solid #323847; border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
  }
  .car-item .name { font-weight: bold; font-size: 15px; }
  .car-item .info { color: #8B93A1; font-size: 12px; }
  .car-item .price { color: #F2B134; font-weight: bold; font-size: 16px; }
  
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; margin-bottom: 16px; border-bottom: 1px solid #323847;
  }
  .header-title { font-size: 20px; font-weight: bold; color: #F2B134; }
  
  .stat-card {
    background: #1A1E25; border: 1px solid #323847; border-radius: 12px;
    padding: 12px; display: flex; align-items: center; gap: 10px;
  }
  .stat-card .icon { font-size: 24px; }
  .stat-card .label { font-size: 11px; color: #8B93A1; }
  .stat-card .value { font-weight: bold; font-size: 18px; }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }
  
  .actions-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .empty { text-align: center; padding: 40px 16px; color: #8B93A1; }
  .empty .icon { font-size: 40px; display: block; margin-bottom: 8px; }
  
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; border-radius: 12px; font-weight: bold; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 100;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #3FA796; color: #fff; }
  .toast.error { background: #E5573F; color: #fff; }
  
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box {
    background: #1A1E25; border: 1px solid #323847; border-radius: 16px;
    padding: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .modal-header h3 { font-size: 18px; }
  .modal-close { background: none; border: none; color: #8B93A1; font-size: 24px; cursor: pointer; }
  
  .alert-row {
    display: flex; align-items: center; gap: 10px;
    background: #232833; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px;
  }
  .alert-row .emoji { font-size: 18px; }
</style>
</head>
<body>

<div id="splash">
  <div class="logo">🔐</div>
  <h1>لوحة التحكم</h1>
  <div class="loader"></div>
  <div class="status" id="splash-status">جاري التحميل...</div>
</div>

<div id="toast" class="toast"></div>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ============================================================
   🔥 إعدادات Firebase (نفس إعدادات تطبيق الزبون)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCNp8pVNX84MyMgIsuiV9K6DE3tximsrRg",
  authDomain: "location-c06ec.firebaseapp.com",
  databaseURL: "https://location-c06ec-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "location-c06ec",
  storageBucket: "location-c06ec.firebasestorage.app",
  messagingSenderId: "418304217437",
  appId: "1:418304217437:web:3656ef204f2b453abe18b4"
};

const STORAGE_KEY = "rental-db-v2";

/* ============================================================
   📦 الأدوات المساعدة
   ============================================================ */
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowStr = () => new Date().toISOString().slice(0, 10) + ' ' + new Date().toTimeString().slice(0, 5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const addDays = (dateStr, n) => { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtMoney = (n) => `${Number(n || 0).toLocaleString("en-US")} د.ج`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function showToast(msg, type = "success") {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.className = "toast"; }, 3000);
}

/* ============================================================
   🗄️ البيانات الافتراضية
   ============================================================ */
function getDefaultData() {
  const t = todayStr();
  return {
    cars: [
      { id: "c1", plate: "أ ب ج 1234", brand: "تويوتا", model: "كورولا", year: 2022, status: "available", currentKm: 18500, dailyPrice: 12000, oilIntervalKm: 5000, lastOilKm: 15000, insuranceExpiry: addDays(t, 20), inspectionExpiry: addDays(t, 200) },
      { id: "c2", plate: "د هـ و 5678", brand: "هيونداي", model: "إلنترا", year: 2021, status: "available", currentKm: 42000, dailyPrice: 10000, oilIntervalKm: 5000, lastOilKm: 41800, insuranceExpiry: addDays(t, 5), inspectionExpiry: addDays(t, 15) },
      { id: "c3", plate: "ز ح ط 9012", brand: "كيا", model: "سيراتو", year: 2023, status: "available", currentKm: 9000, dailyPrice: 11000, oilIntervalKm: 5000, lastOilKm: 4500, insuranceExpiry: addDays(t, 300), inspectionExpiry: addDays(t, 300) },
      { id: "c4", plate: "ك ل م 3456", brand: "نيسان", model: "صني", year: 2020, status: "available", currentKm: 61000, dailyPrice: 8500, oilIntervalKm: 5000, lastOilKm: 58200, insuranceExpiry: addDays(t, 60), inspectionExpiry: addDays(t, 90) },
    ],
    customers: [],
    reservations: [],
    kmHistory: [],
    finances: [],
    contact: { phone: "0555555555", platformLink: "https://wa.me/213555555555", platformLabel: "واتساب" },
    passwordResetRequests: []
  };
}

/* ============================================================
   💾 قاعدة البيانات
   ============================================================ */
let db;
let dbRef = null;
let firebaseReady = false;
let appStarted = false;

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  db = saved ? JSON.parse(saved) : getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
} catch (e) {
  db = getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
}

function saveData() {
  saveLocal();
  if (dbRef && firebaseReady) {
    dbRef.set(db).catch(() => {});
  }
}

/* ============================================================
   🔥 تهيئة Firebase
   ============================================================ */
function initFirebase() {
  const statusEl = document.getElementById('splash-status');
  
  try {
    if (typeof firebase === 'undefined') {
      throw new Error('Firebase غير محمل');
    }
    
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref(STORAGE_KEY);
    firebaseReady = true;
    
    if (statusEl) statusEl.textContent = '✅ متصل بالخادم';
    startSync();
    
  } catch (e) {
    console.warn('فشل تهيئة Firebase:', e.message);
    if (statusEl) statusEl.textContent = '⚠️ تعذر الاتصال، بيانات محلية';
    setTimeout(() => {
      if (!appStarted) {
        appStarted = true;
        hideSplash();
        render();
        showToast('⚠️ وضع غير متصل - بيانات محلية');
      }
    }, 3000);
  }
}

/* ============================================================
   🔄 المزامنة مع Firebase
   ============================================================ */
let firstSync = true;

function startSync() {
  if (!dbRef) return;
  
  dbRef.on('value', (snapshot) => {
    const remote = snapshot.val();
    if (remote) {
      db = remote;
      saveLocal();
      if (firstSync) {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('✅ مزامنة مع الخادم');
        }
      } else {
        render();
      }
    } else if (firstSync) {
      dbRef.set(db).then(() => {
        console.log('✅ تم إرسال البيانات الأولية');
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('✅ مزامنة مع الخادم');
        }
      }).catch(() => {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('⚠️ بيانات محلية فقط');
        }
      });
    }
  }, () => {
    if (firstSync && !appStarted) {
      firstSync = false;
      setTimeout(() => {
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('⚠️ وضع غير متصل - بيانات محلية');
        }
      }, 3000);
    }
  });
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (el) {
    el.classList.add('hidden');
    setTimeout(() => { el.style.display = 'none'; }, 500);
  }
}

/* ============================================================
   📱 حالة التطبيق
   ============================================================ */
let state = {
  section: 'overview',
  modal: null
};

/* ============================================================
   🏷️ الثوابت
   ============================================================ */
const STATUS_META = {
  available: { label: 'متاحة', color: '#3FA796' },
  rented: { label: 'مؤجَّرة', color: '#5B8DEF' },
  maintenance: { label: 'في الصيانة', color: '#E5573F' }
};

function getCarAlerts(car) {
  const t = todayStr();
  const alerts = [];
  const kmLeft = car.lastOilKm + car.oilIntervalKm - car.currentKm;
  if (kmLeft <= 500) {
    alerts.push({ type: 'oil', level: kmLeft <= 0 ? 'danger' : 'warning', emoji: '🛢️', text: kmLeft <= 0 ? `تجاوز تغيير الزيت بـ ${Math.abs(kmLeft)} كم` : `تغيير الزيت بعد ${kmLeft} كم` });
  }
  const insDays = daysBetween(t, car.insuranceExpiry);
  if (insDays <= 30) {
    alerts.push({ type: 'insurance', level: insDays <= 0 ? 'danger' : 'warning', emoji: '🛡️', text: insDays <= 0 ? `انتهى التأمين منذ ${Math.abs(insDays)} يوم` : `ينتهي التأمين بعد ${insDays} يوم` });
  }
  const inspDays = daysBetween(t, car.inspectionExpiry);
  if (inspDays <= 30) {
    alerts.push({ type: 'inspection', level: inspDays <= 0 ? 'danger' : 'warning', emoji: '📋', text: inspDays <= 0 ? `انتهى الفحص الفني منذ ${Math.abs(inspDays)} يوم` : `ينتهي الفحص الفني بعد ${inspDays} يوم` });
  }
  return alerts;
}

/* ============================================================
   🖥️ التصيير
   ============================================================ */
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  app.innerHTML = renderApp();
  if (state.modal) {
    app.innerHTML += renderModal();
  }
}

function renderApp() {
  return `
    <div class="container">
      <div class="header">
        <div class="header-title">🔐 Adam Location · لوحة التحكم</div>
      </div>
      
      <div class="tabbar">
        <button class="${state.section === 'overview' ? 'active' : ''}" onclick="setSection('overview')">📊 نظرة عامة</button>
        <button class="${state.section === 'cars' ? 'active' : ''}" onclick="setSection('cars')">🚗 السيارات</button>
        <button class="${state.section === 'reservations' ? 'active' : ''}" onclick="setSection('reservations')">📅 الحجوزات</button>
        <button class="${state.section === 'customers' ? 'active' : ''}" onclick="setSection('customers')">👥 الزبائن</button>
        <button class="${state.section === 'maintenance' ? 'active' : ''}" onclick="setSection('maintenance')">🔧 الصيانة</button>
      </div>
      
      ${state.section === 'overview' ? renderOverview() : ''}
      ${state.section === 'cars' ? renderCars() : ''}
      ${state.section === 'reservations' ? renderReservations() : ''}
      ${state.section === 'customers' ? renderCustomers() : ''}
      ${state.section === 'maintenance' ? renderMaintenance() : ''}
    </div>
  `;
}

/* ============================================================
   📊 نظرة عامة
   ============================================================ */
function renderOverview() {
  const total = db.cars.length;
  const available = db.cars.filter(c => c.status === 'available').length;
  const pending = db.reservations.filter(r => r.status === 'pending').length;
  const customers = db.customers.length;
  const alerts = db.cars.flatMap(c => getCarAlerts(c));
  const dangerAlerts = alerts.filter(a => a.level === 'danger').length;
  
  return `
    <div class="grid-2" style="margin-bottom:16px;">
      <div class="stat-card"><div class="icon">🚗</div><div><div class="label">السيارات</div><div class="value">${total}</div></div></div>
      <div class="stat-card"><div class="icon">✅</div><div><div class="label">متاحة</div><div class="value">${available}</div></div></div>
      <div class="stat-card"><div class="icon">📅</div><div><div class="label">حجوزات معلقة</div><div class="value">${pending}</div></div></div>
      <div class="stat-card"><div class="icon">👥</div><div><div class="label">الزبائن</div><div class="value">${customers}</div></div></div>
    </div>
    
    <div class="card">
      <div style="font-weight:bold;margin-bottom:8px;">⚠️ التنبيهات (${alerts.length})</div>
      ${alerts.length === 0 ? '<div class="text-muted text-center" style="padding:12px 0;">✅ جميع السيارات في حالة جيدة</div>' :
      alerts.slice(0, 5).map(a => `
        <div class="alert-row">
          <span class="emoji">${a.emoji}</span>
          <span>${a.text}</span>
          <span class="badge ${a.level === 'danger' ? 'badge-danger' : 'badge-warning'}">${a.level === 'danger' ? 'عاجل' : 'تنبيه'}</span>
        </div>
      `).join('')}
      ${alerts.length > 5 ? `<div class="text-muted" style="font-size:12px;text-align:center;">+ ${alerts.length - 5} تنبيهات أخرى</div>` : ''}
    </div>
  `;
}

/* ============================================================
   🚗 إدارة السيارات
   ============================================================ */
function renderCars() {
  return `
    <div class="flex-between mb-8">
      <div style="font-weight:bold;">🚗 السيارات (${db.cars.length})</div>
      <button class="btn btn-primary btn-sm" onclick="openAddCar()">➕ إضافة سيارة</button>
    </div>
    
    ${db.cars.map(car => {
      const meta = STATUS_META[car.status] || STATUS_META.available;
      const alerts = getCarAlerts(car);
      return `
        <div class="car-item">
          <div class="flex-between">
            <div>
              <div class="name">${esc(car.brand)} ${esc(car.model)} · ${car.year}</div>
              <div class="info">${esc(car.plate)} · ${fmtMoney(car.dailyPrice)}/يوم · ${car.currentKm} كم</div>
            </div>
            <span class="badge" style="background:${meta.color}22;color:${meta.color};border:1px solid ${meta.color}44;">${meta.label}</span>
          </div>
          ${alerts.length ? `<div class="actions-wrap">${alerts.map(a => `<span class="badge ${a.level === 'danger' ? 'badge-danger' : 'badge-warning'}">${a.emoji} ${a.text}</span>`).join('')}</div>` : ''}
          <div class="actions-wrap">
            <button class="btn btn-subtle btn-sm" onclick="openEditCar('${car.id}')">✏️ تعديل</button>
            <button class="btn btn-danger btn-sm" onclick="deleteCar('${car.id}')">🗑️ حذف</button>
            ${car.status === 'available' ? `<button class="btn btn-warning btn-sm" onclick="toMaintenance('${car.id}')" style="background:#F2B13422;color:#F2B134;border:1px solid #F2B13444;">🔧 صيانة</button>` : ''}
            ${car.status === 'maintenance' ? `<button class="btn btn-success btn-sm" onclick="fromMaintenance('${car.id}')">✅ نزع من الصيانة</button>` : ''}
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function openAddCar() {
  state.modal = { type: 'addCar' };
  render();
}

function submitAddCar() {
  const brand = document.getElementById('ac-brand').value.trim();
  const model = document.getElementById('ac-model').value.trim();
  const plate = document.getElementById('ac-plate').value.trim();
  const price = Number(document.getElementById('ac-price').value);
  const km = Number(document.getElementById('ac-km').value) || 0;
  
  if (!brand || !model || !plate || !price) return showToast('أكمل جميع الحقول', 'error');
  
  db.cars.push({
    id: uid(),
    brand, model, plate,
    year: new Date().getFullYear(),
    status: 'available',
    currentKm: km,
    dailyPrice: price,
    oilIntervalKm: 5000,
    lastOilKm: km,
    insuranceExpiry: addDays(todayStr(), 180),
    inspectionExpiry: addDays(todayStr(), 180)
  });
  
  saveData();
  state.modal = null;
  render();
  showToast('✅ تم إضافة السيارة');
}

function openEditCar(carId) {
  state.modal = { type: 'editCar', carId };
  render();
}

function submitEditCar() {
  const car = db.cars.find(c => c.id === state.modal.carId);
  if (!car) return;
  
  car.brand = document.getElementById('ec-brand').value.trim();
  car.model = document.getElementById('ec-model').value.trim();
  car.plate = document.getElementById('ec-plate').value.trim();
  car.year = Number(document.getElementById('ec-year').value) || 2024;
  car.dailyPrice = Number(document.getElementById('ec-price').value) || 0;
  car.currentKm = Number(document.getElementById('ec-km').value) || 0;
  car.status = document.getElementById('ec-status').value;
  
  saveData();
  state.modal = null;
  render();
  showToast('✅ تم تحديث السيارة');
}

function deleteCar(carId) {
  if (!confirm('تأكيد حذف السيارة؟')) return;
  db.cars = db.cars.filter(c => c.id !== carId);
  saveData();
  render();
  showToast('تم حذف السيارة');
}

function toMaintenance(carId) {
  if (!confirm('تأكيد تحويل السيارة إلى الصيانة؟')) return;
  const car = db.cars.find(c => c.id === carId);
  car.status = 'maintenance';
  saveData();
  render();
  showToast('🔧 تم تحويل السيارة إلى الصيانة');
}

function fromMaintenance(carId) {
  if (!confirm('تأكيد نزع السيارة من الصيانة؟')) return;
  const car = db.cars.find(c => c.id === carId);
  car.status = 'available';
  saveData();
  render();
  showToast('✅ تم نزع السيارة من الصيانة');
}

/* ============================================================
   📅 إدارة الحجوزات
   ============================================================ */
function renderReservations() {
  const sorted = [...db.reservations].sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
  const statusMap = {
    pending: { label: 'بانتظار التأكيد', cls: 'badge-warning' },
    confirmed: { label: 'قيد التنفيذ', cls: 'badge-success' },
    completed: { label: 'منتهي', cls: 'badge-info' },
    cancelled: { label: 'ملغى', cls: 'badge-danger' }
  };
  
  return `
    <div class="flex-between mb-8">
      <div style="font-weight:bold;">📅 الحجوزات (${db.reservations.length})</div>
      <button class="btn btn-success btn-sm" onclick="openManualRental()">📝 كراء يدوي</button>
    </div>
    
    ${sorted.length === 0 ? '<div class="empty"><div class="icon">📭</div><div>لا توجد حجوزات</div></div>' :
    sorted.map(r => {
      const car = db.cars.find(c => c.id === r.carId);
      const st = statusMap[r.status] || statusMap.pending;
      return `
        <div class="car-item">
          <div class="flex-between">
            <div>
              <div class="name">${car ? esc(car.brand) + ' ' + esc(car.model) : 'سيارة محذوفة'}</div>
              <div class="info">${esc(r.customerName)} · ${esc(r.customerPhone)}</div>
              <div class="info">${r.startDate} → ${r.endDate} · ${daysBetween(r.startDate, r.endDate)} يوم</div>
            </div>
            <span class="badge ${st.cls}">${st.label}</span>
          </div>
          <div class="flex-between" style="margin-top:8px;">
            <div class="price">${fmtMoney(r.totalPrice)}</div>
            <div class="actions-wrap">
              ${r.status === 'pending' ? `
                <button class="btn btn-success btn-sm" onclick="confirmReservation('${r.id}')">✔ تأكيد</button>
                <button class="btn btn-danger btn-sm" onclick="rejectReservation('${r.id}')">✕ رفض</button>
              ` : ''}
              ${r.status === 'confirmed' ? `
                <button class="btn btn-success btn-sm" onclick="completeReservation('${r.id}')">✅ إتمام الإرجاع</button>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function confirmReservation(resId) {
  const r = db.reservations.find(r => r.id === resId);
  if (!r) return;
  r.status = 'confirmed';
  r.exitTime = nowStr();
  const car = db.cars.find(c => c.id === r.carId);
  if (car) car.status = 'rented';
  db.finances.push({ id: uid(), type: 'income', category: 'إيجار', amount: r.totalPrice, carId: r.carId, date: nowStr(), note: `خروج السيارة - ${r.customerName}` });
  saveData();
  render();
  showToast('✅ تم تأكيد الحجز');
}

function rejectReservation(resId) {
  const r = db.reservations.find(r => r.id === resId);
  if (!r) return;
  r.status = 'cancelled';
  saveData();
  render();
  showToast('❌ تم رفض الحجز');
}

function completeReservation(resId) {
  state.modal = { type: 'completeRes', resId };
  render();
}

function submitCompleteRes() {
  const r = db.reservations.find(r => r.id === state.modal.resId);
  if (!r) return;
  const km = Number(document.getElementById('complete-km').value);
  if (!km) return showToast('أدخل قراءة الكيلومترات', 'error');
  const car = db.cars.find(c => c.id === r.carId);
  if (car) { car.status = 'available'; car.currentKm = km; }
  r.status = 'completed';
  r.returnTime = nowStr();
  saveData();
  state.modal = null;
  render();
  showToast('✅ تم إتمام الإرجاع');
}

function openManualRental() {
  state.modal = { type: 'manualRental' };
  render();
}

function submitManualRental() {
  const carId = document.getElementById('mr-car').value;
  const customerName = document.getElementById('mr-customer').value.trim();
  const customerPhone = document.getElementById('mr-phone').value.trim();
  const startDate = document.getElementById('mr-start').value;
  const endDate = document.getElementById('mr-end').value;
  
  if (!carId || !customerName || !customerPhone || !startDate || !endDate) {
    return showToast('أكمل جميع الحقول', 'error');
  }
  
  const car = db.cars.find(c => c.id === carId);
  if (!car) return showToast('السيارة غير موجودة', 'error');
  if (car.status !== 'available') return showToast('هذه السيارة غير متاحة', 'error');
  
  let customer = db.customers.find(c => c.phone === customerPhone);
  let customerId;
  
  if (!customer) {
    customerId = uid();
    db.customers.push({ id: customerId, name: customerName, phone: customerPhone, whitelisted: false, blacklisted: false, password: '123456', createdAt: todayStr() });
  } else {
    customerId = customer.id;
    customer.name = customerName;
  }
  
  const days = daysBetween(startDate, endDate);
  const totalPrice = days * car.dailyPrice;
  
  db.reservations.push({ id: uid(), carId, customerId, customerName, customerPhone, startDate, endDate, status: 'confirmed', totalPrice, createdAt: todayStr(), exitTime: nowStr(), isManual: true });
  car.status = 'rented';
  db.finances.push({ id: uid(), type: 'income', category: 'إيجار', amount: totalPrice, carId, date: nowStr(), note: `كراء يدوي - ${car.brand} ${car.model} - ${customerName}` });
  
  saveData();
  state.modal = null;
  render();
  showToast(`✅ تم كراء السيارة ${car.brand} ${car.model}`);
}

/* ============================================================
   👥 إدارة الزبائن
   ============================================================ */
function renderCustomers() {
  const resetRequests = db.passwordResetRequests || [];
  const pendingRequests = resetRequests.filter(r => r.status === 'pending');
  
  return `
    <div class="flex-between mb-8">
      <div style="font-weight:bold;">👥 الزبائن (${db.customers.length})</div>
      <button class="btn btn-primary btn-sm" onclick="openAddCustomer()">➕ إضافة زبون</button>
    </div>
    
    ${pendingRequests.length > 0 ? `
      <div class="card" style="border-color:#F2B134;">
        <div style="font-weight:bold;color:#F2B134;margin-bottom:8px;">🔒 طلبات استعادة الرمز السري (${pendingRequests.length})</div>
        ${pendingRequests.map(req => `
          <div class="flex-between" style="padding:6px 0;border-bottom:1px solid #232833;font-size:13px;">
            <div><div>${esc(req.name)}</div><div class="text-muted">📱 ${esc(req.phone)}</div></div>
            <div class="actions-wrap">
              <button class="btn btn-success btn-sm" onclick="resetPassword('${req.id}')">📤 إعادة إرسال</button>
              <button class="btn btn-danger btn-sm" onclick="rejectPasswordReset('${req.id}')">✕ رفض</button>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}
    
    ${db.customers.map(c => `
      <div class="car-item">
        <div class="flex-between">
          <div>
            <div class="name">${esc(c.name)} ${c.whitelisted ? '⭐' : ''}</div>
            <div class="info">📱 ${esc(c.phone)} · ${db.reservations.filter(r => r.customerId === c.id).length} حجز</div>
          </div>
          <div class="actions-wrap">
            <button class="btn ${c.whitelisted ? 'btn-success' : 'btn-subtle'} btn-sm" onclick="toggleWhitelist('${c.id}')">${c.whitelisted ? '⭐ موثّق' : 'توثيق'}</button>
            <button class="btn ${c.blacklisted ? 'btn-danger' : 'btn-subtle'} btn-sm" onclick="toggleBlacklist('${c.id}')">${c.blacklisted ? '🚫 محظور' : 'حظر'}</button>
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

function openAddCustomer() {
  state.modal = { type: 'addCustomer' };
  render();
}

function submitAddCustomer() {
  const name = document.getElementById('ac-name').value.trim();
  const phone = document.getElementById('ac-phone').value.trim();
  if (!name || !phone) return showToast('أدخل الاسم ورقم الهاتف', 'error');
  
  const existing = db.customers.find(c => c.phone === phone);
  if (existing) {
    if (existing.whitelisted) return showToast('هذا الزبون مميز بالفعل', 'error');
    existing.whitelisted = true;
    existing.blacklisted = false;
    saveData();
    state.modal = null;
    render();
    showToast(`تم ترقية ${name} إلى زبون مميز`);
    return;
  }
  
  db.customers.push({ id: uid(), name, phone, whitelisted: true, blacklisted: false, password: '123456', createdAt: todayStr() });
  saveData();
  state.modal = null;
  render();
  showToast(`✅ تم إضافة الزبون ${name}`);
}

function toggleWhitelist(custId) {
  const c = db.customers.find(c => c.id === custId);
  if (!c) return;
  c.whitelisted = !c.whitelisted;
  if (c.whitelisted) c.blacklisted = false;
  saveData();
  render();
  showToast(c.whitelisted ? '⭐ تم ترقية الزبون' : 'تم إزالة الترقية');
}

function toggleBlacklist(custId) {
  const c = db.customers.find(c => c.id === custId);
  if (!c) return;
  c.blacklisted = !c.blacklisted;
  if (c.blacklisted) c.whitelisted = false;
  saveData();
  render();
  showToast(c.blacklisted ? '🚫 تم حظر الزبون' : 'تم إلغاء الحظر');
}

function resetPassword(requestId) {
  const requests = db.passwordResetRequests || [];
  const req = requests.find(r => r.id === requestId);
  if (!req) return showToast('الطلب غير موجود', 'error');
  const customer = db.customers.find(c => c.id === req.customerId);
  if (!customer) return showToast('الزبون غير موجود', 'error');
  req.status = 'resolved';
  req.resolvedAt = nowStr();
  saveData();
  render();
  showToast(`📤 تم إعادة إرسال الرمز السري: ${customer.password}`);
}

function rejectPasswordReset(requestId) {
  const requests = db.passwordResetRequests || [];
  const req = requests.find(r => r.id === requestId);
  if (!req) return;
  req.status = 'rejected';
  req.resolvedAt = nowStr();
  saveData();
  render();
  showToast('تم رفض طلب استعادة الرمز السري');
}

/* ============================================================
   🔧 الصيانة
   ============================================================ */
function renderMaintenance() {
  const carsWithAlerts = db.cars.filter(c => getCarAlerts(c).length > 0);
  const maintenanceCars = db.cars.filter(c => c.status === 'maintenance');
  
  return `
    <div style="font-weight:bold;margin-bottom:12px;">🔧 تنبيهات الصيانة (${carsWithAlerts.length})</div>
    
    ${carsWithAlerts.map(car => {
      const alerts = getCarAlerts(car);
      return `
        <div class="car-item">
          <div style="font-weight:bold;font-size:14px;">${esc(car.brand)} ${esc(car.model)} · ${esc(car.plate)}</div>
          ${alerts.map(a => `
            <div class="flex-between" style="padding:4px 0;font-size:13px;">
              <span>${a.emoji} ${a.text}</span>
              <button class="btn btn-subtle btn-sm" onclick="openMaintResolve('${car.id}','${a.type}')">
                ${a.type === 'oil' ? 'تسجيل تغيير الزيت' : a.type === 'insurance' ? 'تجديد التأمين' : 'تجديد الفحص'}
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }).join('')}
    ${carsWithAlerts.length === 0 ? '<div class="empty"><div class="icon">✅</div><div>جميع السيارات ضمن الحالة الطبيعية</div></div>' : ''}
    
    ${maintenanceCars.length > 0 ? `
      <div style="font-weight:bold;color:#E5573F;margin-top:16px;margin-bottom:8px;">🔧 السيارات في الصيانة (${maintenanceCars.length})</div>
      ${maintenanceCars.map(car => `
        <div class="car-item" style="border-color:#E5573F;">
          <div class="flex-between">
            <div>
              <div style="font-weight:bold;">${esc(car.brand)} ${esc(car.model)} · ${car.year}</div>
              <div class="info">${esc(car.plate)} · ${car.currentKm} كم</div>
            </div>
            <div class="actions-wrap">
              <span class="badge badge-danger">🔧 في الصيانة</span>
              <button class="btn btn-success btn-sm" onclick="fromMaintenance('${car.id}')">✅ نزع من الصيانة</button>
            </div>
          </div>
        </div>
      `).join('')}
    ` : ''}
  `;
}

function openMaintResolve(carId, kind) {
  state.modal = { type: 'maintResolve', carId, kind };
  render();
}

function submitMaintResolve() {
  const { carId, kind } = state.modal;
  const car = db.cars.find(c => c.id === carId);
  if (!car) return;
  
  const amount = Number(document.getElementById('maint-amount').value) || 0;
  
  if (kind === 'oil') {
    car.lastOilKm = car.currentKm;
  } else if (kind === 'insurance') {
    car.insuranceExpiry = addDays(todayStr(), 365);
  } else if (kind === 'inspection') {
    car.inspectionExpiry = addDays(todayStr(), 365);
  }
  
  if (amount > 0) {
    db.finances.push({ id: uid(), type: 'expense', category: kind === 'oil' ? 'تغيير زيت' : kind === 'insurance' ? 'تجديد تأمين' : 'فحص فني', amount, carId: car.id, date: todayStr(), note: `${car.brand} ${car.model} · ${car.plate}` });
  }
  
  saveData();
  state.modal = null;
  render();
  showToast(`✅ تم تسجيل العملية`);
}

/* ============================================================
   🖼️ المودال
   ============================================================ */
function renderModal() {
  const m = state.modal;
  if (!m) return '';
  
  let title = '', content = '';
  
  if (m.type === 'addCar') {
    title = '➕ إضافة سيارة جديدة';
    content = `
      <div class="input-group"><label>الماركة</label><input id="ac-brand" class="input" placeholder="تويوتا" /></div>
      <div class="input-group"><label>الموديل</label><input id="ac-model" class="input" placeholder="كورولا" /></div>
      <div class="input-group"><label>رقم اللوحة</label><input id="ac-plate" class="input" placeholder="أ ب ج 1234" /></div>
      <div class="input-group"><label>السعر اليومي (د.ج)</label><input id="ac-price" class="input" type="number" placeholder="10000" /></div>
      <div class="input-group"><label>الكيلومترات الحالية</label><input id="ac-km" class="input" type="number" placeholder="0" /></div>
      <button class="btn btn-primary btn-block" onclick="submitAddCar()">✅ إضافة</button>
    `;
  }
  
  if (m.type === 'editCar') {
    const car = db.cars.find(c => c.id === m.carId);
    if (!car) return '';
    title = `✏️ تعديل ${esc(car.brand)} ${esc(car.model)}`;
    content = `
      <div class="input-group"><label>الماركة</label><input id="ec-brand" class="input" value="${esc(car.brand)}" /></div>
      <div class="input-group"><label>الموديل</label><input id="ec-model" class="input" value="${esc(car.model)}" /></div>
      <div class="input-group"><label>رقم اللوحة</label><input id="ec-plate" class="input" value="${esc(car.plate)}" /></div>
      <div class="input-group"><label>سنة الصنع</label><input id="ec-year" class="input" type="number" value="${car.year}" /></div>
      <div class="input-group"><label>السعر اليومي (د.ج)</label><input id="ec-price" class="input" type="number" value="${car.dailyPrice}" /></div>
      <div class="input-group"><label>الكيلومترات</label><input id="ec-km" class="input" type="number" value="${car.currentKm}" /></div>
      <div class="input-group"><label>الحالة</label><select id="ec-status" class="input">
        <option value="available" ${car.status === 'available' ? 'selected' : ''}>متاحة</option>
        <option value="rented" ${car.status === 'rented' ? 'selected' : ''}>مؤجَّرة</option>
        <option value="maintenance" ${car.status === 'maintenance' ? 'selected' : ''}>في الصيانة</option>
      </select></div>
      <button class="btn btn-primary btn-block" onclick="submitEditCar()">💾 حفظ</button>
    `;
  }
  
  if (m.type === 'completeRes') {
    title = '✅ إتمام إرجاع السيارة';
    content = `
      <div class="input-group"><label>قراءة الكيلومترات عند الإرجاع</label><input id="complete-km" class="input" type="number" placeholder="أدخل القراءة" /></div>
      <button class="btn btn-success btn-block" onclick="submitCompleteRes()">✅ تأكيد الإرجاع</button>
    `;
  }
  
  if (m.type === 'manualRental') {
    title = '📝 كراء يدوي';
    const availableCars = db.cars.filter(c => c.status === 'available');
    content = `
      <div class="input-group"><label>السيارة</label><select id="mr-car" class="input">
        <option value="">اختر السيارة</option>
        ${availableCars.map(c => `<option value="${c.id}">${esc(c.brand)} ${esc(c.model)} · ${esc(c.plate)} (${fmtMoney(c.dailyPrice)}/يوم)</option>`).join('')}
      </select></div>
      <div class="input-group"><label>اسم الزبون</label><input id="mr-customer" class="input" placeholder="أحمد محمد" /></div>
      <div class="input-group"><label>رقم الهاتف</label><input id="mr-phone" class="input" placeholder="05xxxxxxxx" /></div>

      <div class="input-group"><label>تاريخ التسليم</label><input id="mr-end" class="input" type="date" value="${addDays(todayStr(), 1)}" /></div>
      <button class="btn btn-success btn-block" onclick="submitManualRental()">✅ تأكيد الكراء</button>

  }
  
  if (m.type === 'addCustomer') {
    title = '➕ إضافة زبون مميز';
    content = `
      <div class="input-group"><label>الاسم الكامل</label><input id="ac-name" class="input" placeholder="أحمد محمد" /></div>
      <div class="input-group"><label>رقم الهاتف</label><input id="ac-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="text-muted" style="font-size:12px;margin-bottom:12px;">⭐ سيتم إضافة الزبون كزبون مميز</div>
      <button class="btn btn-primary btn-block" onclick="submitAddCustomer()">✅ إضافة</button>

  if (m.type === 'maintResolve') {

    if (!car) return '';
    const kindMap = { oil: 'تغيير الزيت', insurance: 'تجديد التأمين', inspection: 'تجديد الفحص الفني' };
    title = `🔧 ${kindMap[m.kind] || 'صيانة'} - ${esc(car.brand)} ${esc(car.model)}`;

      <div class="text-muted" style="margin-bottom:12px;">${esc(car.plate)} · ${car.currentKm} كم</div>

          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        ${content}
      </div>

}
