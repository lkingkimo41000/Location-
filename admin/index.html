/* ============================================================
   💾 قاعدة البيانات مع مزامنة السيرفر
   ============================================================ */
let db;
let dbRef = null;
let firebaseReady = false;
let appStarted = false;
let isSyncing = false;

// تحميل البيانات المحلية
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  db = saved ? JSON.parse(saved) : getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
} catch (e) {
  db = getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
}

function saveData() {
  saveLocal();
  if (dbRef && firebaseReady) {
    isSyncing = true;
    updateSyncStatus();
    dbRef.set(db)
      .then(() => {
        isSyncing = false;
        updateSyncStatus();
      })
      .catch((error) => {
        isSyncing = false;
        updateSyncStatus();
        console.warn('⚠️ فشل المزامنة مع السيرفر:', error.message);
      });
  }
}

/* ============================================================
   🔥 تهيئة Firebase والاتصال بالسيرفر
   ============================================================ */
function initFirebase() {
  const statusEl = document.getElementById('splash-status');
  try {
    if (typeof firebase === 'undefined') {
      throw new Error('Firebase غير محمل');
    }
    
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref(STORAGE_KEY);
    firebaseReady = true;
    
    if (statusEl) statusEl.textContent = '✅ متصل بالسيرفر location-c06ec';
    startSync();
    
  } catch (e) {
    console.warn('⚠️ فشل تهيئة Firebase:', e.message);
    if (statusEl) statusEl.textContent = '⚠️ تعذر الاتصال بالسيرفر';
    
    setTimeout(() => {
      if (!firebaseReady && !appStarted) {
        initFirebase();
      }
    }, 5000);
    
    setTimeout(() => {
      if (!appStarted) {
        appStarted = true;
        hideSplash();
        render();
        showToast('⚠️ تعذر الاتصال بالسيرفر - بيانات محلية', 'warning');
      }
    }, 3000);
  }
}

let firstSync = true;

function startSync() {
  if (!dbRef) return;
  
  dbRef.on('value', (snapshot) => {
    const remote = snapshot.val();
    if (remote) {
      const localData = db;
      const remoteData = remote;
      
      if (JSON.stringify(localData) !== JSON.stringify(remoteData)) {
        db = remoteData;
        saveLocal();
        if (firstSync) {
          firstSync = false;
          if (!appStarted) {
            appStarted = true;
            hideSplash();
            render();
            showToast('✅ مزامنة مع السيرفر location-c06ec', 'success');
          }
        } else {
          render();
          showToast('🔄 تم تحديث البيانات من السيرفر', 'success');
        }
      } else if (firstSync) {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('✅ متصل بالسيرفر location-c06ec', 'success');
        }
      }
    } else if (firstSync) {
      dbRef.set(db)
        .then(() => {
          console.log('✅ تم إرسال البيانات إلى السيرفر location-c06ec');
          firstSync = false;
          if (!appStarted) {
            appStarted = true;
            hideSplash();
            render();
            showToast('✅ مزامنة مع السيرفر location-c06ec', 'success');
          }
        })
        .catch((error) => {
          console.warn('⚠️ فشل إرسال البيانات:', error.message);
          firstSync = false;
          if (!appStarted) {
            appStarted = true;
            hideSplash();
            render();
            showToast('⚠️ بيانات محلية فقط', 'warning');
          }
        });
    }
    
    updateSyncStatus();
    
  }, (error) => {
    console.warn('⚠️ خطأ في الاتصال بالسيرفر:', error.message);
    if (firstSync && !appStarted) {
      firstSync = false;
      setTimeout(() => {
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('⚠️ وضع غير متصل - جاري المحاولة...', 'warning');
        }
      }, 3000);
    }
    updateSyncStatus();
  });
}

function updateSyncStatus() {
  const statusEl = document.querySelector('.sync-status');
  if (statusEl) {
    if (isSyncing) {
      statusEl.className = 'sync-status sync-syncing';
    } else if (firebaseReady) {
      statusEl.className = 'sync-status sync-online';
    } else {
      statusEl.className = 'sync-status sync-offline';
    }
  }
}

function hideSplash() {
  const el = document.getElementById('splash');

/* ============================================================
   🛢️ نظام تتبع الزيت والكيلومترات - تراكمي
   ============================================================ */
function getOilStatus(car) {
  if (!car || !car.oilChanges || car.oilChanges.length === 0) {
    return { status: 'warning', label: '⚠️ لم يتم تسجيل تغيير زيت', kmLeft: null };
  }
  
  const lastOil = car.oilChanges[car.oilChanges.length - 1];
  const kmSinceOil = car.currentKm - lastOil.km;
  const interval = db.settings?.oilInterval || OIL_CHANGE_INTERVAL;
  const kmLeft = interval - kmSinceOil;
  const warningKm = db.settings?.oilWarningKm || 100;
  
  let status, label;
  if (kmLeft <= 0) {
    status = 'critical';
    label = '⚠️ يجب تغيير الزيت فوراً!';
  } else if (kmLeft <= warningKm) {
    status = 'warning';
    label = `⚠️ تبقى ${kmLeft} كم لتغيير الزيت`;
  } else {
    status = 'good';
    label = `✅ تبقى ${kmLeft} كم`;
  }
  
  return { status, label, kmLeft, lastOilKm: lastOil.km, nextOilKm: lastOil.km + interval };
}

/* ============================================================
   🔄 دالة تحديث الكيلومترات - تراكمي
   ============================================================ */
function updateCarKm(carId, addedKm) {
  const car = db.cars.find(c => c.id === carId);
  if (!car) return false;
  
  // التحقق من أن القيمة المدخلة موجبة
  if (addedKm <= 0) {
    showToast('⚠️ يجب إدخال مسافة موجبة (أكبر من 0)', 'error');
    return false;
  }
  
  // حفظ الكيلومترات القديمة لعرضها في السجل
  const oldKm = car.currentKm;
  
  // إضافة الكيلومترات الجديدة إلى العداد الحالي (تراكمي)
  car.currentKm = oldKm + addedKm;
  
  // تسجيل في التاريخ مع توضيح الكمية المضافة
  if (!car.kmHistory) car.kmHistory = [];
  car.kmHistory.push({
    date: todayStr(),
    km: car.currentKm,
    added: addedKm,
    type: 'update'
  });
  
  // التحقق من تغيير الزيت
  checkOilChange(car);
  
  saveData();
  showToast(`✅ تمت إضافة ${addedKm} كم → المجموع: ${car.currentKm} كم`, 'success');
  return true;
}

function checkOilChange(car) {
  if (!car.oilChanges || car.oilChanges.length === 0) return;
  
  const lastOil = car.oilChanges[car.oilChanges.length - 1];
  const interval = db.settings?.oilInterval || OIL_CHANGE_INTERVAL;
  const kmSinceOil = car.currentKm - lastOil.km;
  const warningKm = db.settings?.oilWarningKm || 100;
  
  if (kmSinceOil >= interval - warningKm) {
    addNotification(
      `🛢️ تغيير زيت ${car.brand} ${car.model}`,
      `السيارة ${car.brand} ${car.model} (${car.plate}) تحتاج لتغيير الزيت. الكيلومترات الحالية: ${car.currentKm} كم، آخر تغيير: ${lastOil.km} كم`,
      'oil'
    );
  }
}

function recordOilChange(carId) {
  const car = db.cars.find(c => c.id === carId);
  if (!car) return false;
  
  const interval = db.settings?.oilInterval || OIL_CHANGE_INTERVAL;
  const currentKm = car.currentKm;
  
  if (!car.oilChanges) car.oilChanges = [];
  
  const lastOil = car.oilChanges.length > 0 ? car.oilChanges[car.oilChanges.length - 1] : null;
  if (lastOil && (currentKm - lastOil.km) < 1000) {
    if (!confirm(`⚠️ تم تغيير الزيت قبل ${currentKm - lastOil.km} كم فقط. هل أنت متأكد من تسجيل تغيير جديد؟`)) {
      return false;
    }
  }
  
  car.oilChanges.push({
    date: todayStr(),
    km: currentKm,
    nextOilKm: currentKm + interval
  });
  
  if (!car.kmHistory) car.kmHistory = [];
  car.kmHistory.push({
    date: todayStr(),
    km: currentKm,
    added: 0,
    type: 'oil_change'
  });
  
  saveData();
  showToast(`✅ تم تسجيل تغيير الزيت عند ${currentKm} كم`, 'success');
  return true;
}

function getKmHistory(carId) {
  const car = db.cars.find(c => c.id === carId);
  if (!car) return [];
  return car.kmHistory || [];
}

function getTotalAddedKm(carId) {
  const car = db.cars.find(c => c.id === carId);
  if (!car) return 0;
  
  let total = 0;
  if (car.kmHistory) {
    car.kmHistory.forEach(entry => {
      if (entry.type === 'update' && entry.added) {
        total += entry.added;
      }
    });
  }
  return total;
}

   ============================================================ */
function getStats() {
  const totalCars = db.cars.length;
  const available = db.cars.filter(c => c.status === 'available').length;
  const rented = db.cars.filter(c => c.status === 'rented').length;
  const maintenance = db.cars.filter(c => c.status === 'maintenance').length;
  const totalCustomers = db.customers.length;
  const pendingRes = db.reservations.filter(r => r.status === 'pending').length;
  const activeRes = db.reservations.filter(r => r.status === 'confirmed').length;
  const completedRes = db.reservations.filter(r => r.status === 'completed').length;
  const totalIncome = db.finances.filter(f => f.type === 'income').reduce((s, f) => s + f.amount, 0);
  const totalExpense = db.finances.filter(f => f.type === 'expense').reduce((s, f) => s + f.amount, 0);
  const netProfit = totalIncome - totalExpense;
  
  const carsNeedOil = db.cars.filter(c => {
    const oilStatus = getOilStatus(c);
    return oilStatus.status === 'critical' || oilStatus.status === 'warning';
  }).length;
  
  // إجمالي الكيلومترات المقطوعة لجميع السيارات
  let totalKm = 0;
  db.cars.forEach(c => {
    if (c.kmHistory) {
      c.kmHistory.forEach(entry => {
        if (entry.type === 'update' && entry.added) {
          totalKm += entry.added;
        }
      });
    }
  });
  
  return { totalCars, available, rented, maintenance, totalCustomers, pendingRes, activeRes, completedRes, totalIncome, totalExpense, netProfit, carsNeedOil, totalKm };
}

      addNotification(
        `🛢️ تغيير زيت ${car.brand} ${car.model}`,

      addNotification(

              <button class="btn btn-success btn-sm" onclick="completeReservation('${r.id}')">✅ إتمام الإرجاع</button>
            ` : ''}
            ${r.status === 'completed' ? `<span class="tag">✅ منتهي</span>` : ''}
            ${r.status === 'cancelled' ? `<span class="tag">❌ ملغى</span>` : ''}
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function confirmReservation(resId) {
  const r = db.reservations.find(r => r.id === resId);
  if (!r) return;
  r.status = 'confirmed';
  const car = db.cars.find(c => c.id === r.carId);
  if (car) car.status = 'rented';
  db.finances.push({ id: uid(), type: 'income', category: 'إيجار', amount: r.totalPrice, carId: r.carId, date: todayStr(), note: `خروج السيارة - ${r.customerName}` });
  saveData();
  render();
  showToast('✅ تم تأكيد الحجز');
}

function rejectReservation(resId) {
  const r = db.reservations.find(r => r.id === resId);
  if (!r) return;
  r.status = 'cancelled';
  saveData();
  render();
  showToast('❌ تم رفض الحجز');
}

function completeReservation(resId) {
  state.modal = { type: 'completeRes', resId };
  render();
}

function submitCompleteRes() {
  const r = db.reservations.find(r => r.id === state.modal.resId);
  if (!r) return;
  const km = Number(document.getElementById('complete-km').value);
  if (!km || km <= 0) return showToast('أدخل قراءة الكيلومترات (أكبر من 0)', 'error');
  const car = db.cars.find(c => c.id === r.carId);
  if (car) { 
    car.status = 'available'; 
    updateCarKm(car.id, km);
  }
  r.status = 'completed';
  saveData();
  state.modal = null;
  render();
  showToast('✅ تم إتمام الإرجاع');
}

function openManualRental() {
  state.modal = { type: 'manualRental' };
  render();
}

function submitManualRental() {
  const carId = document.getElementById('mr-car').value;
  const customerName = document.getElementById('mr-customer').value.trim();
  const customerPhone = document.getElementById('mr-phone').value.trim();
  const startDate = document.getElementById('mr-start').value;
  const endDate = document.getElementById('mr-end').value;
  
  if (!carId || !customerName || !customerPhone || !startDate || !endDate) {
    return showToast('أكمل جميع الحقول', 'error');
  }
  
  const car = db.cars.find(c => c.id === carId);
  if (!car) return showToast('السيارة غير موجودة', 'error');
  if (car.status !== 'available') return showToast('هذه السيارة غير متاحة', 'error');
  
  let customer = db.customers.find(c => c.phone === customerPhone);
  let customerId;
  
  if (!customer) {
    customerId = uid();
    db.customers.push({ id: customerId, name: customerName, phone: customerPhone, whitelisted: false, blacklisted: false, createdAt: todayStr() });
  } else {
    customerId = customer.id;
  }
  
  const days = daysBetween(startDate, endDate);
  const totalPrice = days * car.dailyPrice;
  
  db.reservations.push({ id: uid(), carId, customerId, customerName, customerPhone, startDate, endDate, status: 'confirmed', totalPrice, createdAt: todayStr() });
  car.status = 'rented';
  db.finances.push({ id: uid(), type: 'income', category: 'إيجار', amount: totalPrice, carId, date: todayStr(), note: `كراء يدوي - ${car.brand} ${car.model} - ${customerName}` });
  
  saveData();
  state.modal = null;
  render();
  showToast('✅ تم كراء السيارة');
}

function openQuickRental() {
  const availableCars = db.cars.filter(c => c.status === 'available');
  if (availableCars.length === 0) {
    return showToast('⚠️ لا توجد سيارات متاحة', 'error');
  }
  const car = availableCars[0];
  const customerName = prompt('👤 اسم الزبون:');
  if (!customerName) return;
  const customerPhone = prompt('📱 رقم الهاتف:');
  if (!customerPhone) return;
  const days = parseInt(prompt('📅 عدد الأيام:', '3'));
  if (!days || days < 1) return showToast('عدد أيام غير صالح', 'error');
  
  const startDate = todayStr();
  const endDate = addDays(startDate, days);
  const totalPrice = days * car.dailyPrice;
  
  let customer = db.customers.find(c => c.phone === customerPhone);
  let customerId;
  if (!customer) {
    customerId = uid();
    db.customers.push({ id: customerId, name: customerName, phone: customerPhone, whitelisted: false, blacklisted: false, createdAt: todayStr() });
  } else {
    customerId = customer.id;
  }
  
  db.reservations.push({ id: uid(), carId: car.id, customerId, customerName, customerPhone, startDate, endDate, status: 'confirmed', totalPrice, createdAt: todayStr() });
  car.status = 'rented';
  db.finances.push({ id: uid(), type: 'income', category: 'إيجار', amount: totalPrice, carId: car.id, date: todayStr(), note: `كراء سريع - ${car.brand} ${car.model} - ${customerName}` });
  
  saveData();
  render();
  showToast(`✅ تم كراء ${car.brand} ${car.model} لـ ${days} أيام`);
}

function openAddCustomer() {
  state.modal = { type: 'addCustomer' };
  render();
}

function submitAddCustomer() {
  const name = document.getElementById('ac-name').value.trim();
  const phone = document.getElementById('ac-phone').value.trim();
  if (!name || !phone) return showToast('أدخل الاسم ورقم الهاتف', 'error');
  
  const existing = db.customers.find(c => c.phone === phone);
  if (existing) {
    if (existing.whitelisted) return showToast('هذا الزبون مميز بالفعل', 'error');
    existing.whitelisted = true;
    existing.blacklisted = false;
    saveData();
    state.modal = null;
    render();
    showToast('تم ترقية الزبون');
    return;
  }
  
  db.customers.push({ id: uid(), name, phone, whitelisted: true, blacklisted: false, createdAt: todayStr() });
  saveData();
  state.modal = null;
  render();
  showToast('✅ تم إضافة الزبون');
}

function toggleWhitelist(custId) {
  const c = db.customers.find(c => c.id === custId);
  if (!c) return;
  c.whitelisted = !c.whitelisted;
  if (c.whitelisted) c.blacklisted = false;
  saveData();
  render();
  showToast(c.whitelisted ? '⭐ تم ترقية الزبون' : 'تم إزالة الترقية');
}

function toggleBlacklist(custId) {
  const c = db.customers.find(c => c.id === custId);
  if (!c) return;
  c.blacklisted = !c.blacklisted;
  if (c.blacklisted) c.whitelisted = false;
  saveData();
  render();
  showToast(c.blacklisted ? '🚫 تم حظر الزبون' : 'تم إلغاء الحظر');
}

function openDeleteCustomer(custId) {
  state.modal = { type: 'deleteCustomer', customerId: custId };
  render();
}

function confirmDeleteCustomer() {
  const password = document.getElementById('delete-password').value.trim();
  const customerId = state.modal.customerId;
  const customer = db.customers.find(c => c.id === customerId);
  if (!customer) return;
  
  const settings = db.settings || {};
  const deletePassword = settings.deletePassword || 'admin123';
  
  if (password !== deletePassword) {
    showToast('❌ رمز الحذف غير صحيح', 'error');
    return;
  }
  
  db.customers = db.customers.filter(c => c.id !== customerId);
  saveData();
  state.modal = null;
  render();
  showToast('✅ تم حذف الزبون');
}

      <div style="max-height:400px;overflow-y:auto;">
        <table>
          <thead><tr><th>التاريخ</th><th>العداد الكلي</th><th>المضاف</th><th>النوع</th></tr></thead>
          <tbody>
            ${history.length === 0 ? `<tr><td colspan="4" class="text-center text-muted">لا يوجد تاريخ</td></tr>` :
            history.map(h => {
              const typeMap = { initial: 'بداية', update: 'تحديث', oil_change: '🛢️ تغيير زيت' };
              return `<tr>
                <td>${h.date}</td>
                <td>${h.km} كم</td>
                <td>${h.added ? '+'+h.added : '-'}</td>
                <td>${typeMap[h.type] || h.type}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div style="margin-top:12px;padding:8px;background:#1A212E;border-radius:6px;">
          <span class="text-muted">📏 إجمالي الكيلومترات المقطوعة:</span>
          <strong style="color:#F2B134;">${getTotalAddedKm(car.id)} كم</strong>
        </div>
      </div>
    `;
    wide = true;
  }
  
  if (m.type === 'notifications') {
    const notifs = db.notifications || [];
    title = `🔔 الإشعارات (${notifs.filter(n => !n.read).length} غير مقروءة)`;
    content = `
      <div style="max-height:400px;overflow-y:auto;">
        ${notifs.length === 0 ? '<div class="text-center text-muted" style="padding:20px;">لا توجد إشعارات</div>' :
        notifs.slice().reverse().map(n => `
          <div style="padding:10px;margin-bottom:6px;background:${n.read ? '#1A212E' : '#1F2633'};border-radius:8px;border-right:3px solid ${n.type === 'oil' ? '#F2B134' : '#5B8DEF'};">
            <div class="flex-between">
              <div style="font-weight:700;">${n.title}</div>
              <div style="font-size:10px;color:#8B93A1;">${n.date}</div>
            </div>
            <div style="font-size:13px;color:#8B93A1;margin:4px 0;">${n.message}</div>
            ${!n.read ? `<button class="btn btn-sm btn-subtle" onclick="markNotificationRead('${n.id}')">✅ تحديد كمقروء</button>` : ''}
          </div>
        `).join('')}
      </div>
      <button class="btn btn-sm btn-subtle btn-block" onclick="markAllNotificationsRead()">📖 تحديد الكل كمقروء</button>
    `;
    wide = true;
  }
  
  if (m.type === 'completeRes') {
    title = '✅ إتمام إرجاع السيارة';
    content = `
      <div class="input-group"><label>📏 المسافة المقطوعة (كم)</label><input id="complete-km" class="input" type="number" placeholder="أدخل المسافة المقطوعة" min="1" /></div>
      <button class="btn btn-success btn-block" onclick="submitCompleteRes()">✅ تأكيد الإرجاع</button>
    `;
  }
  
  if (m.type === 'manualRental') {
    title = '📝 كراء يدوي';
    const availableCars = db.cars.filter(c => c.status === 'available');
    content = `
      <div class="input-group"><label>السيارة</label><select id="mr-car" class="input">
        <option value="">اختر السيارة</option>
        ${availableCars.map(c => `<option value="${c.id}">${esc(c.brand)} ${esc(c.model)} · ${esc(c.plate)} (${fmtMoney(c.dailyPrice)}/يوم) - ${c.currentKm} كم</option>`).join('')}
      </select></div>
      <div class="grid-2">
        <div class="input-group"><label>اسم الزبون</label><input id="mr-customer" class="input" placeholder="أحمد محمد" /></div>
        <div class="input-group"><label>رقم الهاتف</label><input id="mr-phone" class="input" placeholder="05xxxxxxxx" /></div>
      </div>
      <div class="grid-2">
        <div class="input-group"><label>تاريخ الاستلام</label><input id="mr-start" class="input" type="date" value="${todayStr()}" /></div>
        <div class="input-group"><label>تاريخ التسليم</label><input id="mr-end" class="input" type="date" value="${addDays(todayStr(), 1)}" /></div>
      </div>
      <button class="btn btn-success btn-block" onclick="submitManualRental()">✅ تأكيد الكراء</button>
    `;
  }
  
  if (m.type === 'addCustomer') {
    title = '➕ إضافة زبون مميز';
    content = `
      <div class="grid-2">
        <div class="input-group"><label>الاسم الكامل</label><input id="ac-name" class="input" placeholder="أحمد محمد" /></div>
        <div class="input-group"><label>رقم الهاتف</label><input id="ac-phone" class="input" placeholder="05xxxxxxxx" /></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="submitAddCustomer()">✅ إضافة</button>
    `;
  }
  
  if (m.type === 'deleteCustomer') {
    const customer = db.customers.find(c => c.id === m.customerId);
    if (!customer) return '';
    title = `🗑️ حذف الزبون: ${esc(customer.name)}`;
    content = `
      <div class="input-group">
        <label>🔐 أدخل رمز الحذف</label>
        <input id="delete-password" class="input" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')confirmDeleteCustomer()" />
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-danger" style="flex:1;" onclick="confirmDeleteCustomer()">🗑️ حذف</button>
        <button class="btn btn-subtle" style="flex:1;" onclick="closeModal()">إلغاء</button>
      </div>
    `;
  }
  
  if (m.type === 'financeAdd') {
    title = '➕ إضافة عملية مالية';
    content = `
      <div class="grid-2">
        <div class="input-group"><label>النوع</label><select id="fa-type" class="input">
          <option value="income">إيراد</option>
          <option value="expense">مصروف</option>
        </select></div>
        <div class="input-group"><label>الفئة</label><input id="fa-category" class="input" placeholder="إيجار" /></div>
        <div class="input-group"><label>المبلغ (د.ج)</label><input id="fa-amount" class="input" type="number" /></div>
        <div class="input-group"><label>السيارة</label><select id="fa-car" class="input">
          <option value="">بدون سيارة</option>
          ${db.cars.map(c => `<option value="${c.id}">${esc(c.brand)} ${esc(c.model)}</option>`).join('')}
        </select></div>
      </div>
      <div class="input-group"><label>التاريخ</label><input id="fa-date" class="input" type="date" value="${todayStr()}" /></div>
      <div class="input-group"><label>الملاحظة</label><input id="fa-note" class="input" placeholder="تفاصيل" /></div>
      <button class="btn btn-primary btn-block" onclick="submitFinanceAdd()">💾 حفظ</button>
    `;
  }
  
  return `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-box ${wide ? 'wide' : ''}">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        ${content}
      </div>
    </div>
  `;
}

/* ============================================================
   🎯 دوال تحكم
   ============================================================ */
function setSection(section) {
  state.section = section;
  render();
}

function closeModal() {
  state.modal = null;
  render();
}

/* ============================================================
   🚀 بدء التطبيق
   ============================================================ */
setTimeout(() => {
  if (typeof firebase !== 'undefined') {
    initFirebase();
  } else {
    const checkFirebase = setInterval(() => {
      if (typeof firebase !== 'undefined') {
        clearInterval(checkFirebase);
        initFirebase();
      }
    }, 1000);
    
    setTimeout(() => {
      clearInterval(checkFirebase);
      if (!appStarted && !firebaseReady) {
        appStarted = true;
        hideSplash();
        render();
        showToast('⚠️ تعذر الاتصال بالسيرفر location-c06ec - بيانات محلية', 'warning');
      }
    }, 6000);
  }
}, 500);

console.log('🌐 السيرفر: location-c06ec');
console.log('📊 السيارات:', db.cars.length);
console.log('👥 الزبائن:', db.customers.length);
console.log('📅 الحجوزات:', db.reservations.length);
console.log('🔌 الحالة:', firebaseReady ? '🟢 متصل بالسيرفر' : '🔴 غير متصل');
</script>
</body>
