<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Adam Location · تأجير السيارات</title>
<meta name="theme-color" content="#0F1216" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#0F1216; --surface:#1A1E25; --surface2:#232833; --surface3:#2C323F;
    --border:#323847; --amber:#F2B134; --amber-ink:#1A1305; --text:#F1EEE6;
    --muted:#8B93A1; --success:#3FA796; --danger:#E5573F; --info:#5B8DEF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:'Tajawal',-apple-system,'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
  .font-display{font-family:'Cairo','Tajawal',sans-serif;}
  a{color:inherit;}
  input,select,textarea,button{font-family:inherit;}
  input::placeholder{color:var(--muted);}
  select option{background:var(--surface2);}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 40px;}
  header.app-header{position:sticky;top:0;z-index:40;background:rgba(15,18,22,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:12px 16px;}
  .header-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;}
  .logo-svg{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(242,177,52,0.18);}
  .logo-svg svg{width:28px;height:28px;}
  .tabbar{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin:16px 0;overflow-x:auto;}
  .tabbar button{flex:1;white-space:nowrap;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .tabbar button.active{background:var(--amber);color:var(--amber-ink);}
  .grid{display:grid;gap:12px;grid-template-columns:1fr;}
  @media(min-width:560px){.grid.cols-2{grid-template-columns:1fr 1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;}
  .row-between{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .muted{color:var(--muted);}
  .fs-12{font-size:12px;}
  .fs-13{font-size:13px;}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer;border:1px solid transparent;transition:transform .1s;}
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--amber);color:var(--amber-ink);}
  .btn-subtle{background:var(--surface2);color:var(--text);border-color:var(--border);}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-bottom:12px;}
  .field label{font-weight:800;color:var(--muted);}
  .input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-size:14px;outline:none;}
  .input:focus{border-color:var(--amber);}
  .btn-block{width:100%;margin-top:4px;}
  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 10px;text-align:center;color:var(--muted);}
  .empty .icon{font-size:30px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(6,8,10,0.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;animation:fadeIn .2s ease-out;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:60;transition:opacity .3s, visibility .3s;opacity:0;visibility:hidden;}
  .toast.show{opacity:1;visibility:visible;}
  .toast.error{background:var(--danger);}
  .car-price{font-family:'Cairo',sans-serif;font-weight:800;color:var(--amber);font-size:17px;}
  .divider{border-top:1px solid var(--border);margin:10px 0;}
  .total-box{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:12px;padding:11px 14px;margin-bottom:10px;}
  ::-webkit-scrollbar{width:0;height:0;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="toast-el" class="toast"></div>
<div id="app"></div>

<script>
/* ============================ الثوابت والأدوات ============================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowStr = () => {
  const d = new Date();
  return d.toISOString().slice(0, 10) + " " + d.toTimeString().slice(0, 5);
};
const addDays = (dateStr, n) => { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtMoney = (n) => `${Number(n || 0).toLocaleString("en-US")} د.ج`;
const fmtKm = (n) => `${Number(n || 0).toLocaleString("en-US")} كم`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function seedData() {
  const t = todayStr();
  return {
    cars: [
      { id: "c1", plate: "أ ب ج 1234", brand: "تويوتا", model: "كورولا", year: 2022, status: "available", currentKm: 18500, dailyPrice: 12000, oilIntervalKm: 5000, lastOilKm: 15000, insuranceExpiry: addDays(t, 20), inspectionExpiry: addDays(t, 200) },
      { id: "c2", plate: "د هـ و 5678", brand: "هيونداي", model: "إلنترا", year: 2021, status: "rented", currentKm: 42000, dailyPrice: 10000, oilIntervalKm: 5000, lastOilKm: 41800, insuranceExpiry: addDays(t, 5), inspectionExpiry: addDays(t, 15) },
      { id: "c3", plate: "ز ح ط 9012", brand: "كيا", model: "سيراتو", year: 2023, status: "maintenance", currentKm: 9000, dailyPrice: 11000, oilIntervalKm: 5000, lastOilKm: 4500, insuranceExpiry: addDays(t, 300), inspectionExpiry: addDays(t, 300) },
      { id: "c4", plate: "ك ل م 3456", brand: "نيسان", model: "صني", year: 2020, status: "available", currentKm: 61000, dailyPrice: 8500, oilIntervalKm: 5000, lastOilKm: 58200, insuranceExpiry: addDays(t, 60), inspectionExpiry: addDays(t, 90) },
    ],
    customers: [],
    reservations: [],
    kmHistory: [],
    finances: [],
    contact: { phone: "0555555555", platformLink: "https://wa.me/213555555555", platformLabel: "واتساب" },
    passwordResetRequests: []
  };
}

/* ============================ إعدادات Firebase (تم تصحيح الرابط) ============================ */
const firebaseConfig = {
  apiKey: "AIzaSyCNp8pVNX84MyMgIsuiV9K6DE3tximsrRg",
  authDomain: "location-fded9.firebaseapp.com",
  databaseURL: "https://location-fded9-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "location-fded9",
  storageBucket: "location-fded9.firebasestorage.app",
  messagingSenderId: "418304217437",
  appId: "1:418304217437:web:3656ef204f2b453abe18b4",
  measurementId: "G-LQ7CP86DR5"
};

let dbRef;
try {
  firebase.initializeApp(firebaseConfig);
  dbRef = firebase.database().ref(); // حفظ مباشر في الجذر
} catch (e) {
  dbRef = { on: () => {}, update: () => {}, set: () => {} };
}

/* ============================ الحالة والتخزين ============================ */
let state = {
  db: null,
  page: "login",
  custView: "browse",
  currentUser: null,
  modal: null
};

function saveDb(db) {
  try {
    localStorage.setItem("rental-db-v2", JSON.stringify(db));
    if (dbRef && typeof dbRef.update === 'function') {
      dbRef.update(db).catch(() => {}); // إرسال للسحابة
    }
  } catch (e) {}
}

function showToast(msg, type = "success") {
  const el = document.getElementById("toast-el");
  el.textContent = msg;
  el.className = "toast show" + (type === "error" ? " error" : "");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.className = "toast"; }, 2600);
}

/* ============================ التصيير (Render) ============================ */
function render() {
  document.getElementById("app").innerHTML = renderApp();
}

function App_updateDb(next) { 
  state.db = next; 
  saveDb(next); 
  render(); 
}
window.App = {};

function renderApp() {
  return `
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <div class="logo-svg">
            <svg viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="18" fill="var(--amber)" opacity="0.9"/>
              <path d="M10 20 L18 10 L28 20 L22 32 L14 32 Z" fill="#1A1305"/>
              <circle cx="20" cy="20" r="6" fill="var(--amber)"/>
              <circle cx="18" cy="18" r="2" fill="#1A1305"/>
              <circle cx="22" cy="22" r="2" fill="#1A1305"/>
            </svg>
          </div>
          <span class="font-display">Adam Location</span>
        </div>
        ${state.currentUser ? `<button class="btn btn-ghost btn-sm" onclick="App.logout()">🚪 خروج</button>` : ""}
      </div>
    </header>
    <div class="wrap">
      ${!state.currentUser ? renderAuth() : renderCustomer()}
    </div>
    ${state.modal ? renderModal() : ""}
  `;
}

/* ============================ تسجيل الدخول / إنشاء حساب ============================ */
function renderAuth() {
  if (state.page === "register") return renderRegister();
  return renderLogin();
}

function renderLogin() {
  return `
    <div style="max-width:400px;margin:40px auto;text-align:center;">
      <div style="font-size:40px;margin-bottom:10px;">🚗</div>
      <div class="font-display" style="font-weight:800;font-size:20px;">مرحباً بك</div>
      <div class="muted fs-13" style="margin-bottom:16px;">سجل الدخول أو أنشئ حساباً جديداً</div>
      <div class="field"><label>رقم الهاتف</label><input id="login-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="field"><label>الرمز السري</label><input id="login-password" type="password" class="input" placeholder="********" /></div>
      <button class="btn btn-primary btn-block" onclick="App.doLogin()">🔑 تسجيل الدخول</button>
      <div style="margin:16px 0;border-top:1px solid var(--border);padding-top:16px;">
        <button class="btn btn-subtle btn-block" onclick="App.showRegister()">📝 تسجيل حساب جديد</button>
      </div>
    </div>
  `;
}

function renderRegister() {
  return `
    <div style="max-width:400px;margin:40px auto;text-align:center;">
      <div style="font-size:40px;margin-bottom:10px;">🚗</div>
      <div class="font-display" style="font-weight:800;font-size:20px;">إنشاء حساب جديد</div>
      <div class="field"><label>الاسم الكامل</label><input id="reg-name" class="input" placeholder="مثال: أحمد العلي" /></div>
      <div class="field"><label>رقم الهاتف</label><input id="reg-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="field"><label>الرمز السري (6 أرقام)</label><input id="reg-password" type="password" class="input" placeholder="******" /></div>
      <button class="btn btn-primary btn-block" onclick="App.doRegister()">✅ إنشاء الحساب</button>
      <div style="margin-top:16px;"><button class="btn btn-ghost btn-sm" onclick="App.showLogin()">🔙 العودة لتسجيل الدخول</button></div>
    </div>
  `;
}

App.showRegister = () => { state.page = "register"; render(); };
App.showLogin = () => { state.page = "login"; render(); };

App.doRegister = () => {
  const name = document.getElementById("reg-name").value.trim();
  const phone = document.getElementById("reg-phone").value.trim();
  const password = document.getElementById("reg-password").value;

  if (!name || !phone || !password) return showToast("أكمل جميع الحقول", "error");
  if (password.length < 6) return showToast("الرمز السري يجب أن يكون 6 أحرف", "error");

  const db = state.db;
  if (db.customers.find(c => c.phone === phone)) return showToast("هذا الرقم مسجل بالفعل", "error");

  const newCustomer = { id: uid(), name, phone, password, whitelisted: false, blacklisted: false, createdAt: todayStr() };
  
  // ✅ هذا السطر هو الذي يرسل البيانات إلى Firebase
  App_updateDb({ ...db, customers: [...db.customers, newCustomer] });

  state.currentUser = { id: newCustomer.id, name, phone, whitelisted: false };
  state.page = "browse";
  showToast(`✅ مرحباً ${name}`);
  render();
};

App.doLogin = () => {
  const phone = document.getElementById("login-phone").value.trim();
  const password = document.getElementById("login-password").value;

  const customer = state.db.customers.find(c => c.phone === phone);
  if (!customer) return showToast("رقم الهاتف غير مسجل", "error");
  if (customer.password !== password) return showToast("الرمز السري غير صحيح", "error");

  state.currentUser = { id: customer.id, name: customer.name, phone, whitelisted: customer.whitelisted };
  showToast(`مرحباً ${customer.name}`);
  render();
};

App.logout = () => { state.currentUser = null; state.page = "login"; render(); };

/* ============================ واجهة الزبون ============================ */
function renderCustomer() {
  const db = state.db;
  const contact = db.contact || {};
  return `
    ${contact.phone ? `<div class="card" style="margin:12px 0;"><div>📞 ${esc(contact.phone)}</div></div>` : ""}
    <div class="tabbar">
      <button class="${state.custView === "browse" ? "active" : ""}" onclick="App.setCustView('browse')">🚙 تصفح السيارات</button>
      <button class="${state.custView === "mybookings" ? "active" : ""}" onclick="App.setCustView('mybookings')">📅 حجوزاتي</button>
    </div>
    ${state.custView === "browse" ? renderBrowse() : renderMyBookings()}
  `;
}

App.setCustView = (v) => { state.custView = v; render(); };

function renderBrowse() {
  const cars = state.db.cars.filter(c => c.status === "available");
  if (cars.length === 0) return `<div class="empty"><div class="icon">🚗</div><div>لا توجد سيارات متاحة</div></div>`;
  return `<div class="grid cols-2">${cars.map(c => `
    <div class="card">
      <div class="font-display" style="font-weight:800;">${esc(c.brand)} ${esc(c.model)}</div>
      <div class="muted fs-12">${c.year} · ${esc(c.plate)}</div>
      <div class="divider"></div>
      <div class="row-between" style="align-items:center;">
        <div><span class="car-price">${c.dailyPrice}</span> <span class="muted fs-12">د.ج/يوم</span></div>
        ${state.currentUser.whitelisted ? `<button class="btn btn-primary btn-sm" onclick="App.openBooking('${c.id}')">📝 استئجار</button>` : `<span class="badge" style="background:var(--amber)22;color:var(--amber);">🔒 للمميزين</span>`}
      </div>
    </div>
  `).join("")}</div>`;
}

function renderMyBookings() {
  const list = state.db.reservations.filter(r => r.customerId === state.currentUser.id);
  if (list.length === 0) return `<div class="empty"><div class="icon">📅</div><div>لا توجد حجوزات</div></div>`;
  return list.map(r => `
    <div class="card" style="margin-bottom:10px;">
      <div style="font-weight:800;">${r.customerName}</div>
      <div class="muted fs-12">${r.startDate} → ${r.endDate} · ${fmtMoney(r.totalPrice)}</div>
    </div>
  `).join("");
}

App.openBooking = (carId) => {
  if (!state.currentUser.whitelisted) return showToast("الحجز للمميزين فقط", "error");
  state.modal = { type: "booking", carId };
  render();
};

App.submitBooking = () => {
  const car = state.db.cars.find(c => c.id === state.modal.carId);
  const name = document.getElementById("bk-name").value.trim();
  const phone = document.getElementById("bk-phone").value.trim();
  const start = document.getElementById("bk-start").value;
  const end = document.getElementById("bk-end").value;

  if (!name || !phone || !start || !end) return showToast("املأ جميع الحقول", "error");
  const days = Math.max(1, daysBetween(start, end));

  const reservation = {
    id: uid(), carId: car.id, customerId: state.currentUser.id,
    customerName: name, customerPhone: phone, startDate: start, endDate: end,
    status: "pending", totalPrice: days * car.dailyPrice, createdAt: todayStr()
  };
  const cars = state.db.cars.map(c => c.id === car.id ? { ...c, status: "rented" } : c);

  state.modal = null;
  App_updateDb({ ...state.db, cars, reservations: [reservation, ...state.db.reservations] });
  showToast("تم إرسال طلب الحجز");
};

App.closeModal = () => { state.modal = null; render(); };

function renderModal() {
  const car = state.db.cars.find(c => c.id === state.modal.carId);
  return `
    <div class="modal-backdrop" onclick="if(event.target===this)App.closeModal()">
      <div class="modal">
        <div class="modal-head"><h3>استئجار ${esc(car.brand)} ${esc(car.model)}</h3><button class="modal-close" onclick="App.closeModal()">✕</button></div>
        <div class="field"><label>الاسم</label><input id="bk-name" class="input" /></div>
        <div class="field"><label>رقم الهاتف</label><input id="bk-phone" class="input" /></div>
        <div class="grid cols-2">
          <div class="field"><label>من</label><input id="bk-start" type="date" class="input" value="${todayStr()}" /></div>
          <div class="field"><label>إلى</label><input id="bk-end" type="date" class="input" value="${addDays(todayStr(), 1)}" /></div>
        </div>
        <button class="btn btn-primary btn-block" onclick="App.submitBooking()">تأكيد الحجز</button>
      </div>
    </div>
  `;
}

/* ============================ التحميل الأولي والمزامنة ============================ */
(function init() {
  const cached = localStorage.getItem("rental-db-v2");
  state.db = cached ? JSON.parse(cached) : seedData();
  render();
})();

let __firstLoad = true;
setTimeout(() => { if (!window.__firebaseResponded) showToast("جارٍ التحميل..."); }, 3000);

dbRef.on("value", (snapshot) => {
  window.__firebaseResponded = true;
  const remote = snapshot.val();
  if (remote) {
    const user = state.currentUser;
    state.db = remote;
    if (user) {
      const u = state.db.customers.find(c => c.id === user.id);
      if (u) state.currentUser = { id: u.id, name: u.name, phone: u.phone, whitelisted: u.whitelisted };
    }
  } else if (__firstLoad) {
    state.db = seedData();
    dbRef.set(state.db);
  }
  __firstLoad = false;
  render();
}, () => {});
</script>
</body>
</html>
