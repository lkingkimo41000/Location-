    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    margin-top: 20px;

    height: 40px;
    border: 4px solid #232833;
    border-top-color: #F2B134;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }

    font-size: 13px;

  .card {

    padding: 16px;

  .btn {

  .dial-row {

  .dial-ring {

<script>
/* ============================================================
   إعدادات Firebase
   ============================================================ */
const STORAGE_KEY = "rental-db-v2";
const firebaseConfig = {
  apiKey: "AIzaSyCNp8pVNX84MyMgIsuiV9K6DE3tximsrRg",
  authDomain: "location-fded9.firebaseapp.com",
  databaseURL: "https://location-fded9-default-rtdb.firebaseio.com",
  projectId: "location-fded9",
  storageBucket: "location-fded9.firebasestorage.app",
  messagingSenderId: "418304217437",
  appId: "1:418304217437:web:3656ef204f2b453abe18b4",
  measurementId: "G-LQ7CP86DR5"
};

/* ============================================================
   الأدوات المساعدة
   ============================================================ */
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowStr = () => {
  const d = new Date();
  return d.toISOString().slice(0, 10) + ' ' + d.toTimeString().slice(0, 5);
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const addDays = (dateStr, n) => {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
};
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtMoney = (n) => `${Number(n || 0).toLocaleString("en-US")} د.ج`;
const fmtKm = (n) => `${Number(n || 0).toLocaleString("en-US")} كم`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => 
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
);

/* ============================================================
   Toast
   ============================================================ */
function showToast(msg, type = "success") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.className = "toast"; }, 3000);
}

/* ============================================================
   البيانات الافتراضية
   ============================================================ */
function getDefaultData() {
  const t = todayStr();
  return {
    cars: [
      { id: "c1", plate: "أ ب ج 1234", brand: "تويوتا", model: "كورولا", year: 2022, status: "available", currentKm: 18500, dailyPrice: 12000, oilIntervalKm: 5000, lastOilKm: 15000, insuranceExpiry: addDays(t, 20), inspectionExpiry: addDays(t, 200) },
      { id: "c2", plate: "د هـ و 5678", brand: "هيونداي", model: "إلنترا", year: 2021, status: "available", currentKm: 42000, dailyPrice: 10000, oilIntervalKm: 5000, lastOilKm: 41800, insuranceExpiry: addDays(t, 5), inspectionExpiry: addDays(t, 15) },
      { id: "c3", plate: "ز ح ط 9012", brand: "كيا", model: "سيراتو", year: 2023, status: "available", currentKm: 9000, dailyPrice: 11000, oilIntervalKm: 5000, lastOilKm: 4500, insuranceExpiry: addDays(t, 300), inspectionExpiry: addDays(t, 300) },
      { id: "c4", plate: "ك ل م 3456", brand: "نيسان", model: "صني", year: 2020, status: "available", currentKm: 61000, dailyPrice: 8500, oilIntervalKm: 5000, lastOilKm: 58200, insuranceExpiry: addDays(t, 60), inspectionExpiry: addDays(t, 90) },
    ],
    customers: [],
    reservations: [],
    kmHistory: [],
    finances: [],
    contact: {
      phone: "0555555555",
      platformLink: "https://wa.me/213555555555",
      platformLabel: "واتساب"
    },
    passwordResetRequests: []
  };
}

/* ============================================================
   قاعدة البيانات المحلية
   ============================================================ */
let db;
let dbRef = null;
let firebaseReady = false;

// محاولة تحميل البيانات المحلية أولاً
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  db = saved ? JSON.parse(saved) : getDefaultData();
} catch (e) {
  db = getDefaultData();
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  } catch (e) {
    console.warn("فشل حفظ البيانات محلياً");
  }
}

/* ============================================================
   تهيئة Firebase
   ============================================================ */
let firebaseInitAttempts = 0;
const MAX_FIREBASE_ATTEMPTS = 3;

function initFirebase() {
  firebaseInitAttempts++;
  
  try {
    // التحقق من وجود Firebase
    if (typeof firebase === 'undefined') {
      throw new Error('Firebase غير محمل');
    }
    
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref(STORAGE_KEY);
    firebaseReady = true;
    
    // بدء المزامنة
    startSync();
    
    updateSplashStatus('✅ متصل بالخادم');
    
  } catch (e) {
    console.warn('فشل تهيئة Firebase:', e.message);
    updateSplashStatus('⚠️ وضع غير متصل - بيانات محلية');
    
    if (firebaseInitAttempts < MAX_FIREBASE_ATTEMPTS) {
      // محاولة إعادة التهيئة بعد 3 ثواني
      setTimeout(initFirebase, 3000);
    } else {
      // تشغيل التطبيق بدون Firebase
      firebaseReady = false;
      startApp();
    }
  }
}

/* ============================================================
   المزامنة مع Firebase
   ============================================================ */
let syncActive = false;
let firstSync = true;

function startSync() {
  if (!dbRef) return;
  
  syncActive = true;
  
  // الاستماع للتغييرات من Firebase
  dbRef.on('value', (snapshot) => {
    const remote = snapshot.val();
    
    if (remote) {
      // دمج البيانات من الخادم مع المحلية
      db = remote;
      saveLocal();
      
      if (firstSync) {
        firstSync = false;
        startApp();
      } else {
        render();
      }
      
      updateSplashStatus('✅ مزامنة مع الخادم');
      
    } else if (firstSync) {
      // أول تشغيل - إرسال البيانات إلى Firebase
      dbRef.set(db)
        .then(() => {
          console.log('✅ تم إرسال البيانات الأولية إلى Firebase');
          firstSync = false;
          startApp();
        })
        .catch((err) => {
          console.warn('فشل إرسال البيانات:', err);
          firstSync = false;
          startApp();
        });
    }
    
  }, (error) => {
    console.warn('خطأ في Firebase:', error);
    updateSplashStatus('⚠️ خطأ في الاتصال - بيانات محلية');
    
    if (firstSync) {
      firstSync = false;
      startApp();
    }
  });
}

/* ============================================================
   حفظ البيانات (محلياً + Firebase)
   ============================================================ */
function saveData() {
  saveLocal();
  
  if (dbRef && firebaseReady) {
    dbRef.set(db).catch(() => {});
  }
}

/* ============================================================
   إدارة شاشة التحميل
   ============================================================ */
function updateSplashStatus(msg) {
  const el = document.getElementById('splash-status');
  if (el) el.textContent = msg;
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (el) {
    el.classList.add('hidden');
    setTimeout(() => { el.style.display = 'none'; }, 500);
  }
}

/* ============================================================
   حالة التطبيق
   ============================================================ */
let state = {
  mode: 'choose', // choose | customer | admin
  customer: null,
  adminSection: 'overview',
  modal: null,
  tab: 'cars',
  selectedCar: null,
  startDate: todayStr(),
  endDate: addDays(todayStr(), 1),
  adminCustSearch: ''
};

/* ============================================================
   الثوابت
   ============================================================ */
const STATUS_META = {
  available: { label: 'متاحة', color: '#3FA796' },
  rented: { label: 'مؤجَّرة', color: '#5B8DEF' },
  maintenance: { label: 'في الصيانة', color: '#E5573F' }
};

const RES_STATUS_META = {
  pending: { label: 'بانتظار التأكيد', color: '#F2B134' },
  confirmed: { label: 'قيد التنفيذ', color: '#5B8DEF' },
  completed: { label: 'منتهي', color: '#3FA796' },
  cancelled: { label: 'ملغى', color: '#8B93A1' }
};

/* ============================================================
   دوال تنبيهات السيارات
   ============================================================ */
function getCarAlerts(car) {
  const t = todayStr();
  const alerts = [];
  const kmLeft = car.lastOilKm + car.oilIntervalKm - car.currentKm;
  if (kmLeft <= 500) {
    alerts.push({
      type: 'oil',
      level: kmLeft <= 0 ? 'danger' : 'warning',
      emoji: '🛢️',
      text: kmLeft <= 0 ? `تجاوز تغيير الزيت بـ ${fmtKm(Math.abs(kmLeft))}` : `تغيير الزيت بعد ${fmtKm(kmLeft)}`
    });
  }
  const insDays = daysBetween(t, car.insuranceExpiry);
  if (insDays <= 30) {
    alerts.push({
      type: 'insurance',
      level: insDays <= 0 ? 'danger' : 'warning',
      emoji: '🛡️',
      text: insDays <= 0 ? `انتهى التأمين منذ ${Math.abs(insDays)} يوم` : `ينتهي التأمين بعد ${insDays} يوم`
    });
  }
  const inspDays = daysBetween(t, car.inspectionExpiry);
  if (inspDays <= 30) {
    alerts.push({
      type: 'inspection',
      level: inspDays <= 0 ? 'danger' : 'warning',
      emoji: '📋',
      text: inspDays <= 0 ? `انتهى الفحص الفني منذ ${Math.abs(inspDays)} يوم` : `ينتهي الفحص الفني بعد ${inspDays} يوم`
    });
  }
  return alerts;
}

/* ============================================================
   التصيير الرئيسي
   ============================================================ */
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  
  if (state.mode === 'choose') {
    app.innerHTML = renderChoose();
  } else if (state.mode === 'customer') {
    app.innerHTML = renderCustomerApp();
  } else if (state.mode === 'admin') {
    app.innerHTML = renderAdminApp();
  } else {
    app.innerHTML = renderChoose();
  }
}

/* ============================================================
   بدء التطبيق
   ============================================================ */
function startApp() {
  hideSplash();
  render();
}

/* ============================================================
   اختيار الوضع
   ============================================================ */

   ============================================================
   تطبيق الزبون

   ============================================================ */

  if (!state.customer) {

  }
  
  return `

  if (!customer) {

  }
  
  if (customer.blacklisted) {

  state.customer = customer;

App.submitRegister = () => {
  const name = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-password').value.trim();
  const confirm = document.getElementById('reg-confirm').value.trim();
  
  if (!name || !phone || !password) {
    return showToast('أكمل جميع الحقول', 'error');
  }
  if (password.length < 4) {
    return showToast('الرمز السري يجب أن يكون 4 أحرف على الأقل', 'error');
  }
  if (password !== confirm) {
    return showToast('الرمز السري غير متطابق', 'error');
  }
  if (db.customers.find(c => c.phone === phone)) {
    return showToast('هذا الرقم مسجل بالفعل', 'error');
  }
  
  const newCustomer = {
    id: uid(),
    name,
    phone,
    password,
    whitelisted: false,
    blacklisted: false,
    createdAt: todayStr()
  };
  
  db.customers.push(newCustomer);
  saveData();
  
  state.customer = newCustomer;
  state.modal = null;
  state.tab = 'cars';
  render();
  showToast(`✅ تم التسجيل بنجاح! مرحباً ${name}`);
};

App.submitForgotPassword = () => {

  const customer = db.customers.find(c => c.phone === phone);

  // إضافة طلب استعادة
  if (!db.passwordResetRequests) db.passwordResetRequests = [];
  db.passwordResetRequests.push({
    id: uid(),
    customerId: customer.id,
    name: customer.name,
    phone: customer.phone,
    requestedAt: todayStr(),
    status: 'pending'
  });

/* ====== حجز سيارة ====== */
App.openBooking = (carId) => {
  state.selectedCar = db.cars.find(c => c.id === carId);
  state.startDate = todayStr();
  state.endDate = addDays(todayStr(), 1);
  state.modal = { type: 'booking' };
  render();
};

App.submitBooking = () => {
  const car = state.selectedCar;
  const startDate = document.getElementById('book-start').value;
  const endDate = document.getElementById('book-end').value;
  
  if (!startDate || !endDate) {
    return showToast('اختر تاريخ البداية والنهاية', 'error');
  }
  if (daysBetween(startDate, endDate) < 1) {
    return showToast('تاريخ النهاية يجب أن يكون بعد البداية', 'error');
  }
  
  // التحقق من التداخل
  const overlapping = db.reservations.some(r =>
    r.carId === car.id &&
    r.status !== 'cancelled' &&
    r.status !== 'completed' &&
    ((startDate >= r.startDate && startDate < r.endDate) ||
     (endDate > r.startDate && endDate <= r.endDate) ||
     (startDate <= r.startDate && endDate >= r.endDate))
  );
  
  if (overlapping) {
    return showToast('هذه السيارة محجوزة في الفترة المحددة', 'error');
  }
  
  const days = daysBetween(startDate, endDate);
  const totalPrice = days * car.dailyPrice;
  
  const reservation = {
    id: uid(),
    carId: car.id,
    customerId: state.customer.id,
    customerName: state.customer.name,
    customerPhone: state.customer.phone,
    startDate,
    endDate,
    status: 'pending',
    totalPrice,
    createdAt: todayStr()
  };
  
  db.reservations.push(reservation);
  saveData();
  
  state.modal = null;
  render();
  showToast(`✅ تم إرسال طلب الحجز! في انتظار التأكيد.`);
};

App.updateBookingTotal = () => {
  const start = document.getElementById('book-start').value;
  const end = document.getElementById('book-end').value;
  if (!start || !end || !state.selectedCar) return;
  
  const days = daysBetween(start, end);
  const total = days * state.selectedCar.dailyPrice;
  
  const el = document.getElementById('booking-total');
  if (el) {
    el.innerHTML = `
      <div style="color:#8B93A1;font-size:13px;">الإجمالي</div>
      <div style="font-size:20px;font-weight:bold;color:#F2B134;">${fmtMoney(total)}</div>
      <div style="font-size:12px;color:#8B93A1;">${days} يوم × ${fmtMoney(state.selectedCar.dailyPrice)}</div>
    `;
  }
};

/* ====== كراء يدوي ====== */
App.openManualRental = () => {
  state.modal = { type: 'manualRental' };
  render();
};

App.submitManualRental = () => {
  const carId = document.getElementById('mr-car').value;
  const customerName = document.getElementById('mr-customer').value.trim();
  const customerPhone = document.getElementById('mr-phone').value.trim();
  const startDate = document.getElementById('mr-start').value;
  const endDate = document.getElementById('mr-end').value;
  
  if (!carId || !customerName || !customerPhone || !startDate || !endDate) {
    return showToast('أكمل جميع الحقول', 'error');
  }
  
  const car = db.cars.find(c => c.id === carId);
  if (!car) return showToast('السيارة غير موجودة', 'error');
  if (car.status !== 'available') return showToast('هذه السيارة غير متاحة', 'error');
  
  let customer = db.customers.find(c => c.phone === customerPhone);
  let customerId;
  
  if (!customer) {
    customerId = uid();
    db.customers.push({
      id: customerId,
      name: customerName,
      phone: customerPhone,
      whitelisted: false,
      blacklisted: false,
      password: '123456',
      createdAt: todayStr()
    });
  } else {
    customerId = customer.id;
    if (customer.name !== customerName) {
      customer.name = customerName;
    }
  }
  
  const days = daysBetween(startDate, endDate);
  const totalPrice = days * car.dailyPrice;
  
  const reservation = {
    id: uid(),
    carId,
    customerId,
    customerName,
    customerPhone,
    startDate,
    endDate,
    status: 'confirmed',
    totalPrice,
    createdAt: todayStr(),
    exitTime: nowStr(),
    isManual: true
  };
  
  car.status = 'rented';
  
  db.reservations.push(reservation);
  db.finances.push({
    id: uid(),
    type: 'income',
    category: 'إيجار',
    amount: totalPrice,
    carId,
    date: nowStr(),
    note: `كراء يدوي - ${car.brand} ${car.model} - ${customerName}`
  });
  
  saveData();
  state.modal = null;
  render();
  showToast(`✅ تم كراء السيارة ${car.brand} ${car.model}`);
};

App.submitAddCustomer = () => {

  const phone = document.getElementById('ac-phone').value.trim();
  
  if (!name || !phone) return showToast('أدخل الاسم ورقم الهاتف', 'error');

  if (existing) {
    if (existing.whitelisted) return showToast('هذا الزبون مميز بالفعل', 'error');

    saveData();
    state.modal = null;

    return;
  }
  
  db.customers.push({
    id: uid(),
    name,
    phone,
    whitelisted: true,
    blacklisted: false,
    password: '123456',
    createdAt: todayStr()
  });
  
  saveData();
  state.modal = null;
  render();
  showToast(`✅ تم إضافة الزبون ${name}`);
};

  const c = db.customers.find(c => c.id === custId);

  c.whitelisted = !c.whitelisted;

  saveData();

  showToast(c.whitelisted ? '⭐ تم ترقية الزبون' : 'تم إزالة الترقية');
};

App.toggleBlacklist = (custId) => {
  const c = db.customers.find(c => c.id === custId);
  if (!c) return;
  c.blacklisted = !c.blacklisted;
  if (c.blacklisted) c.whitelisted = false;
  saveData();

  showToast(c.blacklisted ? '🚫 تم حظر الزبون' : 'تم إلغاء الحظر');
};

App.resetPassword = (requestId) => {
  const requests = db.passwordResetRequests || [];
  const req = requests.find(r => r.id === requestId);
  if (!req) return showToast('الطلب غير موجود', 'error');
  
  const customer = db.customers.find(c => c.id === req.customerId);
  if (!customer) return showToast('الزبون غير موجود', 'error');
  
  req.status = 'resolved';
  req.resolvedAt = nowStr();
  saveData();
  render();
  showToast(`📤 تم إعادة إرسال الرمز السري: ${customer.password}`);
};

App.rejectPasswordReset = (requestId) => {
  const requests = db.passwordResetRequests || [];

App.submitMaintResolve = () => {
  const { carId, kind } = state.modal;
  const car = db.cars.find(c => c.id === carId);
  if (!car) return;
  
  const amount = Number(document.getElementById('maint-amount').value) || 0;
  
  if (kind === 'oil') {
    car.lastOilKm = car.currentKm;
  } else if (kind === 'insurance') {
    car.insuranceExpiry = addDays(todayStr(), 365);
  } else if (kind === 'inspection') {
    car.inspectionExpiry = addDays(todayStr(), 365);
  }
  
  if (amount > 0) {
    db.finances.push({
      id: uid(),
      type: 'expense',
      category: kind === 'oil' ? 'تغيير زيت' : kind === 'insurance' ? 'تجديد تأمين' : 'فحص فني',
      amount,
      carId: car.id,
      date: todayStr(),
      note: `${car.brand} ${car.model} · ${car.plate}`
    });
  }
  
  saveData();
  state.modal = null;
  render();
  showToast(`✅ تم تسجيل العملية`);
};

        <div style="font-weight:bold;color:#F2B134;font-size:18px;">${fmtMoney(car.dailyPrice)} / يوم</div>
      </div>
      <div class="input-group"><label>تاريخ الاستلام</label><input id="book-start" class="input" type="date" value="${state.startDate}" onchange="App.updateBookingTotal()" /></div>
      <div class="input-group"><label>تاريخ التسليم</label><input id="book-end" class="input" type="date" value="${state.endDate}" onchange="App.updateBookingTotal()" /></div>
      <div id="booking-total" style="background:#232833;border-radius:10px;padding:12px;text-align:center;margin-bottom:12px;">
        <div class="text-muted" style="font-size:13px;">الإجمالي</div>
        <div style="font-size:20px;font-weight:bold;color:#F2B134;">${fmtMoney(days * car.dailyPrice)}</div>
        <div style="font-size:12px;color:#8B93A1;">${days} يوم × ${fmtMoney(car.dailyPrice)}</div>
      </div>
      <button class="btn btn-success" onclick="App.submitBooking()">✅ تأكيد الحجز</button>
    `;
  }
  
  /* ----- إضافة سيارة ----- */
  if (m.type === 'addCar') {
    title = '➕ إضافة سيارة جديدة';
    content = `
      <div class="input-group"><label>الماركة</label><input id="ac-brand" class="input" placeholder="تويوتا" /></div>
      <div class="input-group"><label>الموديل</label><input id="ac-model" class="input" placeholder="كورولا" /></div>
      <div class="input-group"><label>رقم اللوحة</label><input id="ac-plate" class="input" placeholder="أ ب ج 1234" /></div>
      <div class="input-group"><label>السعر اليومي (د.ج)</label><input id="ac-price" class="input" type="number" placeholder="10000" /></div>
      <div class="input-group"><label>الكيلومترات الحالية</label><input id="ac-km" class="input" type="number" placeholder="0" /></div>
      <button class="btn btn-primary" onclick="App.submitAddCar()">✅ إضافة</button>
    `;
  }
  
  /* ----- تعديل سيارة ----- */
  if (m.type === 'editCar') {
    const car = db.cars.find(c => c.id === m.carId);
    if (!car) return '';
    title = `✏️ تعديل ${esc(car.brand)} ${esc(car.model)}`;
    content = `
      <div class="input-group"><label>الماركة</label><input id="ec-brand" class="input" value="${esc(car.brand)}" /></div>
      <div class="input-group"><label>الموديل</label><input id="ec-model" class="input" value="${esc(car.model)}" /></div>
      <div class="input-group"><label>رقم اللوحة</label><input id="ec-plate" class="input" value="${esc(car.plate)}" /></div>
      <div class="input-group"><label>سنة الصنع</label><input id="ec-year" class="input" type="number" value="${car.year}" /></div>
      <div class="input-group"><label>السعر اليومي (د.ج)</label><input id="ec-price" class="input" type="number" value="${car.dailyPrice}" /></div>
      <div class="input-group"><label>الكيلومترات الحالية</label><input id="ec-km" class="input" type="number" value="${car.currentKm}" /></div>
      <div class="input-group"><label>الحالة</label><select id="ec-status" class="input">
        <option value="available" ${car.status === 'available' ? 'selected' : ''}>متاحة</option>
        <option value="rented" ${car.status === 'rented' ? 'selected' : ''}>مؤجَّرة</option>
        <option value="maintenance" ${car.status === 'maintenance' ? 'selected' : ''}>في الصيانة</option>
      </select></div>
      <button class="btn btn-primary" onclick="App.submitEditCar()">💾 حفظ التعديلات</button>
    `;
  }
  
  /* ----- تحديث كيلومترات ----- */
  if (m.type === 'kmUpdate') {
    const car = db.cars.find(c => c.id === m.carId);
    if (!car) return '';
    title = `📟 تحديث كيلومترات ${esc(car.brand)} ${esc(car.model)}`;
    content = `
      <div class="text-muted" style="margin-bottom:12px;">القراءة الحالية: ${fmtKm(car.currentKm)}</div>
      <div class="input-group"><label>القراءة الجديدة</label><input id="km-value" class="input" type="number" placeholder="أدخل القراءة الجديدة" /></div>
      <button class="btn btn-primary" onclick="App.submitKmUpdate()">💾 حفظ</button>
    `;
  }
  
  /* ----- إتمام الإرجاع ----- */
  if (m.type === 'completeRes') {
    const r = db.reservations.find(r => r.id === m.resId);
    if (!r) return '';
    const car = db.cars.find(c => c.id === r.carId);
    title = '✅ إتمام إرجاع السيارة';
    content = `
      <div class="text-muted" style="margin-bottom:12px;">السيارة: ${car ? esc(car.brand) + ' ' + esc(car.model) : 'غير معروفة'}</div>
      <div class="input-group"><label>الكيلومترات عند الإرجاع</label><input id="complete-km" class="input" type="number" placeholder="أدخل القراءة" /></div>
      <button class="btn btn-success" onclick="App.submitCompleteRes()">✅ تأكيد الإرجاع</button>
    `;
  }
  
  /* ----- إضافة زبون ----- */
  if (m.type === 'addCustomer') {
    title = '➕ إضافة زبون مميز';
    content = `
      <div class="input-group"><label>الاسم الكامل</label><input id="ac-name" class="input" placeholder="أحمد محمد" /></div>
      <div class="input-group"><label>رقم الهاتف</label><input id="ac-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="text-muted" style="font-size:12px;margin-bottom:12px;">⭐ سيتم إضافة الزبون كزبون مميز</div>
      <button class="btn btn-primary" onclick="App.submitAddCustomer()">✅ إضافة الزبون</button>
    `;
  }
  
  /* ----- كراء يدوي ----- */
  if (m.type === 'manualRental') {
    title = '📝 كراء يدوي';
    const availableCars = db.cars.filter(c => c.status === 'available');
    content = `
      <div class="input-group"><label>السيارة</label>
        <select id="mr-car" class="input">
          <option value="">اختر السيارة</option>
          ${availableCars.map(c => `<option value="${c.id}">${esc(c.brand)} ${esc(c.model)} · ${esc(c.plate)} (${fmtMoney(c.dailyPrice)}/يوم)</option>`).join('')}
        </select>
      </div>
      <div class="input-group"><label>اسم الزبون</label><input id="mr-customer" class="input" placeholder="أحمد محمد" /></div>
      <div class="input-group"><label>رقم الهاتف</label><input id="mr-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="input-group"><label>تاريخ الاستلام</label><input id="mr-start" class="input" type="date" value="${todayStr()}" /></div>
      <div class="input-group"><label>تاريخ التسليم</label><input id="mr-end" class="input" type="date" value="${addDays(todayStr(), 1)}" /></div>
      <button class="btn btn-success" onclick="App.submitManualRental()">✅ تأكيد الكراء</button>
    `;
  }
  
  /* ----- صيانة ----- */
  if (m.type === 'maintResolve') {
    const car = db.cars.find(c => c.id === m.carId);
    if (!car) return '';
    const kindMap = {
      oil: 'تغيير الزيت',
      insurance: 'تجديد التأمين',
      inspection: 'تجديد الفحص الفني'
    };
    title = `🔧 ${kindMap[m.kind] || 'صيانة'} - ${esc(car.brand)} ${esc(car.model)}`;
    content = `
      <div class="text-muted" style="margin-bottom:12px;">${esc(car.plate)} · ${fmtKm(car.currentKm)}</div>
      <div class="input-group"><label>تكلفة العملية (د.ج - اختياري)</label><input id="maint-amount" class="input" type="number" placeholder="0" /></div>
      <button class="btn btn-primary" onclick="App.submitMaintResolve()">✅ تأكيد</button>
    `;
  }
  
  return `
    <div class="modal-overlay" onclick="if(event.target===this)App.closeModal()">
      <div class="modal-box ${wide ? 'wide' : ''}">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="App.closeModal()">✕</button>
        </div>
        ${content}
      </div>
    </div>
  `;
}

App.closeModal = () => {
  state.modal = null;
  render();
};

/* ============================================================
   ============================================================
   كائن App العام
   ============================================================
   ============================================================ */

window.App = {
  // عام
  setMode: (mode) => {
    state.mode = mode;
    state.adminSection = 'overview';
    render();
  },
  closeModal: App.closeModal,
  
  // الزبون
  customerLogin: App.customerLogin,
  customerLogout: App.customerLogout,
  openRegister: App.openRegister,
  submitRegister: App.submitRegister,
  openForgotPassword: App.openForgotPassword,
  submitForgotPassword: App.submitForgotPassword,
  setTab: App.setTab,
  openBooking: App.openBooking,
  submitBooking: App.submitBooking,
  updateBookingTotal: App.updateBookingTotal,
  cancelReservation: App.cancelReservation,
  
  // الأدمن
  setAdminSection: App.setAdminSection,
  openAddCar: App.openAddCar,
  submitAddCar: App.submitAddCar,
  openEditCar: App.openEditCar,
  submitEditCar: App.submitEditCar,
  deleteCar: App.deleteCar,
  openKmUpdate: App.openKmUpdate,
  submitKmUpdate: App.submitKmUpdate,
  toMaintenance: App.toMaintenance,
  fromMaintenance: App.fromMaintenance,
  confirmReservation: App.confirmReservation,
  rejectReservation: App.rejectReservation,
  completeReservation: App.completeReservation,
  submitCompleteRes: App.submitCompleteRes,
  printContract: App.printContract,
  openManualRental: App.openManualRental,
  submitManualRental: App.submitManualRental,
  openAddCustomer: App.openAddCustomer,
  submitAddCustomer: App.submitAddCustomer,
  toggleWhitelist: App.toggleWhitelist,
  toggleBlacklist: App.toggleBlacklist,
  setAdminCustSearch: App.setAdminCustSearch,
  resetPassword: App.resetPassword,
  rejectPasswordReset: App.rejectPasswordReset,
  openMaintResolve: App.openMaintResolve,
  submitMaintResolve: App.submitMaintResolve,
};

   بدء التشغيل
   ============================================================ */

// محاولة تهيئة Firebase بعد تحميل الصفحة
setTimeout(() => {
  // التحقق من وجود Firebase
  if (typeof firebase !== 'undefined') {
    initFirebase();
  } else {
    // Firebase لم يتم تحميله، استخدم البيانات المحلية
    updateSplashStatus('⚠️ جارٍ التحميل...');
    setTimeout(() => {
      firstSync = false;
      startApp();
    }, 1000);
  }
}, 500);
