<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Adam Location · تأجير السيارات</title>
<meta name="theme-color" content="#0F1216" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    --bg:#0F1216; --surface:#1A1E25; --surface2:#232833; --surface3:#2C323F;
    --border:#323847; --amber:#F2B134; --amber-ink:#1A1305; --text:#F1EEE6;
    --muted:#8B93A1; --success:#3FA796; --danger:#E5573F; --info:#5B8DEF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:'Tajawal',-apple-system,'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
  .font-display{font-family:'Cairo','Tajawal',sans-serif;}
  a{color:inherit;}
  input,select,textarea,button{font-family:inherit;}
  input::placeholder{color:var(--muted);}
  select option{background:var(--surface2);}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 40px;}
  header.app-header{position:sticky;top:0;z-index:40;background:rgba(15,18,22,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:12px 16px;}
  .header-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;}
  .logo-svg{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(242,177,52,0.18);}
  .logo-svg svg{width:28px;height:28px;}
  .tabbar{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin:16px 0;overflow-x:auto;}
  .tabbar button{flex:1;white-space:nowrap;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .tabbar button.active{background:var(--amber);color:var(--amber-ink);}
  .grid{display:grid;gap:12px;grid-template-columns:1fr;}
  @media(min-width:560px){.grid.cols-2{grid-template-columns:1fr 1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;}
  .row-between{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .muted{color:var(--muted);}
  .fs-12{font-size:12px;}
  .fs-13{font-size:13px;}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer;border:1px solid transparent;transition:transform .1s;}
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--amber);color:var(--amber-ink);}
  .btn-subtle{background:var(--surface2);color:var(--text);border-color:var(--border);}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-bottom:12px;}
  .field label{font-weight:800;color:var(--muted);}
  .input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-size:14px;outline:none;}
  .input:focus{border-color:var(--amber);}
  .btn-block{width:100%;margin-top:4px;}
  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 10px;text-align:center;color:var(--muted);}
  .empty .icon{font-size:30px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(6,8,10,0.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;animation:fadeIn .2s ease-out;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:60;transition:opacity .3s, visibility .3s;opacity:0;visibility:hidden;}
  .toast.show{opacity:1;visibility:visible;}
  .toast.error{background:var(--danger);}
  .car-price{font-family:'Cairo',sans-serif;font-weight:800;color:var(--amber);font-size:17px;}
  .divider{border-top:1px solid var(--border);margin:10px 0;}
  .total-box{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:12px;padding:11px 14px;margin-bottom:10px;}
  ::-webkit-scrollbar{width:0;height:0;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="toast-el" class="toast"></div>
<div id="app"></div>

<script>
/* ============================ الثوابت والأدوات ============================ */
const STORAGE_KEY = "rental-db-v2";

/* ============================ إعدادات Firebase (يجب أن تكون مطابقة تماماً لإعدادات تطبيق الأدمن) ============================ */
const firebaseConfig = {
  apiKey: "AIzaSyCNp8pVNX84MyMgIsuiV9K6DE3tximsrRg",
  authDomain: "location-fded9.firebaseapp.com",
  databaseURL: "https://location-fded9-default-rtdb.firebaseio.com",
  projectId: "location-fded9",
  storageBucket: "location-fded9.firebasestorage.app",
  messagingSenderId: "418304217437",
  appId: "1:418304217437:web:3656ef204f2b453abe18b4",
  measurementId: "G-LQ7CP86DR5"
};
// حماية: لو سكربت Firebase (gstatic.com) محجوب أو فشل تحميله، لا نكسر التطبيق كاملاً
let dbRef;
try {
  firebase.initializeApp(firebaseConfig);
  dbRef = firebase.database().ref(STORAGE_KEY);
} catch (e) {
  dbRef = { on: () => {}, set: () => {} }; // وضع محلي فقط بدون مزامنة سحابية
}

const STATUS_META = {
  available: { label: "متاحة", color: "var(--success)" },
  rented: { label: "مؤجَّرة", color: "var(--info)" },
  maintenance: { label: "في الصيانة", color: "var(--danger)" },
};
const RES_STATUS_META = {
  pending: { label: "بانتظار التأكيد", color: "var(--amber)" },
  confirmed: { label: "قيد التنفيذ", color: "var(--info)" },
  completed: { label: "منتهي", color: "var(--success)" },
  cancelled: { label: "ملغى", color: "var(--muted)" },
};

const todayStr = () => new Date().toISOString().slice(0, 10);
const nowStr = () => {
  const d = new Date();
  const date = d.toISOString().slice(0, 10);
  const time = d.toTimeString().slice(0, 5);
  return `${date} ${time}`;
};
const addDays = (dateStr, n) => { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtMoney = (n) => `${Number(n || 0).toLocaleString("en-US")} د.ج`;
const fmtKm = (n) => `${Number(n || 0).toLocaleString("en-US")} كم`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function seedData() {
  const t = todayStr();
  return {
    cars: [
      { id: "c1", plate: "أ ب ج 1234", brand: "تويوتا", model: "كورولا", year: 2022, status: "available", currentKm: 18500, dailyPrice: 12000, oilIntervalKm: 5000, lastOilKm: 15000, insuranceExpiry: addDays(t, 20), inspectionExpiry: addDays(t, 200) },
      { id: "c2", plate: "د هـ و 5678", brand: "هيونداي", model: "إلنترا", year: 2021, status: "rented", currentKm: 42000, dailyPrice: 10000, oilIntervalKm: 5000, lastOilKm: 41800, insuranceExpiry: addDays(t, 5), inspectionExpiry: addDays(t, 15) },
      { id: "c3", plate: "ز ح ط 9012", brand: "كيا", model: "سيراتو", year: 2023, status: "maintenance", currentKm: 9000, dailyPrice: 11000, oilIntervalKm: 5000, lastOilKm: 4500, insuranceExpiry: addDays(t, 300), inspectionExpiry: addDays(t, 300) },
      { id: "c4", plate: "ك ل م 3456", brand: "نيسان", model: "صني", year: 2020, status: "available", currentKm: 61000, dailyPrice: 8500, oilIntervalKm: 5000, lastOilKm: 58200, insuranceExpiry: addDays(t, 60), inspectionExpiry: addDays(t, 90) },
    ],
    customers: [
      { id: "u1", name: "محمد العلي", phone: "0500000001", whitelisted: true, blacklisted: false, password: "123456", createdAt: todayStr() },
      { id: "u2", name: "سارة أحمد", phone: "0500000002", whitelisted: false, blacklisted: false, password: "123456", createdAt: todayStr() },
    ],
    reservations: [
      { id: "r1", carId: "c2", customerId: "u1", customerName: "محمد العلي", customerPhone: "0500000001", startDate: t, endDate: addDays(t, 4), status: "confirmed", totalPrice: 40000, createdAt: t, exitTime: nowStr() },
    ],
    kmHistory: [{ id: "k1", carId: "c2", km: 42000, date: t, note: "بداية الإيجار" }],
    finances: [
      { id: "f1", type: "income", category: "إيجار", amount: 150000, date: addDays(t, -10), note: "حجز سابق", carId: "c2" },
      { id: "f2", type: "expense", category: "صيانة", amount: 30000, date: addDays(t, -5), note: "تغيير زيت", carId: "c1" },
    ],
    contact: {
      phone: "0555555555",
      platformLink: "https://wa.me/213555555555",
      platformLabel: "واتساب"
    },
    passwordResetRequests: []
  };
}

/* ============================ الحالة والتخزين ============================ */
let state = {
  db: null,
  page: "login", // login, register, forgot
  custView: "browse",
  currentUser: null,
  modal: null,
};

function saveDb(db) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); // نسخة احتياطية محلية للعمل بدون إنترنت
    dbRef.set(db); // إرسال فوري للخادم السحابي، يصل مباشرة لتطبيق الأدمن
  } catch (e) {
    showToast("فشل حفظ البيانات", "error");
  }
}

function showToast(msg, type = "success") {
  const el = document.getElementById("toast-el");
  el.textContent = msg;
  el.className = "toast show" + (type === "error" ? " error" : "");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.className = "toast"; }, 2600);
}

/* ============================ التصيير (Render) ============================ */
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  document.getElementById("app").innerHTML = renderApp();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function App_updateDb(next) { state.db = next; saveDb(next); render(); }
window.App = {};

function renderApp() {
  return `
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <div class="logo-svg">
            <svg viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="18" fill="var(--amber)" opacity="0.9"/>
              <path d="M10 20 L18 10 L28 20 L22 32 L14 32 Z" fill="#1A1305"/>
              <circle cx="20" cy="20" r="6" fill="var(--amber)"/>
              <circle cx="18" cy="18" r="2" fill="#1A1305"/>
              <circle cx="22" cy="22" r="2" fill="#1A1305"/>
            </svg>
          </div>
          <span class="font-display">Adam Location · تأجير السيارات</span>
        </div>
        ${state.currentUser ? `<button class="btn btn-ghost btn-sm" onclick="App.logout()">🚪 خروج</button>` : ""}
      </div>
    </header>
    <div class="wrap">
      ${!state.currentUser ? renderAuth() : renderCustomer()}
    </div>
    ${state.modal ? renderModal() : ""}
  `;
}

/* ============================ تسجيل الدخول / تسجيل حساب / نسيان الرمز ============================ */
function renderAuth() {
  if (state.page === "register") {
    return renderRegister();
  } else if (state.page === "forgot") {
    return renderForgotPassword();
  }
  return renderLogin();
}

function renderLogin() {
  return `
    <div style="max-width:400px;margin:40px auto;text-align:center;">
      <div style="font-size:40px;margin-bottom:10px;">🚗</div>
      <div class="font-display" style="font-weight:800;font-size:20px;">مرحباً بك في Adam Location</div>
      <div class="muted fs-13" style="margin-bottom:16px;">سجل حسابك أو سجل الدخول للوصول إلى خدمات التأجير</div>
      
      <div id="login-form">
        <div class="field"><label>رقم الهاتف</label><input id="login-phone" class="input" placeholder="05xxxxxxxx" /></div>
        <div class="field"><label>الرمز السري</label><input id="login-password" type="password" class="input" placeholder="********" /></div>
        <button class="btn btn-primary btn-block" onclick="App.doLogin()">🔑 تسجيل الدخول</button>
        <button class="btn btn-ghost btn-sm btn-block" style="margin-top:8px;" onclick="App.showForgotPassword()">🔒 نسيت الرمز السري؟</button>
      </div>
      
      <div style="margin:16px 0;border-top:1px solid var(--border);padding-top:16px;">
        <div class="muted fs-13" style="margin-bottom:10px;">ليس لديك حساب؟</div>
        <button class="btn btn-subtle btn-block" onclick="App.showRegister()">📝 تسجيل حساب جديد</button>
      </div>
    </div>
  `;
}

function renderRegister() {
  return `
    <div style="max-width:400px;margin:40px auto;text-align:center;">
      <div style="font-size:40px;margin-bottom:10px;">🚗</div>
      <div class="font-display" style="font-weight:800;font-size:20px;">تسجيل حساب جديد</div>
      <div class="muted fs-13" style="margin-bottom:16px;">أدخل بياناتك لإنشاء حساب جديد</div>
      
      <div class="field"><label>الاسم الأول</label><input id="reg-firstname" class="input" placeholder="مثال: أحمد" /></div>
      <div class="field"><label>الاسم الأخير</label><input id="reg-lastname" class="input" placeholder="مثال: العلي" /></div>
      <div class="field"><label>رقم الهاتف</label><input id="reg-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="field"><label>الرمز السري</label><input id="reg-password" type="password" class="input" placeholder="********" /></div>
      <div class="field"><label>تأكيد الرمز السري</label><input id="reg-password-confirm" type="password" class="input" placeholder="********" /></div>
      
      <button class="btn btn-primary btn-block" onclick="App.doRegister()">✅ إنشاء الحساب</button>
      
      <div style="margin-top:16px;">
        <button class="btn btn-ghost btn-sm" onclick="App.showLogin()">🔙 العودة إلى تسجيل الدخول</button>
      </div>
    </div>
  `;
}

function renderForgotPassword() {
  return `
    <div style="max-width:400px;margin:40px auto;text-align:center;">
      <div style="font-size:40px;margin-bottom:10px;">🔒</div>
      <div class="font-display" style="font-weight:800;font-size:20px;">نسيان الرمز السري</div>
      <div class="muted fs-13" style="margin-bottom:16px;">أدخل رقم هاتفك وسيتم إرسال طلب استعادة للإدارة</div>
      
      <div class="field"><label>رقم الهاتف</label><input id="forgot-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <button class="btn btn-primary btn-block" onclick="App.requestPasswordReset()">📤 إرسال طلب استعادة</button>
      
      <div style="margin-top:16px;">
        <button class="btn btn-ghost btn-sm" onclick="App.showLogin()">🔙 العودة إلى تسجيل الدخول</button>
      </div>
    </div>
  `;
}

App.showRegister = () => {
  state.page = "register";
  render();
};

App.showLogin = () => {
  state.page = "login";
  render();
};

App.showForgotPassword = () => {
  state.page = "forgot";
  render();
};

App.doRegister = () => {
  const firstName = document.getElementById("reg-firstname").value.trim();
  const lastName = document.getElementById("reg-lastname").value.trim();
  const phone = document.getElementById("reg-phone").value.trim();
  const password = document.getElementById("reg-password").value;
  const passwordConfirm = document.getElementById("reg-password-confirm").value;

  if (!firstName || !lastName || !phone || !password) {
    return showToast("أكمل جميع الحقول", "error");
  }

  if (password.length < 6) {
    return showToast("الرمز السري يجب أن يكون 6 أحرف على الأقل", "error");
  }

  if (password !== passwordConfirm) {
    return showToast("الرمز السري وتأكيده غير متطابقين", "error");
  }

  const db = state.db;
  const existing = db.customers.find(c => c.phone === phone);

  if (existing) {
    return showToast("هذا الرقم مسجل بالفعل، سجل الدخول", "error");
  }

  const newCustomer = {
    id: uid(),
    name: firstName + " " + lastName,
    phone: phone,
    password: password,
    whitelisted: false,
    blacklisted: false,
    createdAt: todayStr()
  };

  App_updateDb({
    ...db,
    customers: [...db.customers, newCustomer]
  });

  state.currentUser = {
    id: newCustomer.id,
    name: newCustomer.name,
    phone: newCustomer.phone,
    whitelisted: newCustomer.whitelisted
  };
  state.page = "browse";

  showToast(`✅ تم إنشاء الحساب بنجاح، مرحباً ${newCustomer.name}`);
  render();
};

App.doLogin = () => {
  const phone = document.getElementById("login-phone").value.trim();
  const password = document.getElementById("login-password").value;

  if (!phone || !password) {
    return showToast("أدخل رقم الهاتف والرمز السري", "error");
  }

  const db = state.db;
  const customer = db.customers.find(c => c.phone === phone);

  if (!customer) {
    return showToast("رقم الهاتف غير مسجل، يرجى التسجيل أولاً", "error");
  }

  if (customer.blacklisted) {
    return showToast("هذا الحساب محظور، تواصل مع الإدارة", "error");
  }

  if (customer.password !== password) {
    return showToast("الرمز السري غير صحيح", "error");
  }

  state.currentUser = {
    id: customer.id,
    name: customer.name,
    phone: customer.phone,
    whitelisted: customer.whitelisted
  };

  showToast(`مرحباً ${customer.name} ${customer.whitelisted ? "(زبون مميز)" : ""}`);
  render();
};

App.requestPasswordReset = () => {
  const phone = document.getElementById("forgot-phone").value.trim();

  if (!phone) {
    return showToast("أدخل رقم الهاتف", "error");
  }

  const db = state.db;
  const customer = db.customers.find(c => c.phone === phone);

  if (!customer) {
    return showToast("رقم الهاتف غير مسجل", "error");
  }

  const resetRequest = {
    id: uid(),
    customerId: customer.id,
    phone: phone,
    name: customer.name,
    status: "pending",
    requestedAt: nowStr()
  };

  if (!db.passwordResetRequests) db.passwordResetRequests = [];
  db.passwordResetRequests.push(resetRequest);
  saveDb(db);
  state.db = db;

  showToast("📤 تم إرسال طلب استعادة الرمز السري للإدارة");
  
  setTimeout(() => {
    state.page = "login";
    render();
  }, 2000);
};

App.logout = () => {
  state.currentUser = null;
  state.page = "login";
  state.custView = "browse";
  render();
  showToast("تم الخروج");
};

/* ============================ تطبيق الزبون (بعد الدخول) ============================ */
function renderCustomer() {
  const db = state.db;
  const contact = db.contact || { phone: "", platformLink: "", platformLabel: "" };
  const tabs = [["browse", "🚙 تصفح السيارات"], ["mybookings", "📅 حجوزاتي"]];
  return `
    ${contact.phone || contact.platformLink ? `
      <div class="card" style="margin-bottom:14px;background:var(--surface2);border-color:var(--amber);">
        <div class="row-between" style="align-items:center;">
          <div>
            <div class="font-display" style="font-weight:800;font-size:14px;">📞 تواصل معنا</div>
            ${contact.phone ? `<div class="fs-13">📱 ${esc(contact.phone)}</div>` : ""}
            ${contact.platformLink ? `<div class="fs-13">💬 <a href="${esc(contact.platformLink)}" target="_blank" style="color:var(--amber);text-decoration:underline;">${esc(contact.platformLabel || "رابط التواصل")}</a></div>` : ""}
          </div>
          <div style="display:flex;gap:8px;">
            ${contact.phone ? `<a href="tel:${esc(contact.phone)}" class="btn btn-subtle btn-sm">📞 اتصل</a>` : ""}
            ${contact.platformLink ? `<a href="${esc(contact.platformLink)}" target="_blank" class="btn btn-primary btn-sm">💬 ${esc(contact.platformLabel || "تواصل")}</a>` : ""}
          </div>
        </div>
      </div>
    ` : ""}
    <div class="tabbar">
      ${tabs.map(([v, l]) => `<button class="${state.custView === v ? "active" : ""}" onclick="App.setCustView('${v}')">${l}</button>`).join("")}
    </div>
    ${state.custView === "browse" ? renderBrowse() : renderMyBookings()}
  `;
}

App.setCustView = (v) => { state.custView = v; render(); };

/* ---------- تصفح السيارات (غير المستأجرة فقط) ---------- */
function renderBrowse() {
  const db = state.db;
  const user = state.currentUser;
  const isWhitelisted = user && user.whitelisted;

  let carsToShow = db.cars.filter(c => c.status === "available");

  if (carsToShow.length === 0) {
    return renderEmpty("🚗", "لا توجد سيارات متاحة حالياً");
  }

  return `<div class="grid cols-2">${carsToShow.map(car => carCard(car, isWhitelisted)).join("")}</div>`;
}

function carCard(car, isWhitelisted) {
  const meta = STATUS_META[car.status];

  if (isWhitelisted) {
    return `
      <div class="card">
        <div class="row-between">
          <div>
            <div class="font-display" style="font-weight:800;">${esc(car.brand)} ${esc(car.model)}</div>
            <div class="muted fs-12">${car.year} · ${esc(car.plate)}</div>
          </div>
          <span class="badge" style="background:var(--success)22;color:var(--success);border:1px solid var(--success)55;">متاحة</span>
        </div>
        <div class="muted fs-12" style="margin-top:8px;">📟 ${fmtKm(car.currentKm)}</div>
        <div class="divider"></div>
        <div class="row-between" style="align-items:center;">
          <div><span class="car-price">${car.dailyPrice}</span> <span class="muted fs-12">د.ج / يوم</span></div>
          <button class="btn btn-primary btn-sm" onclick="App.openBooking('${car.id}')">📝 استئجار</button>
        </div>
      </div>
    `;
  } else {
    return `
      <div class="card">
        <div class="font-display" style="font-weight:800;">${esc(car.brand)} ${esc(car.model)}</div>
        <div class="muted fs-12">${car.year}</div>
        <div class="divider"></div>
        <div class="row-between" style="align-items:center;">
          <div><span class="car-price">${car.dailyPrice}</span> <span class="muted fs-12">د.ج / يوم</span></div>
          <div class="muted fs-12">🚗 متوفرة في الوكالة</div>
        </div>
      </div>
    `;
  }
}

/* ---------- حجوزاتي ---------- */
function renderMyBookings() {
  const db = state.db;
  const user = state.currentUser;
  if (!user) return renderEmpty("📱", "يجب تسجيل الدخول أولاً");

  const list = db.reservations
    .filter(r => r.customerId === user.id)
    .sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);

  return list.length === 0
    ? renderEmpty("📅", "لا توجد حجوزات سابقة")
    : list.map(r => {
        const car = db.cars.find(c => c.id === r.carId);
        const meta = RES_STATUS_META[r.status];
        const canPrint = r.status === "confirmed" || r.status === "completed";
        const canCancel = r.status === "pending" || r.status === "confirmed";
        return `
          <div class="card" style="margin-bottom:10px;">
            <div class="row-between">
              <div>
                <div style="font-weight:800;font-size:14px;">${car ? esc(car.brand) + " " + esc(car.model) : "سيارة محذوفة"}</div>
                <div class="muted fs-12">${r.startDate} → ${r.endDate} · ${fmtMoney(r.totalPrice)}</div>
                ${r.exitTime ? `<div class="fs-12" style="color:var(--amber);">🕒 خروج: ${r.exitTime}</div>` : ""}
                ${r.returnTime ? `<div class="fs-12" style="color:var(--success);">🔄 إرجاع: ${r.returnTime}</div>` : ""}
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="badge" style="background:${meta.color}22;color:${meta.color};border:1px solid ${meta.color}55;">${meta.label}</span>
                ${canPrint ? `<button class="btn btn-primary btn-sm" onclick="App.printContract('${r.id}')">🖨️ طباعة العقد</button>` : ""}
                ${canCancel ? `<button class="btn btn-danger btn-sm" onclick="App.cancelReservation('${r.id}')">❌ إلغاء الحجز</button>` : ""}
              </div>
            </div>
          </div>`;
      }).join("");
}

/* ---------- حجز سيارة (للمميزين فقط) ---------- */
App.openBooking = (carId) => {
  const user = state.currentUser;
  if (!user || !user.whitelisted) {
    return showToast("عذراً، الاستئجار متاح فقط للزبائن المميزين", "error");
  }
  state.modal = { type: "booking", carId };
  render();
};

App.recalcBookingTotal = () => {
  const carId = state.modal.carId;
  const car = state.db.cars.find(c => c.id === carId);
  const s = document.getElementById("bk-start").value;
  const e = document.getElementById("bk-end").value;
  const days = Math.max(1, daysBetween(s, e));
  document.getElementById("bk-total-txt").textContent = `${days} يوم × ${car.dailyPrice} د.ج`;
  document.getElementById("bk-total-val").textContent = fmtMoney(days * car.dailyPrice);
};

App.submitBooking = () => {
  const car = state.db.cars.find(c => c.id === state.modal.carId);
  const name = document.getElementById("bk-name").value.trim();
  const phone = document.getElementById("bk-phone").value.trim();
  const startDate = document.getElementById("bk-start").value;
  const endDate = document.getElementById("bk-end").value;

  if (!name || !phone) return showToast("أدخل الاسم ورقم الهاتف", "error");
  if (daysBetween(startDate, endDate) < 1) return showToast("تاريخ الانتهاء يجب أن يكون بعد تاريخ البداية", "error");

  const db = state.db;
  const existing = db.customers.find(c => c.phone === phone);
  if (existing && existing.blacklisted) return showToast("هذا الرقم محظور من الحجز", "error");

  let customers = db.customers;
  let customerId = existing ? existing.id : uid();
  if (!existing) customers = [...customers, { id: customerId, name, phone, whitelisted: false, blacklisted: false }];

  const days = Math.max(1, daysBetween(startDate, endDate));
  const reservation = {
    id: uid(),
    carId: car.id,
    customerId,
    customerName: name,
    customerPhone: phone,
    startDate,
    endDate,
    status: "pending",
    totalPrice: days * car.dailyPrice,
    createdAt: todayStr()
  };

  const cars = db.cars.map(c => (c.id === car.id ? { ...c, status: "rented" } : c));

  state.modal = null;
  App_updateDb({ ...db, customers, cars, reservations: [reservation, ...db.reservations] });
  showToast("تم إرسال طلب الحجز، بانتظار تأكيد الإدارة");
};

/* ---------- إلغاء الحجز من الزبون ---------- */
App.cancelReservation = (resId) => {
  if (!confirm("هل أنت متأكد من إلغاء هذا الحجز؟ سيتم خصم المبلغ من الإجمالي.")) return;

  const db = state.db;
  const r = db.reservations.find(x => x.id === resId);
  const car = db.cars.find(c => c.id === r.carId);

  const financeEntry = {
    id: uid(),
    type: "expense",
    category: "إلغاء حجز",
    amount: r.totalPrice,
    carId: r.carId,
    date: nowStr(),
    note: `إلغاء حجز من الزبون - ${car.brand} ${car.model} - ${r.customerName} (خصم ${fmtMoney(r.totalPrice)})`
  };

  App_updateDb({
    ...db,
    reservations: db.reservations.map((x) => (x.id === resId ? { ...x, status: "cancelled" } : x)),
    cars: db.cars.map((c) => (c.id === r.carId ? { ...c, status: "available" } : c)),
    finances: [financeEntry, ...db.finances]
  });

  showToast(`❌ تم إلغاء الحجز، خصم ${fmtMoney(r.totalPrice)} من الإجمالي`);
};

App.closeModal = () => { state.modal = null; render(); };

function renderModal() {
  const m = state.modal;
  let title = "", content = "";

  if (m.type === "booking") {
    const car = state.db.cars.find(c => c.id === m.carId);
    title = `استئجار ${esc(car.brand)} ${esc(car.model)}`;
    const start = todayStr(), end = addDays(start, 1);
    content = `
      <div class="field"><label>الاسم الكامل</label><input id="bk-name" class="input" placeholder="مثال: عبدالله ناصر" /></div>
      <div class="field"><label>رقم الهاتف</label><input id="bk-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="grid cols-2">
        <div class="field"><label>تاريخ الاستلام</label><input id="bk-start" type="date" class="input" value="${start}" onchange="App.recalcBookingTotal()" /></div>
        <div class="field"><label>تاريخ التسليم</label><input id="bk-end" type="date" class="input" value="${end}" onchange="App.recalcBookingTotal()" /></div>
      </div>
      <div class="total-box"><span id="bk-total-txt" class="muted fs-13">1 يوم × ${car.dailyPrice} د.ج</span><span id="bk-total-val" class="car-price">${fmtMoney(car.dailyPrice)}</span></div>
      <button class="btn btn-primary btn-block" onclick="App.submitBooking()">تأكيد طلب الحجز</button>
    `;
  }

  return `
    <div class="modal-backdrop" onclick="if(event.target===this)App.closeModal()">
      <div class="modal">
        <div class="modal-head"><h3 class="font-display">${title}</h3><button class="modal-close" onclick="App.closeModal()">✕</button></div>
        ${content}
      </div>
    </div>
  `;
}

function renderEmpty(emoji, text) { return `<div class="empty"><div class="icon">${emoji}</div><div class="fs-13">${text}</div></div>`; }

/* ============================ تسجيل Service Worker (لدعم التثبيت كتطبيق) ============================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ============================ رسم فوري أولي (حتى لا تظهر شاشة سوداء أثناء انتظار Firebase) ============================ */
(function initialRender() {
  try {
    const cached = localStorage.getItem(STORAGE_KEY);
    state.db = cached ? JSON.parse(cached) : seedData();
  } catch (e) {
    state.db = seedData();
  }
  render();
})();

/* ============================ الإقلاع + المزامنة اللحظية مع تطبيق الأدمن عبر Firebase ============================ */
let __firstLoad = true;
let __firebaseResponded = false;

// مهلة احتياطية: إذا لم يستجب Firebase أبداً (نطاق محجوب، لا إنترنت، مشروع معطّل...) لا تبقى الشاشة عالقة
setTimeout(() => {
  if (!__firebaseResponded) {
    showToast("تعذر الاتصال بالخادم، البيانات المعروضة قديمة", "error");
  }
}, 8000);

dbRef.on("value", (snapshot) => {
  __firebaseResponded = true;
  const remote = snapshot.val();
  if (remote) {
    state.db = remote;
  } else if (__firstLoad) {
    state.db = seedData();
    dbRef.set(state.db);
  }
  __firstLoad = false;
  render();
}, () => {
  __firebaseResponded = true;
  const cached = localStorage.getItem(STORAGE_KEY);
  state.db = cached ? JSON.parse(cached) : seedData();
  render();
  showToast("تعذر الاتصال بالخادم، البيانات المعروضة قديمة", "error");
});

</script>
