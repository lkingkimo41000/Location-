<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Adam Location</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0F1216; color: #F1EEE6; min-height: 100vh; }
  
  #splash {
    position: fixed; inset: 0; z-index: 9999; background: #0F1216;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #splash .logo { font-size: 72px; margin-bottom: 10px; }
  #splash h1 { font-size: 28px; color: #F2B134; }
  #splash .loader {
    margin-top: 20px;
    width: 40px; height: 40px;
    border: 4px solid #232833;
    border-top-color: #F2B134;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #splash .status { margin-top: 12px; font-size: 13px; color: #8B93A1; }
  
  .container { max-width: 480px; margin: 0 auto; padding: 12px; }
  .container-admin { max-width: 880px; margin: 0 auto; padding: 0 12px 40px; }
  .card { background: #1A1E25; border: 1px solid #323847; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  
  .btn {
    display: block; width: 100%; padding: 14px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: bold; cursor: pointer; text-align: center;
    transition: transform 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: #F2B134; color: #1A1305; }
  .btn-success { background: #3FA796; color: #fff; }
  .btn-danger { background: #E5573F; color: #fff; }
  .btn-subtle { background: #232833; color: #F1EEE6; border: 1px solid #323847; }
  .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; display: inline-flex; }
  
  .input {
    width: 100%; padding: 12px; background: #232833; border: 1px solid #323847;
    border-radius: 10px; color: #F1EEE6; font-size: 14px; outline: none;
  }
  .input:focus { border-color: #F2B134; }
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 13px; color: #8B93A1; margin-bottom: 4px; font-weight: bold; }
  
  .text-center { text-align: center; }
  .text-muted { color: #8B93A1; }
  .mt-8 { margin-top: 8px; }
  .mb-8 { margin-bottom: 8px; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .gap-8 { gap: 8px; }
  
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: bold;
  }
  .badge-success { background: rgba(63,167,150,0.2); color: #3FA796; border: 1px solid rgba(63,167,150,0.4); }
  .badge-danger { background: rgba(229,87,63,0.2); color: #E5573F; border: 1px solid rgba(229,87,63,0.4); }
  .badge-warning { background: rgba(242,177,52,0.2); color: #F2B134; border: 1px solid rgba(242,177,52,0.4); }
  .badge-info { background: rgba(91,141,239,0.2); color: #5B8DEF; border: 1px solid rgba(91,141,239,0.4); }
  
  .tabbar {
    display: flex; gap: 4px; background: #1A1E25; border: 1px solid #323847;
    border-radius: 12px; padding: 4px; margin-bottom: 16px; overflow-x: auto;
  }
  .tabbar button {
    flex: 1; padding: 10px; border: none; background: transparent; color: #8B93A1;
    font-size: 13px; font-weight: bold; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  .tabbar button.active { background: #F2B134; color: #1A1305; }
  
  .car-item {
    background: #232833; border: 1px solid #323847; border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
  }
  .car-item .name { font-weight: bold; font-size: 15px; }
  .car-item .info { color: #8B93A1; font-size: 12px; }
  .car-item .price { color: #F2B134; font-weight: bold; font-size: 16px; }
  
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; margin-bottom: 16px; border-bottom: 1px solid #232833;
  }
  .header-title { font-size: 20px; font-weight: bold; color: #F2B134; }
  .header-user { font-size: 13px; color: #8B93A1; }
  
  .stat-card {
    background: #1A1E25; border: 1px solid #323847; border-radius: 12px;
    padding: 12px; display: flex; align-items: center; gap: 10px;
  }
  .stat-card .icon { font-size: 24px; }
  .stat-card .label { font-size: 11px; color: #8B93A1; }
  .stat-card .value { font-weight: bold; font-size: 18px; }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }
  
  .actions-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .empty { text-align: center; padding: 40px 16px; color: #8B93A1; }
  .empty .icon { font-size: 40px; display: block; margin-bottom: 8px; }
  
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; border-radius: 12px; font-weight: bold; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 100;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #3FA796; color: #fff; }
  .toast.error { background: #E5573F; color: #fff; }
  
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box {
    background: #1A1E25; border: 1px solid #323847; border-radius: 16px;
    padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .modal-header h3 { font-size: 18px; }
  .modal-close { background: none; border: none; color: #8B93A1; font-size: 24px; cursor: pointer; }
</style>
</head>
<body>

<div id="splash">
  <div class="logo">🚗</div>
  <h1>Adam Location</h1>
  <div class="loader"></div>
  <div class="status" id="splash-status">جاري التحميل...</div>
</div>

<div id="toast" class="toast"></div>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ============================================================
   🔥 إعدادات Firebase لمشروعك الجديد
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCNp8pVNX84MyMgIsuiV9K6DE3tximsrRg",
  authDomain: "location-c06ec.firebaseapp.com",
  databaseURL: "https://location-c06ec-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "location-c06ec",
  storageBucket: "location-c06ec.firebasestorage.app",
  messagingSenderId: "418304217437",
  appId: "1:418304217437:web:3656ef204f2b453abe18b4"
};

const STORAGE_KEY = "rental-db-v2";

/* ============================================================
   📦 الأدوات المساعدة
   ============================================================ */
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowStr = () => new Date().toISOString().slice(0, 10) + ' ' + new Date().toTimeString().slice(0, 5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const addDays = (dateStr, n) => { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtMoney = (n) => `${Number(n || 0).toLocaleString("en-US")} د.ج`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function showToast(msg, type = "success") {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.className = "toast"; }, 3000);
}

/* ============================================================
   🗄️ البيانات الافتراضية
   ============================================================ */
function getDefaultData() {
  const t = todayStr();
  return {
    cars: [
      { id: "c1", plate: "أ ب ج 1234", brand: "تويوتا", model: "كورولا", year: 2022, status: "available", currentKm: 18500, dailyPrice: 12000, oilIntervalKm: 5000, lastOilKm: 15000, insuranceExpiry: addDays(t, 20), inspectionExpiry: addDays(t, 200) },
      { id: "c2", plate: "د هـ و 5678", brand: "هيونداي", model: "إلنترا", year: 2021, status: "available", currentKm: 42000, dailyPrice: 10000, oilIntervalKm: 5000, lastOilKm: 41800, insuranceExpiry: addDays(t, 5), inspectionExpiry: addDays(t, 15) },
      { id: "c3", plate: "ز ح ط 9012", brand: "كيا", model: "سيراتو", year: 2023, status: "available", currentKm: 9000, dailyPrice: 11000, oilIntervalKm: 5000, lastOilKm: 4500, insuranceExpiry: addDays(t, 300), inspectionExpiry: addDays(t, 300) },
      { id: "c4", plate: "ك ل م 3456", brand: "نيسان", model: "صني", year: 2020, status: "available", currentKm: 61000, dailyPrice: 8500, oilIntervalKm: 5000, lastOilKm: 58200, insuranceExpiry: addDays(t, 60), inspectionExpiry: addDays(t, 90) },
    ],
    customers: [],
    reservations: [],
    kmHistory: [],
    finances: [],
    contact: { phone: "0555555555", platformLink: "https://wa.me/213555555555", platformLabel: "واتساب" },
    passwordResetRequests: []
  };
}

/* ============================================================
   💾 قاعدة البيانات
   ============================================================ */
let db;
let dbRef = null;
let firebaseReady = false;
let appStarted = false;

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  db = saved ? JSON.parse(saved) : getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
} catch (e) {
  db = getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
}

function saveData() {
  saveLocal();
  if (dbRef && firebaseReady) {
    dbRef.set(db).catch(() => {});
  }
}

/* ============================================================
   🔥 تهيئة Firebase
   ============================================================ */
function initFirebase() {
  const statusEl = document.getElementById('splash-status');
  
  try {
    if (typeof firebase === 'undefined') {
      throw new Error('Firebase غير محمل');
    }
    
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref(STORAGE_KEY);
    firebaseReady = true;
    
    if (statusEl) statusEl.textContent = '✅ متصل بالخادم';
    startSync();
    
  } catch (e) {
    console.warn('فشل تهيئة Firebase:', e.message);
    if (statusEl) statusEl.textContent = '⚠️ تعذر الاتصال، بيانات محلية';
    setTimeout(() => {
      if (!appStarted) {
        appStarted = true;
        hideSplash();
        render();
        showToast('⚠️ وضع غير متصل - بيانات محلية');
      }
    }, 3000);
  }
}

/* ============================================================
   🔄 المزامنة مع Firebase
   ============================================================ */
let firstSync = true;

function startSync() {
  if (!dbRef) return;
  
  dbRef.on('value', (snapshot) => {
    const remote = snapshot.val();
    if (remote) {
      db = remote;
      saveLocal();
      if (firstSync) {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('✅ مزامنة مع الخادم');
        }
      } else {
        render();
      }
    } else if (firstSync) {
      dbRef.set(db).then(() => {
        console.log('✅ تم إرسال البيانات الأولية');
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('✅ مزامنة مع الخادم');
        }
      }).catch(() => {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('⚠️ بيانات محلية فقط');
        }
      });
    }
  }, () => {
    if (firstSync && !appStarted) {
      firstSync = false;
      setTimeout(() => {
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('⚠️ وضع غير متصل - بيانات محلية');
        }
      }, 3000);
    }
  });
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (el) {
    el.classList.add('hidden');
    setTimeout(() => { el.style.display = 'none'; }, 500);
  }
}

/* ============================================================
   📱 حالة التطبيق
   ============================================================ */
let state = {
  mode: 'choose',
  customer: null,
  adminSection: 'overview',
  modal: null,
  tab: 'cars',
  selectedCar: null,
  startDate: todayStr(),
  endDate: addDays(todayStr(), 1),
  adminCustSearch: ''
};

/* ============================================================
   🏷️ الثوابت
   ============================================================ */
const STATUS_META = {
  available: { label: 'متاحة', color: '#3FA796' },
  rented: { label: 'مؤجَّرة', color: '#5B8DEF' },
  maintenance: { label: 'في الصيانة', color: '#E5573F' }
};

function getCarAlerts(car) {
  const t = todayStr();
  const alerts = [];
  const kmLeft = car.lastOilKm + car.oilIntervalKm - car.currentKm;
  if (kmLeft <= 500) {
    alerts.push({ type: 'oil', level: kmLeft <= 0 ? 'danger' : 'warning', emoji: '🛢️', text: kmLeft <= 0 ? `تجاوز تغيير الزيت بـ ${Math.abs(kmLeft)} كم` : `تغيير الزيت بعد ${kmLeft} كم` });
  }
  const insDays = daysBetween(t, car.insuranceExpiry);
  if (insDays <= 30) {
    alerts.push({ type: 'insurance', level: insDays <= 0 ? 'danger' : 'warning', emoji: '🛡️', text: insDays <= 0 ? `انتهى التأمين منذ ${Math.abs(insDays)} يوم` : `ينتهي التأمين بعد ${insDays} يوم` });
  }
  const inspDays = daysBetween(t, car.inspectionExpiry);
  if (inspDays <= 30) {
    alerts.push({ type: 'inspection', level: inspDays <= 0 ? 'danger' : 'warning', emoji: '📋', text: inspDays <= 0 ? `انتهى الفحص الفني منذ ${Math.abs(inspDays)} يوم` : `ينتهي الفحص الفني بعد ${insDays} يوم` });
  }
  return alerts;
}

/* ============================================================
   🖥️ التصيير الرئيسي
   ============================================================ */
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (state.mode === 'choose') app.innerHTML = renderChoose();
  else if (state.mode === 'customer') app.innerHTML = renderCustomerApp();
  else if (state.mode === 'admin') app.innerHTML = renderAdminApp();
  else app.innerHTML = renderChoose();
}

/* ============================================================
   🏠 شاشة الاختيار
   ============================================================ */
function renderChoose() {
  return `
    <div class="container" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;">
      <div style="font-size:72px;">🚗</div>
      <h1 style="font-size:28px;color:#F2B134;margin-bottom:4px;">Adam Location</h1>
      <p style="color:#8B93A1;font-size:14px;margin-bottom:30px;">نظام إدارة تأجير السيارات</p>
      
      <button class="btn btn-primary" onclick="App.setMode('customer')" style="font-size:18px;padding:16px;margin-bottom:10px;">👤 تطبيق الزبون</button>
      <button class="btn btn-success" onclick="App.setMode('admin')" style="font-size:18px;padding:16px;">🔐 لوحة التحكم</button>
      
      <div style="margin-top:30px;font-size:12px;color:#8B93A1;">
        ${firebaseReady ? '🟢 متصل بالخادم' : '🟠 غير متصل - بيانات محلية'}
        <br><span>📊 ${db ? db.cars.length : 0} سيارات</span>
      </div>
    </div>
  `;
}

/* ============================================================
   👤 دوال الزبون
   ============================================================ */
function renderCustomerApp() {
  if (!state.customer) return renderCustomerLogin();
  
  return `
    <div class="container">
      <div class="header">
        <div class="header-title">🚗 Adam</div>
        <div class="header-user">👤 ${esc(state.customer.name)} <button onclick="App.customerLogout()" style="background:none;border:none;color:#E5573F;cursor:pointer;font-size:12px;margin-left:6px;">خروج</button></div>
      </div>
      <div class="tabbar">
        <button class="${state.tab === 'cars' ? 'active' : ''}" onclick="App.setTab('cars')">🚗 سيارات</button>
        <button class="${state.tab === 'reservations' ? 'active' : ''}" onclick="App.setTab('reservations')">📅 حجوزاتي</button>
        <button class="${state.tab === 'profile' ? 'active' : ''}" onclick="App.setTab('profile')">👤 حسابي</button>
      </div>
      ${state.tab === 'cars' ? renderCustomerCars() : ''}
      ${state.tab === 'reservations' ? renderCustomerReservations() : ''}
      ${state.tab === 'profile' ? renderCustomerProfile() : ''}
    </div>
    ${state.modal ? renderModal() : ''}
  `;
}

function renderCustomerLogin() {
  return `
    <div class="container" style="display:flex;flex-direction:column;justify-content:center;min-height:80vh;">
      <div class="text-center" style="margin-bottom:20px;">
        <div style="font-size:48px;">🚗</div>
        <h1 style="font-size:24px;color:#F2B134;">تسجيل الدخول</h1>
        <p style="color:#8B93A1;font-size:13px;">أدخل بياناتك للدخول</p>
      </div>
      <div class="card">
        <div class="input-group"><label>📱 رقم الهاتف</label><input id="login-phone" class="input" placeholder="05xxxxxxxx" /></div>
        <div class="input-group"><label>🔑 الرمز السري</label><input id="login-password" class="input" type="password" placeholder="******" /></div>
        <button class="btn btn-primary" onclick="App.customerLogin()">🔑 تسجيل الدخول</button>
        <div class="text-center mt-8"><button class="btn btn-subtle" onclick="App.openRegister()" style="width:auto;padding:8px 16px;font-size:13px;">📝 إنشاء حساب جديد</button></div>
        <div class="text-center mt-8"><button style="background:none;border:none;color:#8B93A1;cursor:pointer;font-size:12px;" onclick="App.openForgotPassword()">نسيت الرمز السري؟</button></div>
      </div>
    </div>
    ${state.modal ? renderModal() : ''}
  `;
}

function renderCustomerCars() {
  const available = db.cars.filter(c => c.status === 'available');
  return `
    <div class="flex-between mb-8"><div style="font-weight:bold;">🚗 السيارات المتاحة (${available.length})</div></div>
    ${available.length === 0 ? `<div class="empty"><div class="icon">😔</div><div>لا توجد سيارات متاحة</div></div>` : 
    available.map(car => `
      <div class="car-item">
        <div class="flex-between">
          <div><div class="name">${esc(car.brand)} ${esc(car.model)}</div><div class="info">${car.year} · ${esc(car.plate)}</div></div>
          <span class="badge badge-success">متاحة</span>
        </div>
        <div class="flex-between" style="margin-top:8px;">
          <div class="price">${fmtMoney(car.dailyPrice)} <span style="font-size:12px;color:#8B93A1;font-weight:400;">/ يوم</span></div>
          <button class="btn btn-primary btn-sm" onclick="App.openBooking('${car.id}')">📅 احجز</button>
        </div>
      </div>
    `).join('')}
  `;
}

function renderCustomerReservations() {
  const myRes = db.reservations.filter(r => r.customerId === state.customer.id);
  const statusMap = { pending: 'badge-warning', confirmed: 'badge-success', completed: 'badge-info', cancelled: 'badge-danger' };
  return `
    <div style="font-weight:bold;margin-bottom:12px;">📅 حجوزاتي (${myRes.length})</div>
    ${myRes.length === 0 ? `<div class="empty"><div class="icon">📭</div><div>لا توجد حجوزات</div></div>` :
    myRes.map(r => {
      const car = db.cars.find(c => c.id === r.carId);
      const st = statusMap[r.status] || 'badge-warning';
      return `<div class="car-item">
        <div class="flex-between">
          <div><div class="name">${car ? esc(car.brand) + ' ' + esc(car.model) : 'سيارة'}</div><div class="info">${r.startDate} → ${r.endDate}</div></div>
          <span class="badge ${st}">${r.status === 'pending' ? 'بانتظار' : r.status === 'confirmed' ? 'قيد التنفيذ' : r.status === 'completed' ? 'منتهي' : 'ملغى'}</span>
        </div>
        <div class="flex-between" style="margin-top:8px;"><div class="price">${fmtMoney(r.totalPrice)}</div>
        ${r.status === 'pending' ? `<button class="btn btn-danger btn-sm" onclick="App.cancelReservation('${r.id}')">إلغاء</button>` : ''}</div>
      </div>`;
    }).join('')}
  `;
}

function renderCustomerProfile() {
  const c = state.customer;
  return `<div class="card text-center">
    <div style="font-size:48px;">👤</div>
    <div style="font-size:18px;font-weight:bold;">${esc(c.name)}</div>
    <div style="color:#8B93A1;font-size:14px;">📱 ${esc(c.phone)}</div>
    ${c.whitelisted ? `<span class="badge badge-success" style="margin-top:8px;">⭐ زبون مميز</span>` : ''}
    <div style="margin-top:12px;color:#8B93A1;font-size:13px;">تاريخ الانضمام: ${c.createdAt}</div>
  </div>
  <button class="btn btn-danger" onclick="App.customerLogout()">🚪 تسجيل الخروج</button>`;
}

/* ============================================================
   دوال الزبون (العمليات)
   ============================================================ */
App = {
  setMode: (mode) => { state.mode = mode; state.adminSection = 'overview'; render(); },
  setTab: (tab) => { state.tab = tab; render(); },
  setAdminSection: (section) => { state.adminSection = section; render(); },
  closeModal: () => { state.modal = null; render(); },
  
  customerLogin: () => {
    const phone = document.getElementById('login-phone').value.trim();
    const password = document.getElementById('login-password').value.trim();
    if (!phone || !password) return showToast('أدخل رقم الهاتف والرمز السري', 'error');
    const customer = db.customers.find(c => c.phone === phone && c.password === password);
    if (!customer) return showToast('رقم الهاتف أو الرمز السري غير صحيح', 'error');
    if (customer.blacklisted) return showToast('❌ هذا الحساب محظور', 'error');
    state.customer = customer;
    state.tab = 'cars';
    render();
    showToast(`مرحباً ${customer.name} 👋`);
  },
  
  customerLogout: () => {
    state.customer = null;
    state.tab = 'cars';
    render();
    showToast('تم تسجيل الخروج');
  },
  
  openRegister: () => {
    state.modal = { type: 'register' };
    render();
  },
  
  submitRegister: () => {
    const name = document.getElementById('reg-name').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    const confirm = document.getElementById('reg-confirm').value.trim();
    if (!name || !phone || !password) return showToast('أكمل جميع الحقول', 'error');
    if (password.length < 4) return showToast('الرمز السري 4 أحرف على الأقل', 'error');
    if (password !== confirm) return showToast('الرمز السري غير متطابق', 'error');
    if (db.customers.find(c => c.phone === phone)) return showToast('هذا الرقم مسجل بالفعل', 'error');
    const newCustomer = { id: uid(), name, phone, password, whitelisted: false, blacklisted: false, createdAt: todayStr() };
    db.customers.push(newCustomer);
    saveData();
    state.customer = newCustomer;
    state.modal = null;
    state.tab = 'cars';
    render();
    showToast(`✅ مرحباً ${name}`);
  },
  
  openForgotPassword: () => {
    state.modal = { type: 'forgotPassword' };
    render();
  },
  
  submitForgotPassword: () => {
    const phone = document.getElementById('forgot-phone').value.trim();
    if (!phone) return showToast('أدخل رقم الهاتف', 'error');
    const customer = db.customers.find(c => c.phone === phone);
    if (!customer) return showToast('هذا الرقم غير مسجل', 'error');
    if (!db.passwordResetRequests) db.passwordResetRequests = [];
    db.passwordResetRequests.push({ id: uid(), customerId: customer.id, name: customer.name, phone: customer.phone, requestedAt: todayStr(), status: 'pending' });
    saveData();
    state.modal = null;
    render();
    showToast('✅ تم إرسال طلب استعادة الرمز السري');
  },
  
  openBooking: (carId) => {
    state.selectedCar = db.cars.find(c => c.id === carId);
    state.startDate = todayStr();
    state.endDate = addDays(todayStr(), 1);
    state.modal = { type: 'booking' };
    render();
  },
  
  submitBooking: () => {
    const car = state.selectedCar;
    const startDate = document.getElementById('book-start').value;
    const endDate = document.getElementById('book-end').value;
    if (!startDate || !endDate) return showToast('اختر التواريخ', 'error');
    if (daysBetween(startDate, endDate) < 1) return showToast('تاريخ النهاية بعد البداية', 'error');
    const overlapping = db.reservations.some(r => r.carId === car.id && r.status !== 'cancelled' && r.status !== 'completed' &&
      ((startDate >= r.startDate && startDate < r.endDate) || (endDate > r.startDate && endDate <= r.endDate) || (startDate <= r.startDate && endDate >= r.endDate)));
    if (overlapping) return showToast('هذه السيارة محجوزة', 'error');
    const days = daysBetween(startDate, endDate);
    const totalPrice = days * car.dailyPrice;
    db.reservations.push({ id: uid(), carId: car.id, customerId: state.customer.id, customerName: state.customer.name, customerPhone: state.customer.phone, startDate, endDate, status: 'pending', totalPrice, createdAt: todayStr() });
    saveData();
    state.modal = null;
    render();
    showToast('✅ تم إرسال طلب الحجز');
  },
  
  cancelReservation: (resId) => {
    if (!confirm('تأكيد إلغاء الحجز؟')) return;
    const r = db.reservations.find(r => r.id === resId);
    if (!r || r.status !== 'pending') return showToast('لا يمكن الإلغاء', 'error');
    r.status = 'cancelled';
    saveData();
    render();
    showToast('تم إلغاء الحجز');
  },
  
  // دوال الأدمن
  toggleCarStatus: (carId) => {
    const car = db.cars.find(c => c.id === carId);
    car.status = car.status === 'available' ? 'rented' : 'available';
    saveData();
    render();
    showToast(`تم تغيير حالة السيارة`);
  },
  
  deleteCar: (carId) => {
    if (!confirm('تأكيد حذف السيارة؟')) return;
    db.cars = db.cars.filter(c => c.id !== carId);
    saveData();
    render();
    showToast('تم حذف السيارة');
  },
  
  openAddCar: () => {
    state.modal = { type: 'addCar' };
    render();
  },
  
  submitAddCar: () => {
    const brand = document.getElementById('ac-brand').value.trim();
    const model = document.getElementById('ac-model').value.trim();
    const plate = document.getElementById('ac-plate').value.trim();
    const price = Number(document.getElementById('ac-price').value);
    if (!brand || !model || !plate || !price) return showToast('أكمل جميع الحقول', 'error');
    db.cars.push({ id: uid(), brand, model, plate, year: new Date().getFullYear(), status: 'available', currentKm: 0, dailyPrice: price, oilIntervalKm: 5000, lastOilKm: 0, insuranceExpiry: addDays(todayStr(), 180), inspectionExpiry: addDays(todayStr(), 180) });
    saveData();
    state.modal = null;
    render();
    showToast('✅ تم إضافة السيارة');
  },
  
  confirmReservation: (resId) => {
    const r = db.reservations.find(r => r.id === resId);
    if (!r) return;
    r.status = 'confirmed';
    r.exitTime = nowStr();
    const car = db.cars.find(c => c.id === r.carId);
    if (car) car.status = 'rented';
    db.finances.push({ id: uid(), type: 'income', category: 'إيجار', amount: r.totalPrice, carId: r.carId, date: nowStr(), note: `خروج السيارة - ${r.customerName}` });
    saveData();
    render();
    showToast('✅ تم تأكيد الحجز');
  },
  
  rejectReservation: (resId) => {
    const r = db.reservations.find(r => r.id === resId);
    if (!r) return;
    r.status = 'cancelled';
    saveData();
    render();
    showToast('❌ تم رفض الحجز');
  },
  
  completeReservation: (resId) => {
    state.modal = { type: 'completeRes', resId };
    render();
  },
  
  submitCompleteRes: () => {
    const r = db.reservations.find(r => r.id === state.modal.resId);
    if (!r) return;
    const km = Number(document.getElementById('complete-km').value);
    if (!km) return showToast('أدخل قراءة الكيلومترات', 'error');
    const car = db.cars.find(c => c.id === r.carId);
    if (car) { car.status = 'available'; car.currentKm = km; }
    r.status = 'completed';
    r.returnTime = nowStr();
    saveData();
    state.modal = null;
    render();
    showToast('✅ تم إتمام الإرجاع');
  },
  
  toggleWhitelist: (custId) => {
    const c = db.customers.find(c => c.id === custId);
    if (!c) return;
    c.whitelisted = !c.whitelisted;
    if (c.whitelisted) c.blacklisted = false;
    saveData();
    render();
    showToast(c.whitelisted ? '⭐ تم ترقية الزبون' : 'تم إزالة الترقية');
  },
  
  toggleBlacklist: (custId) => {
    const c = db.customers.find(c => c.id === custId);
    if (!c) return;
    c.blacklisted = !c.blacklisted;
    if (c.blacklisted) c.whitelisted = false;
    saveData();
    render();
    showToast(c.blacklisted ? '🚫 تم حظر الزبون' : 'تم إلغاء الحظر');
  }
};

/* ============================================================
   🔐 دوال الأدمن (التصيير)
   ============================================================ */
function renderAdminApp() {
  return `
    <div class="container-admin">
      <div class="flex-between" style="padding:12px 0;border-bottom:1px solid #323847;margin-bottom:16px;">
        <div style="font-weight:bold;font-size:18px;color:#F2B134;">🔐 لوحة التحكم</div>
        <button onclick="App.setMode('choose')" style="background:none;border:1px solid #323847;color:#8B93A1;padding:6px 14px;border-radius:8px;cursor:pointer;">رجوع</button>
      </div>
      <div class="tabbar">
        <button class="${state.adminSection === 'overview' ? 'active' : ''}" onclick="App.setAdminSection('overview')">📊 نظرة عامة</button>
        <button class="${state.adminSection === 'cars' ? 'active' : ''}" onclick="App.setAdminSection('cars')">🚗 سيارات</button>
        <button class="${state.adminSection === 'reservations' ? 'active' : ''}" onclick="App.setAdminSection('reservations')">📅 حجوزات</button>
        <button class="${state.adminSection === 'customers' ? 'active' : ''}" onclick="App.setAdminSection('customers')">👥 زبائن</button>
      </div>
      ${state.adminSection === 'overview' ? renderAdminOverview() : ''}
      ${state.adminSection === 'cars' ? renderAdminCars() : ''}
      ${state.adminSection === 'reservations' ? renderAdminReservations() : ''}
      ${state.adminSection === 'customers' ? renderAdminCustomers() : ''}
    </div>
    ${state.modal ? renderModal() : ''}
  `;
}

function renderAdminOverview() {
  const total = db.cars.length;
  const available = db.cars.filter(c => c.status === 'available').length;
  const pending = db.reservations.filter(r => r.status === 'pending').length;
  return `
    <div class="grid-2" style="margin-bottom:16px;">
      <div class="stat-card"><div class="icon">🚗</div><div><div class="label">السيارات</div><div class="value">${total}</div></div></div>
      <div class="stat-card"><div class="icon">✅</div><div><div class="label">متاحة</div><div class="value">${available}</div></div></div>
      <div class="stat-card"><div class="icon">📅</div><div><div class="label">حجوزات معلقة</div><div class="value">${pending}</div></div></div>
      <div class="stat-card"><div class="icon">👥</div><div><div class="label">الزبائن</div><div class="value">${db.customers.length}</div></div></div>
    </div>
  `;
}

function renderAdminCars() {
  return `
    <div class="flex-between mb-8"><div style="font-weight:bold;">🚗 السيارات (${db.cars.length})</div>
    <button class="btn btn-primary btn-sm" onclick="App.openAddCar()">➕ إضافة</button></div>
    ${db.cars.map(car => `
      <div class="car-item">
        <div class="flex-between">
          <div><div class="name">${esc(car.brand)} ${esc(car.model)}</div><div class="info">${esc(car.plate)} · ${fmtMoney(car.dailyPrice)}/يوم</div></div>
          <span class="badge ${car.status === 'available' ? 'badge-success' : 'badge-danger'}">${car.status === 'available' ? 'متاحة' : 'غير متاحة'}</span>
        </div>
        <div class="actions-wrap">
          <button class="btn btn-subtle btn-sm" onclick="App.toggleCarStatus('${car.id}')">${car.status === 'available' ? '🔒 تعطيل' : '✅ تفعيل'}</button>
          <button class="btn btn-danger btn-sm" onclick="App.deleteCar('${car.id}')">🗑️ حذف</button>
        </div>
      </div>
    `).join('')}
  `;
}

function renderAdminReservations() {
  return `
    <div style="font-weight:bold;margin-bottom:12px;">📅 الحجوزات (${db.reservations.length})</div>
    ${db.reservations.length === 0 ? '<div class="empty"><div class="icon">📭</div><div>لا توجد حجوزات</div></div>' :
    db.reservations.map(r => {
      const car = db.cars.find(c => c.id === r.carId);
      return `<div class="car-item">
        <div class="flex-between">
          <div><div class="name">${car ? esc(car.brand) + ' ' + esc(car.model) : 'سيارة'}</div><div class="info">${esc(r.customerName)} · ${r.startDate} → ${r.endDate}</div></div>
          <span class="badge ${r.status === 'pending' ? 'badge-warning' : r.status === 'confirmed' ? 'badge-success' : r.status === 'completed' ? 'badge-info' : 'badge-danger'}">
            ${r.status === 'pending' ? 'بانتظار' : r.status === 'confirmed' ? 'قيد التنفيذ' : r.status === 'completed' ? 'منتهي' : 'ملغى'}
          </span>
        </div>
        <div class="flex-between" style="margin-top:8px;">
          <div class="price">${fmtMoney(r.totalPrice)}</div>
          <div class="actions-wrap">
            ${r.status === 'pending' ? `
              <button class="btn btn-success btn-sm" onclick="App.confirmReservation('${r.id}')">✔ تأكيد</button>
              <button class="btn btn-danger btn-sm" onclick="App.rejectReservation('${r.id}')">✕ رفض</button>
            ` : ''}
            ${r.status === 'confirmed' ? `
              <button class="btn btn-success btn-sm" onclick="App.completeReservation('${r.id}')">✅ إرجاع</button>
            ` : ''}
          </div>
        </div>
      </div>`;
    }).join('')}
  `;
}

function renderAdminCustomers() {
  return `
    <div style="font-weight:bold;margin-bottom:12px;">👥 الزبائن (${db.customers.length})</div>
    ${db.customers.map(c => `
      <div class="car-item">
        <div class="flex-between">
          <div><div class="name">${esc(c.name)} ${c.whitelisted ? '⭐' : ''}</div><div class="info">📱 ${esc(c.phone)}</div></div>
          <div class="actions-wrap">
            <button class="btn ${c.whitelisted ? 'btn-success' : 'btn-subtle'} btn-sm" onclick="App.toggleWhitelist('${c.id}')">${c.whitelisted ? '⭐ موثّق' : 'توثيق'}</button>
            <button class="btn ${c.blacklisted ? 'btn-danger' : 'btn-subtle'} btn-sm" onclick="App.toggleBlacklist('${c.id}')">${c.blacklisted ? '🚫 محظور' : 'حظر'}</button>
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

/* ============================================================
   🖼️ المودال
   ============================================================ */
function renderModal() {
  const m = state.modal;
  if (!m) return '';
  
  let title = '', content = '';
  
  if (m.type === 'register') {
    title = '📝 إنشاء حساب جديد';
    content = `
      <div class="input-group"><label>الاسم الكامل</label><input id="reg-name" class="input" placeholder="أحمد محمد" /></div>
      <div class="input-group"><label>رقم الهاتف</label><input id="reg-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="input-group"><label>الرمز السري</label><input id="reg-password" class="input" type="password" placeholder="******" /></div>
      <div class="input-group"><label>تأكيد الرمز</label><input id="reg-confirm" class="input" type="password" placeholder="******" /></div>
      <button class="btn btn-primary" onclick="App.submitRegister()">✅ تسجيل</button>
    `;
  }
  
  if (m.type === 'forgotPassword') {
    title = '🔑 استعادة الرمز السري';
    content = `
      <div class="input-group"><label>رقم الهاتف</label><input id="forgot-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="text-muted" style="font-size:12px;margin-bottom:12px;">سيتم إرسال طلب إلى الإدارة</div>
      <button class="btn btn-primary" onclick="App.submitForgotPassword()">📤 إرسال</button>
    `;
  }
  
  if (m.type === 'booking') {
    const car = state.selectedCar;
    const days = daysBetween(state.startDate, state.endDate);
    title = `📅 حجز ${esc(car.brand)} ${esc(car.model)}`;
    content = `
      <div style="margin-bottom:12px;">
        <div class="text-muted">${esc(car.brand)} ${esc(car.model)} · ${car.year}</div>
        <div style="font-weight:bold;color:#F2B134;font-size:18px;">${fmtMoney(car.dailyPrice)} / يوم</div>
      </div>
      <div class="input-group"><label>تاريخ الاستلام</label><input id="book-start" class="input" type="date" value="${state.startDate}" /></div>
      <div class="input-group"><label>تاريخ التسليم</label><input id="book-end" class="input" type="date" value="${state.endDate}" /></div>
      <div style="background:#232833;border-radius:10px;padding:12px;text-align:center;margin-bottom:12px;">
        <div class="text-muted" style="font-size:13px;">الإجمالي</div>
        <div style="font-size:20px;font-weight:bold;color:#F2B134;">${fmtMoney(days * car.dailyPrice)}</div>
        <div style="font-size:12px;color:#8B93A1;">${days} يوم × ${fmtMoney(car.dailyPrice)}</div>
      </div>
      <button class="btn btn-success" onclick="App.submitBooking()">✅ تأكيد الحجز</button>
    `;
  }
  
  if (m.type === 'addCar') {
    title = '➕ إضافة سيارة جديدة';
    content = `
      <div class="input-group"><label>الماركة</label><input id="ac-brand" class="input" placeholder="تويوتا" /></div>
      <div class="input-group"><label>الموديل</label><input id="ac-model" class="input" placeholder="كورولا" /></div>
      <div class="input-group"><label>رقم اللوحة</label><input id="ac-plate" class="input" placeholder="أ ب ج 1234" /></div>
      <div class="input-group"><label>السعر اليومي (د.ج)</label><input id="ac-price" class="input" type="number" placeholder="10000" /></div>
      <button class="btn btn-primary" onclick="App.submitAddCar()">✅ إضافة</button>
    `;
  }
  
  if (m.type === 'completeRes') {
    title = '✅ إتمام إرجاع السيارة';
    content = `
      <div class="input-group"><label>قراءة الكيلومترات عند الإرجاع</label><input id="complete-km" class="input" type="number" placeholder="أدخل القراءة" /></div>
      <button class="btn btn-success" onclick="App.submitCompleteRes()">✅ تأكيد الإرجاع</button>
    `;
  }
  
  return `
    <div class="modal-overlay" onclick="if(event.target===this)App.closeModal()">
      <div class="modal-box">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="App.closeModal()">✕</button>
        </div>
        ${content}
      </div>
    </div>
  `;
}
