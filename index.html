<script>
/* ============================================================
   🔥 إعدادات Firebase
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCNp8pVNX84MyMgIsuiV9K6DE3tximsrRg",
  authDomain: "location-c06ec.firebaseapp.com",
  databaseURL: "https://location-c06ec-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "location-c06ec",

const STORAGE_KEY = "rental-db-v2";

/* ============================================================
   📦 الأدوات المساعدة
   ============================================================ */
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowStr = () => new Date().toISOString().slice(0, 10) + ' ' + new Date().toTimeString().slice(0, 5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const addDays = (dateStr, n) => { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtMoney = (n) => `${Number(n || 0).toLocaleString("en-US")} د.ج`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function showToast(msg, type = "success") {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.className = "toast"; }, 3500);
}

/* ============================================================
   🗄️ البيانات الافتراضية
   ============================================================ */
function getDefaultData() {
  const t = todayStr();
  return {

      {

      }

    customers: [],

}

/* ============================================================
   💾 قاعدة البيانات
   ============================================================ */
let db;
let dbRef = null;
let firebaseReady = false;
let appStarted = false;

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  db = saved ? JSON.parse(saved) : getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
} catch (e) {
  db = getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
}

function saveData() {
  saveLocal();
  if (dbRef && firebaseReady) {
    dbRef.set(db).catch(() => {});
  }
}

/* ============================================================
   🔥 تهيئة Firebase
   ============================================================ */
function initFirebase() {
  const statusEl = document.getElementById('splash-status');
  
  try {
    if (typeof firebase === 'undefined') {
      throw new Error('Firebase غير محمل');
    }
    
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref(STORAGE_KEY);
    firebaseReady = true;
    
    if (statusEl) statusEl.textContent = '✅ Connecté au serveur';
    startSync();
    
  } catch (e) {
    console.warn('فشل تهيئة Firebase:', e.message);
    if (statusEl) statusEl.textContent = '⚠️ Mode hors ligne';
    setTimeout(() => {
      if (!appStarted) {
        appStarted = true;
        hideSplash();
        render();

/* ============================================================
   🔄 المزامنة مع Firebase
   ============================================================ */
let firstSync = true;

function startSync() {
  if (!dbRef) return;
  
  dbRef.on('value', (snapshot) => {
    const remote = snapshot.val();
    if (remote) {
      db = remote;
      saveLocal();
      if (firstSync) {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('✅ Synchronisé', 'success');
        }
      } else {
        render();
      }
    } else if (firstSync) {
      dbRef.set(db).then(() => {
        console.log('✅ تم إرسال البيانات الأولية');
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('✅ Synchronisé', 'success');
        }
      }).catch(() => {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('⚠️ Données locales', 'warning');
        }
      });
    }
  }, () => {
    if (firstSync && !appStarted) {
      firstSync = false;
      setTimeout(() => {
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast('⚠️ Données locales', 'warning');
        }
      }, 3000);
    }
  });
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (el) {
    el.classList.add('hidden');
    setTimeout(() => { el.style.display = 'none'; }, 500);
  }
}

function customerLogin() {
  const phone = document.getElementById('login-phone').value.trim();
  const password = document.getElementById('login-password').value.trim();
  if (!phone || !password) return showToast('Veuillez remplir tous les champs', 'error');
  
  const customer = db.customers.find(c => c.phone === phone && c.password === password);
  if (!customer) return showToast('Numéro ou mot de passe incorrect', 'error');
  if (customer.blacklisted) return showToast('❌ Compte bloqué, contactez l\'administration', 'error');
  
  state.customer = customer;
  state.tab = 'cars';
  render();
  showToast(`👋 Bienvenue ${customer.name}`, 'success');
}

  state.customer = null;

  if (!name || !phone || !password) return showToast('Tous les champs sont requis', 'error');
  if (password.length < 4) return showToast('4 caractères minimum', 'error');
  if (password !== confirm) return showToast('Les mots de passe ne correspondent pas', 'error');
  if (db.customers.find(c => c.phone === phone)) return showToast('Ce numéro est déjà enregistré', 'error');
  
  const newCustomer = { 
    id: uid(), 
    name, 
    phone, 
    password, 
    whitelisted: false, 
    blacklisted: false, 
    createdAt: todayStr() 
  };
  
  db.customers.push(newCustomer);
  saveData();
  state.customer = newCustomer;
  state.modal = null;
  state.tab = 'cars';
  render();
  showToast(`✅ Bienvenue ${name}`, 'success');
}

function openForgotPassword() {
  state.modal = { type: 'forgotPassword' };
  render();
}

function submitForgotPassword() {
  const phone = document.getElementById('forgot-phone').value.trim();
  if (!phone) return showToast('Entrez votre numéro', 'error');
  const customer = db.customers.find(c => c.phone === phone);
  if (!customer) return showToast('Numéro non enregistré', 'error');
  
  if (!db.passwordResetRequests) db.passwordResetRequests = [];
  db.passwordResetRequests.push({ 
    id: uid(), 
    customerId: customer.id, 
    name: customer.name, 
    phone: customer.phone, 
    requestedAt: todayStr(), 
    status: 'pending' 
  });
  saveData();
  state.modal = null;
  render();
  showToast('✅ Demande envoyée à l\'administration', 'success');
}

function openBooking(carId) {
  const isPremium = state.customer.whitelisted === true;
  if (!isPremium) {
    return showToast('⭐ Compte VIP requis pour réserver', 'error');
  }
  
  state.selectedCar = db.cars.find(c => c.id === carId);
  if (!state.selectedCar) return;
  if (state.selectedCar.status !== 'available') {
    return showToast('Ce véhicule n\'est pas disponible', 'error');
  }
  state.startDate = todayStr();
  state.endDate = addDays(todayStr(), 1);
  state.modal = { type: 'booking' };
  render();
}

function updateBookingTotal() {
  const start = document.getElementById('book-start').value;
  const end = document.getElementById('book-end').value;
  if (!start || !end || !state.selectedCar) return;
  
  const days = daysBetween(start, end);
  if (days < 1) {
    document.getElementById('booking-total').innerHTML = `
      <div style="color:#E5573F;font-size:13px;">⚠️ La date de fin doit être après la date de début</div>
    `;
    return;
  }
  
  const total = days * state.selectedCar.dailyPrice;
  const el = document.getElementById('booking-total');
  if (el) {
    el.innerHTML = `
      <div class="text-muted" style="font-size:12px;">💰 Total</div>
      <div style="font-size:22px;font-weight:700;color:#F2B134;">${fmtMoney(total)}</div>
      <div style="font-size:12px;color:#5B657A;">${days} jour${days > 1 ? 's' : ''} × ${fmtMoney(state.selectedCar.dailyPrice)}</div>
    `;
  }
}

function submitBooking() {
  const car = state.selectedCar;
  const startDate = document.getElementById('book-start').value;
  const endDate = document.getElementById('book-end').value;
  
  if (!startDate || !endDate) return showToast('Choisissez les dates', 'error');
  if (daysBetween(startDate, endDate) < 1) return showToast('Date de fin invalide', 'error');
  
  const overlapping = db.reservations.some(r => 
    r.carId === car.id && 
    r.status !== 'cancelled' && 
    r.status !== 'completed' &&
    ((startDate >= r.startDate && startDate < r.endDate) || 
     (endDate > r.startDate && endDate <= r.endDate) ||
     (startDate <= r.startDate && endDate >= r.endDate))
  );
  
  if (overlapping) return showToast('Ce véhicule est déjà réservé', 'error');
  
  const days = daysBetween(startDate, endDate);
  const totalPrice = days * car.dailyPrice;
  
  db.reservations.push({
    id: uid(),
    carId: car.id,
    customerId: state.customer.id,
    customerName: state.customer.name,
    customerPhone: state.customer.phone,
    startDate,
    endDate,
    status: 'pending',
    totalPrice,
    createdAt: todayStr()
  });
  
  saveData();
  state.modal = null;
  render();
  showToast('✅ Demande de réservation envoyée !', 'success');
}

function cancelReservation(resId) {
  if (!confirm('Confirmer l\'annulation ?')) return;
  const r = db.reservations.find(r => r.id === resId);
  if (!r || r.status !== 'pending') return showToast('Annulation impossible', 'error');
  
  r.status = 'cancelled';
  saveData();
  render();
  showToast('Réservation annulée', 'info');
}

function setTab(tab) {
  state.tab = tab;
  render();
}

function setFilter(filter) {
  state.filter = filter;
  render();
}

function closeModal() {
  state.modal = null;
  render();
}

        appStarted = true;
        hideSplash();
        render();
        showToast('⚠️ Mode hors ligne', 'warning');
      }
