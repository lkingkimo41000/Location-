<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />

<style>
  :root{
    --bg:#0F1216; --surface:#1A1E25; --surface2:#232833; --surface3:#2C323F;
    --border:#323847; --amber:#F2B134; --amber-ink:#1A1305; --text:#F1EEE6;
    --muted:#8B93A1; --success:#3FA796; --danger:#E5573F; --info:#5B8DEF;
    --warning:#F2B134; --notification:#FF6B6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:'Tajawal',-apple-system,'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
  .font-display{font-family:'Cairo','Tajawal',sans-serif;}
  a{color:inherit;}
  input,select,textarea,button{font-family:inherit;}
  input::placeholder{color:var(--muted);}
  select option{background:var(--surface2);}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 40px;}
  header.app-header{position:sticky;top:0;z-index:40;background:rgba(15,18,22,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:12px 16px;}
  .header-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;}
  .logo-svg{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(242,177,52,0.18);}
  .logo-svg svg{width:28px;height:28px;}
  .tabbar{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin:16px 0;overflow-x:auto;}
  .tabbar button{flex:1;white-space:nowrap;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .tabbar button.active{background:var(--amber);color:var(--amber-ink);}
  .tabbar button .notification-dot{width:8px;height:8px;border-radius:50%;background:var(--notification);display:inline-block;margin-right:4px;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .grid{display:grid;gap:12px;grid-template-columns:1fr;}
  @media(min-width:560px){.grid.cols-2{grid-template-columns:1fr 1fr;}}
  @media(min-width:820px){.grid.cols-3{grid-template-columns:1fr 1fr 1fr;}}
  .grid.stats{grid-template-columns:repeat(2,1fr);}
  @media(min-width:560px){.grid.stats{grid-template-columns:repeat(4,1fr);}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;}
  .row-between{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .muted{color:var(--muted);}
  .fs-12{font-size:12px;}
  .fs-13{font-size:13px;}
  .fs-14{font-size:14px;}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer;border:1px solid transparent;transition:transform .1s;}
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--amber);color:var(--amber-ink);}
  .btn-subtle{background:var(--surface2);color:var(--text);border-color:var(--border);}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
  .btn-danger{background:rgba(229,87,63,0.15);color:var(--danger);border-color:rgba(229,87,63,0.4);}
  .btn-success{background:rgba(63,167,150,0.15);color:var(--success);border-color:rgba(63,167,150,0.4);}
  .btn-warning{background:rgba(242,177,52,0.15);color:var(--warning);border-color:rgba(242,177,52,0.4);}
  .btn-notification{background:rgba(255,107,107,0.15);color:var(--notification);border-color:rgba(255,107,107,0.4);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-bottom:12px;}
  .field label{font-weight:800;color:var(--muted);}
  .input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-size:14px;outline:none;}
  .input:focus{border-color:var(--amber);}
  .btn-block{width:100%;margin-top:4px;}
  .search-wrap{position:relative;margin-bottom:14px;}
  .search-wrap input{padding-right:36px;}
  .search-wrap .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 10px;text-align:center;color:var(--muted);}
  .empty .icon{font-size:30px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(6,8,10,0.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;animation:fadeIn .2s ease-out;}
  .modal.wide{max-width:640px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .dial-row{display:flex;flex-wrap:wrap;justify-content:space-around;gap:20px;padding:20px;}
  .dial{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .dial-ring{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .dial-inner{width:66px;height:66px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .dial-inner b{font-family:'Cairo',sans-serif;font-size:17px;}
  .dial-inner span{font-size:10px;color:var(--muted);}
  .dial-label{font-size:13px;font-weight:700;text-align:center;}
  .dial-sub{font-size:11px;color:var(--muted);}
  .stat-card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px;}
  .stat-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .stat-label{font-size:11px;color:var(--muted);}
  .stat-value{font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:60;transition:opacity .3s, visibility .3s;opacity:0;visibility:hidden;}
  .toast.show{opacity:1;visibility:visible;}
  .toast.error{background:var(--danger);}
  .toast.warning{background:var(--warning);color:var(--amber-ink);}
  .toast.notification{background:var(--notification);}
  .alert-row{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:9px;margin-bottom:8px;}
  .alert-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .actions-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .car-price{font-family:'Cairo',sans-serif;font-weight:800;color:var(--amber);font-size:17px;}
  .divider{border-top:1px solid var(--border);margin:10px 0;}
  .total-box{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:12px;padding:11px 14px;margin-bottom:10px;}
  ::-webkit-scrollbar{width:0;height:0;}
  .delay-badge{background:rgba(229,87,63,0.2);color:var(--danger);border:1px solid rgba(229,87,63,0.4);}
  .notification-item{background:var(--surface2);border-radius:12px;padding:12px;margin-bottom:8px;border-right:3px solid var(--notification);}
  .notification-item.read{border-right-color:var(--muted);opacity:0.7;}
</style>

<script>
/* ============================ الثوابت والأدوات ============================ */

const todayStr = () => new Date().toISOString().slice(0, 10);

const fmtKm = (n) => `${Number(n || 0).toLocaleString("en-US")} كم`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      { id: "c3", plate: "ز ح ط 9012", brand: "كيا", model: "سيراتو", year: 2023, status: "maintenance", currentKm: 9000, dailyPrice: 11000, oilIntervalKm: 5000, lastOilKm: 4500, insuranceExpiry: addDays(t, 300), inspectionExpiry: addDays(t, 300) },
      { id: "c4", plate: "ك ل م 3456", brand: "نيسان", model: "صني", year: 2020, status: "available", currentKm: 61000, dailyPrice: 8500, oilIntervalKm: 5000, lastOilKm: 58200, insuranceExpiry: addDays(t, 60), inspectionExpiry: addDays(t, 90) },

      { id: "f2", type: "expense", category: "صيانة", amount: 30000, date: addDays(t, -5), note: "تغيير زيت", carId: "c1" },
    ],

    },

}

function getCarAlerts(car) {
  const t = todayStr();
  const alerts = [];
  const kmLeft = car.lastOilKm + car.oilIntervalKm - car.currentKm;
  if (kmLeft <= 500) alerts.push({ type: "oil", level: kmLeft <= 0 ? "danger" : "warning", emoji: "🛢️", text: kmLeft <= 0 ? `تجاوز تغيير الزيت بـ ${fmtKm(Math.abs(kmLeft))}` : `تغيير الزيت بعد ${fmtKm(kmLeft)}` });
  const insDays = daysBetween(t, car.insuranceExpiry);
  if (insDays <= 30) alerts.push({ type: "insurance", level: insDays <= 0 ? "danger" : "warning", emoji: "🛡️", text: insDays <= 0 ? `انتهى التأمين منذ ${Math.abs(insDays)} يوم` : `ينتهي التأمين بعد ${insDays} يوم` });
  const inspDays = daysBetween(t, car.inspectionExpiry);
  if (inspDays <= 30) alerts.push({ type: "inspection", level: inspDays <= 0 ? "danger" : "warning", emoji: "📋", text: inspDays <= 0 ? `انتهى الفحص الفني منذ ${Math.abs(inspDays)} يوم` : `ينتهي الفحص الفني بعد ${insDays} يوم` });
  return alerts;
}

/* ============================ الحالة والتخزين ============================ */
let state = {
  db: null, 
  adminSection: "overview",
  adminCustSearch: "", 
  modal: null,
  previousResCount: 0,
  newRequests: []
};

function saveDb(db) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    dbRef.set(db);
  } catch (e) {
    showToast("فشل حفظ البيانات", "error");
  }
}

function showToast(msg, type = "success") {
  const el = document.getElementById("toast-el");
  el.textContent = msg;
  el.className = "toast show" + (type === "error" ? " error" : "") + (type === "warning" ? " warning" : "") + (type === "notification" ? " notification" : "");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.className = "toast"; }, 2600);
}

/* ============================ إرسال SMS من الهاتف ============================ */
function sendSmsFromPhone(phoneNumber, message) {
  const cleanPhone = phoneNumber.replace(/[^0-9+]/g, '');
  const encodedMessage = encodeURIComponent(message);
  
  const isAndroid = /Android/i.test(navigator.userAgent);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  
  let smsUrl;
  
  if (isAndroid) {
    smsUrl = `intent://sms/${cleanPhone}?body=${encodedMessage}#Intent;action=android.intent.action.SENDTO;end`;
  } else if (isIOS) {
    smsUrl = `sms:${cleanPhone}?body=${encodedMessage}`;
  } else {
    smsUrl = `sms:${cleanPhone}?body=${encodedMessage}`;
  }
  
  window.location.href = smsUrl;
  showToast(`📨 تم فتح تطبيق الرسائل للرقم ${phoneNumber}`, 'notification');
  return true;
}

function sendSmsNotification(customerName, customerPhone, carBrand, carModel, carPlate, startDate, endDate, totalPrice, reservationId) {
  const message = `
📢 طلب كراء جديد!

👤 الزبون: ${customerName}
📱 الهاتف: ${customerPhone}
🚗 السيارة: ${carBrand} ${carModel} (${carPlate || 'بدون لوحة'})
📅 المدة: ${startDate || 'غير محدد'} → ${endDate || 'غير محدد'}
💰 المبلغ: ${totalPrice ? Number(totalPrice).toLocaleString('en-US') + ' د.ج' : 'غير محدد'}
🆔 رقم الحجز: ${reservationId || 'غير محدد'}

✅ يرجى مراجعة لوحة التحكم لتأكيد الطلب.
  `.trim();
  
  sendSmsFromPhone(ADMIN_PHONE, message);
}

/* ============================ التحقق من الطلبات الجديدة ============================ */
function checkNewRequests() {
  if (!state.db) return;
  
  const currentReservations = state.db.reservations || [];
  const currentCount = currentReservations.length;
  
  if (state.previousResCount > 0 && currentCount > state.previousResCount) {
    const newOnes = currentReservations.slice(0, currentCount - state.previousResCount);
    
    newOnes.forEach(res => {
      const isNew = !state.newRequests.some(r => r.id === res.id);
      if (isNew && res.status === "pending") {
        const car = state.db.cars.find(c => c.id === res.carId);
        
        state.newRequests.push({
          ...res,
          carBrand: car ? car.brand : "غير معروف",
          carModel: car ? car.model : "غير معروف",
          carPlate: car ? car.plate : "غير معروف",
          read: false,
          timestamp: new Date().toISOString()
        });
        
        const notificationMsg = `🔔 طلب كراء جديد!\n\n👤 ${res.customerName}\n📱 ${res.customerPhone}\n🚗 ${car ? car.brand + " " + car.model : "غير معروف"}\n📅 ${res.startDate} → ${res.endDate}\n💰 ${fmtMoney(res.totalPrice)}`;
        alert(notificationMsg);
        
        if (car) {
          sendSmsNotification(
            res.customerName,
            res.customerPhone,
            car.brand,
            car.model,
            car.plate,
            res.startDate,
            res.endDate,
            res.totalPrice,
            res.id
          );
        }
        
        showToast(`🔔 طلب جديد من ${res.customerName}`, "notification");
      }
    });
  }
  
  state.previousResCount = currentCount;
}

/* ============================ التحديث التلقائي كل 1 ثانية ============================ */
function startAutoSync() {
  setInterval(() => {
    dbRef.once("value").then((snapshot) => {
      const remote = snapshot.val();
      if (remote) {
        const oldResCount = state.db ? (state.db.reservations || []).length : 0;
        state.db = remote;
        
        const newCount = (remote.reservations || []).length;
        if (newCount > oldResCount) {
          checkNewRequests();
        }
        
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
        } catch (e) {}
        
        render();
      }
    }).catch(() => {
      console.log("⚠️ فشل التحديث التلقائي، استخدام النسخة المحلية");
    });
  }, 1000);
}

/* ============================ التصيير ============================ */
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  document.getElementById("app").innerHTML = renderApp();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function App_updateDb(next) { 
  state.db = next; 
  saveDb(next); 
  checkNewRequests();
  render(); 
}
window.App = {};

function renderApp() {
  const unreadCount = state.newRequests.filter(r => !r.read).length;
  const hasNotifications = unreadCount > 0;
  
  return `
    <header class="app-header">

        <div class="brand">
          <div class="logo-svg">
            <svg viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="18" fill="var(--amber)" opacity="0.9"/>
              <path d="M10 20 L18 10 L28 20 L22 32 L14 32 Z" fill="#1A1305"/>
              <circle cx="20" cy="20" r="6" fill="var(--amber)"/>
              <circle cx="18" cy="18" r="2" fill="#1A1305"/>
              <circle cx="22" cy="22" r="2" fill="#1A1305"/>
            </svg>
          </div>
          <span class="font-display">Adam Location · لوحة التحكم</span>
        </div>
        <button class="btn ${hasNotifications ? 'btn-notification' : 'btn-subtle'} btn-sm" onclick="App.setAdminSection('notifications')">
          🔔 ${hasNotifications ? `<span class="notification-dot"></span>` : ""}
          ${unreadCount > 0 ? unreadCount : ""}
        </button>
      </div>
    </header>
    <div class="wrap">${renderAdmin()}</div>
    ${state.modal ? renderModal() : ""}
  `;
}

function renderEmpty(emoji, text) { return `<div class="empty"><div class="icon">${emoji}</div><div class="fs-13">${text}</div></div>`; }

/* ============================ لوحة الأدمن ============================ */
const ADMIN_SECTIONS = [
  ["overview", "📊 نظرة عامة"], ["cars", "🚗 السيارات"], ["reservations", "📅 الحجوزات"],
  ["customers", "👥 الزبائن"], ["maintenance", "🔧 الصيانة"], ["finances", "💰 المالية"],
  ["settings", "⚙️ الإعدادات"], ["notifications", "🔔 إشعارات"]
];
function renderAdmin() {
  return `
    <div class="tabbar" style="justify-content:space-between;">
      <div style="display:flex;gap:2px;overflow-x:auto;">
        ${ADMIN_SECTIONS.map(([v, l]) => {
          const unread = state.newRequests.filter(r => !r.read).length;
          const hasNotif = v === "notifications" && unread > 0;
          return `<button class="${state.adminSection === v ? "active" : ""}" onclick="App.setAdminSection('${v}')">${l}${hasNotif ? ` <span class="notification-dot"></span>` : ""}</button>`;
        }).join("")}
      </div>
    </div>
    ${renderAdminSection()}
  `;
}
App.setAdminSection = (s) => { state.adminSection = s; render(); };

function renderAdminSection() {
  switch (state.adminSection) {
    case "overview": return renderOverview();
    case "cars": return renderCarsSection();
    case "reservations": return renderReservationsSection();
    case "customers": return renderCustomersSection();
    case "maintenance": return renderMaintenanceSection();
    case "finances": return renderFinancesSection();
    case "settings": return renderSettingsSection();
    case "notifications": return renderNotificationsSection();
    default: return "";
  }
}

/* ---------- صفحة الإشعارات ---------- */
function renderNotificationsSection() {
  const notifications = state.newRequests;
  
  return `
    <div class="row-between" style="margin-bottom:12px;">
      <div class="font-display" style="font-weight:800;">🔔 الإشعارات (${notifications.length})</div>
      ${notifications.some(n => !n.read) ? `<button class="btn btn-subtle btn-sm" onclick="App.markAllRead()">✅ تحديد الكل كمقروء</button>` : ""}
    </div>
    ${notifications.length === 0 ? renderEmpty("🔕", "لا توجد إشعارات جديدة") : 
      notifications.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).map(n => `
        <div class="notification-item ${n.read ? 'read' : ''}">
          <div class="row-between">
            <div>
              <div style="font-weight:800;font-size:14px;">${n.read ? '' : '🆕'} ${esc(n.customerName)}</div>
              <div class="muted fs-12">📱 ${esc(n.customerPhone)}</div>
              <div class="fs-13">🚗 ${esc(n.carBrand)} ${esc(n.carModel)} · ${esc(n.carPlate)}</div>
              <div class="fs-12 muted">📅 ${n.startDate} → ${n.endDate} · 💰 ${fmtMoney(n.totalPrice)}</div>
              <div class="fs-12 muted">🕐 ${n.timestamp ? new Date(n.timestamp).toLocaleString('ar-DZ') : ''}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
              ${!n.read ? `<button class="btn btn-success btn-sm" onclick="App.markAsRead('${n.id}')">✔ قرأت</button>` : `<span class="badge" style="background:var(--muted)22;color:var(--muted);">مقروء</span>`}
              <button class="btn btn-primary btn-sm" onclick="App.openReservationFromNotif('${n.id}')">📋 عرض الحجز</button>
              <button class="btn btn-warning btn-sm" onclick="App.sendManualSmsFromNotif('${n.id}')">📨 إرسال SMS</button>
            </div>
          </div>
        </div>
      `).join("")}
  `;
}

App.markAsRead = (id) => {
  state.newRequests = state.newRequests.map(n => 
    n.id === id ? { ...n, read: true } : n
  );
  render();
  showToast("تم تحديد الإشعار كمقروء");
};

App.markAllRead = () => {
  state.newRequests = state.newRequests.map(n => ({ ...n, read: true }));
  render();
  showToast("تم تحديد جميع الإشعارات كمقروءة");
};

App.openReservationFromNotif = (id) => {
  const notif = state.newRequests.find(n => n.id === id);
  if (notif) {
    state.adminSection = "reservations";
    render();
  }
};

App.sendManualSmsFromNotif = (id) => {
  const notif = state.newRequests.find(n => n.id === id);
  if (notif) {
    sendSmsNotification(
      notif.customerName,
      notif.customerPhone,
      notif.carBrand,
      notif.carModel,
      notif.carPlate,
      notif.startDate,
      notif.endDate,
      notif.totalPrice,
      notif.id
    );
  }
};

/* ---------- نظرة عامة ---------- */
function renderOverview() {
  const db = state.db;
  const totalCars = db.cars.length;
  const available = db.cars.filter((c) => c.status === "available").length;
  const alerts = db.cars.flatMap((c) => getCarAlerts(c).map((a) => ({ ...a, car: c })));
  const dangerAlerts = alerts.filter((a) => a.level === "danger").length;
  const income = db.finances.filter((f) => f.type === "income").reduce((s, f) => s + f.amount, 0);
  const expense = db.finances.filter((f) => f.type === "expense").reduce((s, f) => s + f.amount, 0);
  const net = income - expense;
  const pending = db.reservations.filter((r) => r.status === "pending").length;
  const profitPct = income ? Math.round((net / income) * 100) : 0;
  const unreadNotifs = state.newRequests.filter(n => !n.read).length;

  return `
    <div class="grid stats" style="margin-bottom:14px;">
      ${statCard("🚗", "إجمالي السيارات", totalCars, "var(--info)")}
      ${statCard("📅", "طلبات بانتظار التأكيد", pending, "var(--warning)")}
      ${statCard("💰", "صافي الأرباح", fmtMoney(net), net >= 0 ? "var(--success)" : "var(--danger)")}
      ${statCard("🔔", "إشعارات غير مقروءة", unreadNotifs, "var(--notification)")}
    </div>
    <div class="card" style="margin-bottom:14px;padding:0;">
      <div class="dial-row">
        ${dial(available, totalCars, "سيارات متاحة", "var(--success)")}
        ${dial(alerts.length, totalCars || 1, "سيارات بها تنبيهات", "var(--warning)")}
        ${dial(profitPct, 100, "نسبة الربح %", "var(--info)", "من الإيرادات")}
      </div>
    </div>
    <div class="card">
      <div class="row-between" style="margin-bottom:10px;">
        <div class="font-display" style="font-weight:800;">أحدث التنبيهات</div>
        <button class="btn btn-ghost btn-sm" onclick="App.setAdminSection('maintenance')">عرض الكل ←</button>
      </div>
      ${alerts.length === 0 ? renderEmpty("✅", "لا توجد تنبيهات صيانة حالياً")
        : alerts.slice(0, 5).map((a) => `
          <div class="alert-row">
            <div class="alert-icon" style="background:${a.level === "danger" ? "var(--danger)" : "var(--warning)"}22;">${a.emoji}</div>
            <div>
              <div style="font-size:13px;font-weight:700;">${esc(a.car.brand)} ${esc(a.car.model)} · ${esc(a.car.plate)}</div>
              <div class="muted fs-12">${a.text}</div>
            </div>
          </div>`).join("")}
    </div>
  `;
}
function statCard(emoji, label, value, color) {
  return `<div class="stat-card"><div class="stat-icon" style="background:${color}22;color:${color};">${emoji}</div><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div></div>`;
}
function dial(value, max, label, color, sublabel) {
  const pct = max > 0 ? Math.min(100, Math.round((value / max) * 100)) : 0;
  const deg = pct * 3.6;
  return `
    <div class="dial">
      <div class="dial-ring" style="background:conic-gradient(${color} ${deg}deg, var(--surface3) ${deg}deg);">
        <div class="dial-inner"><b class="font-display">${value}</b>${max ? `<span>من ${max}</span>` : ""}</div>
      </div>
      <div class="dial-label">${label}</div>
      ${sublabel ? `<div class="dial-sub">${sublabel}</div>` : ""}
    </div>`;
}

/* ---------- السيارات ---------- */

  const db = state.db;
  const available = db.cars.filter(c => c.status === "available");
  const unavailable = db.cars.filter(c => c.status !== "available");

  return `
    <div class="row-between" style="margin-bottom:12px;">
      <div class="font-display" style="font-weight:800;">السيارات (${db.cars.length})</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" onclick="App.openCarForm(null)">➕ إضافة سيارة</button>
        <button class="btn btn-success btn-sm" onclick="App.openManualRental()">📝 كراء يدوي</button>
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <div class="font-display" style="font-weight:700;color:var(--success);margin-bottom:8px;">✅ السيارات المتاحة (${available.length})</div>
      ${available.length === 0 ? renderEmpty("🚗", "لا توجد سيارات متاحة حالياً") : `
        <div class="grid cols-2">
          ${available.map(car => renderCarCard(car)).join("")}
        </div>
      `}
    </div>

    <div>
      <div class="font-display" style="font-weight:700;color:var(--danger);margin-bottom:8px;">❌ السيارات غير المتاحة (${unavailable.length})</div>
      ${unavailable.length === 0 ? renderEmpty("✅", "جميع السيارات متاحة") : `
        <div class="grid cols-2">
          ${unavailable.map(car => renderCarCard(car)).join("")}
        </div>
      `}
    </div>
  `;
}

function renderCarCard(car) {
  const meta = STATUS_META[car.status];
  const alerts = getCarAlerts(car);
  const isAvailable = car.status === "available";
  const isMaintenance = car.status === "maintenance";
  return `
    <div class="card">
      <div class="row-between">
        <div>
          <div style="font-weight:800;font-size:14px;">${esc(car.brand)} ${esc(car.model)} · ${car.year}</div>
          <div class="muted fs-12">${esc(car.plate)} · ${fmtKm(car.currentKm)} · ${car.dailyPrice} د.ج/يوم</div>
        </div>
        <span class="badge" style="background:${meta.color}22;color:${meta.color};border:1px solid ${meta.color}55;">${meta.label}</span>
      </div>
      ${alerts.length ? `<div class="actions-wrap">${alerts.map((a) => `<span class="badge" style="background:${(a.level === "danger" ? "var(--danger)" : "var(--warning)")}22;color:${a.level === "danger" ? "var(--danger)" : "var(--warning)"};border:1px solid ${a.level === "danger" ? "var(--danger)" : "var(--warning)"}55;">${a.text}</span>`).join("")}</div>` : ""}
      <div class="actions-wrap">
        <button class="btn btn-subtle btn-sm" onclick="App.openKmUpdate('${car.id}')">📟 تحديث الكيلومترات</button>
        <button class="btn btn-subtle btn-sm" onclick="App.openCarForm('${car.id}')">✏️ تعديل</button>
        <button class="btn btn-danger btn-sm" onclick="App.deleteCar('${car.id}')">🗑️ حذف</button>
        ${isAvailable ? `<button class="btn btn-warning btn-sm" onclick="App.toMaintenance('${car.id}')">🔧 صيانة</button>` : ""}
        ${isMaintenance ? `<button class="btn btn-success btn-sm" onclick="App.fromMaintenance('${car.id}')">✅ نزع من الصيانة</button>` : ""}
      </div>
    </div>`;
}

App.deleteCar = (id) => {
  if (!confirm("تأكيد حذف هذه السيارة؟")) return;
  App_updateDb({ ...state.db, cars: state.db.cars.filter((c) => c.id !== id) });
  showToast("تم حذف السيارة");
};

App.openCarForm = (carId) => { state.modal = { type: "carForm", carId }; render(); };

App.submitCarForm = () => {
  const carId = state.modal.carId;
  const existing = carId ? state.db.cars.find((c) => c.id === carId) : null;
  const val = (id) => document.getElementById(id).value;
  const plate = val("cf-plate").trim(), brand = val("cf-brand").trim(), model = val("cf-model").trim();
  if (!plate || !brand || !model) return showToast("أكمل الحقول المطلوبة", "error");
  const car = {
    id: existing ? existing.id : uid(),
    plate, brand, model,
    year: Number(val("cf-year")), status: val("cf-status"),
    currentKm: Number(val("cf-km")), dailyPrice: Number(val("cf-price")),
    oilIntervalKm: Number(val("cf-oilinterval")), lastOilKm: Number(val("cf-lastoil")),
    insuranceExpiry: val("cf-insurance"), inspectionExpiry: val("cf-inspection"),
  };
  const cars = existing ? state.db.cars.map((c) => (c.id === car.id ? car : c)) : [...state.db.cars, car];
  state.modal = null;
  App_updateDb({ ...state.db, cars });
  showToast(existing ? "تم تحديث السيارة" : "تمت إضافة السيارة");
};

App.openKmUpdate = (carId) => { state.modal = { type: "kmUpdate", carId }; render(); };
App.submitKmUpdate = () => {
  const car = state.db.cars.find((c) => c.id === state.modal.carId);
  const km = Number(document.getElementById("km-value").value);
  if (!km || km < car.currentKm) return showToast("القيمة يجب أن تكون أكبر من القراءة الحالية", "error");
  state.modal = null;
  App_updateDb({
    ...state.db,
    cars: state.db.cars.map((c) => (c.id === car.id ? { ...c, currentKm: km } : c)),
    kmHistory: [{ id: uid(), carId: car.id, km, date: todayStr(), note: "تحديث يدوي" }, ...state.db.kmHistory],
  });
  showToast("تم تحديث الكيلومترات");
};

/* ---------- كراء يدوي ---------- */
App.openManualRental = () => {
  state.modal = { type: "manualRental" };
  render();
};

App.submitManualRental = () => {
  const carId = document.getElementById("mr-car").value;
  const customerName = document.getElementById("mr-customer").value.trim();
  const customerPhone = document.getElementById("mr-phone").value.trim();
  const startDate = document.getElementById("mr-start").value;
  const endDate = document.getElementById("mr-end").value;

  if (!carId || !customerName || !customerPhone || !startDate || !endDate) {
    return showToast("أكمل جميع الحقول", "error");
  }

  if (daysBetween(startDate, endDate) < 1) {
    return showToast("تاريخ الانتهاء يجب أن يكون بعد تاريخ البداية", "error");
  }

  const db = state.db;
  const car = db.cars.find(c => c.id === carId);
  if (!car) return showToast("السيارة غير موجودة", "error");
  if (car.status !== "available") return showToast("هذه السيارة غير متاحة", "error");

  let customer = db.customers.find(c => c.phone === customerPhone);
  let customerId;
  let customers = db.customers;

  if (!customer) {
    customerId = uid();
    const newCustomer = {
      id: customerId,
      name: customerName,
      phone: customerPhone,
      whitelisted: false,
      blacklisted: false,
      password: "123456",
      createdAt: todayStr()
    };
    customers = [...customers, newCustomer];
    customer = newCustomer;
  } else {
    customerId = customer.id;
    if (customer.name !== customerName) {
      customers = customers.map(c => 
        c.id === customerId ? { ...c, name: customerName } : c
      );
    }
  }

  const days = Math.max(1, daysBetween(startDate, endDate));
  const totalPrice = days * car.dailyPrice;
  const exitTime = nowStr();

  const reservation = {
    id: uid(),
    carId: carId,
    customerId: customerId,
    customerName: customerName,
    customerPhone: customerPhone,
    startDate: startDate,
    endDate: endDate,
    status: "confirmed",
    totalPrice: totalPrice,
    createdAt: todayStr(),
    exitTime: exitTime,
    isManual: true
  };

  const financeEntry = {
    id: uid(),
    type: "income",
    category: "إيجار",
    amount: totalPrice,
    carId: carId,
    date: exitTime,
    note: `كراء يدوي - ${car.brand} ${car.model} - ${customerName}`
  };

  const cars = db.cars.map(c => 
    c.id === carId ? { ...c, status: "rented" } : c
  );

  state.modal = null;
  App_updateDb({
    ...db,
    customers: customers,
    cars: cars,
    reservations: [reservation, ...db.reservations],
    finances: [financeEntry, ...db.finances]
  });

  showToast(`✅ تم كراء السيارة ${car.brand} ${car.model} للزبون ${customerName} - ${exitTime}`);
};

/* ---------- الحجوزات ---------- */
function renderReservationsSection() {
  const db = state.db;
  const sorted = [...db.reservations].sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
  return `
    <div class="row-between" style="margin-bottom:12px;">
      <div class="font-display" style="font-weight:800;">الحجوزات (${db.reservations.length})</div>
      <button class="btn btn-success btn-sm" onclick="App.openManualRental()">📝 كراء يدوي</button>
    </div>
    ${sorted.length === 0 ? renderEmpty("📅", "لا توجد حجوزات بعد") : sorted.map((r) => {
      const car = db.cars.find((c) => c.id === r.carId);
      const meta = RES_STATUS_META[r.status];
      let actions = "";
      let statusInfo = "";
      
      if (r.status === "pending") {
        actions = `
          <button class="btn btn-success btn-sm" onclick="App.confirmRes('${r.id}')">✔ تأكيد الكراء</button>
          <button class="btn btn-danger btn-sm" onclick="App.rejectRes('${r.id}')">✕ رفض</button>
          <button class="btn btn-primary btn-sm" onclick="App.sendManualSms('${r.id}')">📨 إرسال SMS</button>
        `;
      }
      if (r.status === "confirmed") {
        actions = `
          <button class="btn btn-success btn-sm" onclick="App.openReturn('${r.id}')">إتمام الإرجاع</button>
          <button class="btn btn-danger btn-sm" onclick="App.rejectRes('${r.id}')">إلغاء</button>
          <button class="btn btn-primary btn-sm" onclick="App.printContract('${r.id}')">🖨️ طباعة العقد</button>
        `;
        statusInfo = r.exitTime ? `<div class="fs-12" style="color:var(--warning);">🕒 وقت الخروج: ${r.exitTime}</div>` : "";
      }
      if (r.status === "completed") {
        actions = `<button class="btn btn-primary btn-sm" onclick="App.printContract('${r.id}')">🖨️ طباعة العقد</button>`;
        statusInfo = `
          ${r.exitTime ? `<div class="fs-12" style="color:var(--warning);">🕒 خروج: ${r.exitTime}</div>` : ""}
          ${r.returnTime ? `<div class="fs-12" style="color:var(--success);">🔄 إرجاع: ${r.returnTime}</div>` : ""}
          ${r.delayDays ? `<div class="fs-12" style="color:var(--danger);">⏰ تأخير: ${r.delayDays} يوم · غرامة: ${fmtMoney(r.delayPenalty)}</div>` : ""}
        `;
      }

      return `
        <div class="card" style="margin-bottom:10px;">
          <div class="row-between">
            <div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="font-weight:800;font-size:14px;">${car ? esc(car.brand) + " " + esc(car.model) : "سيارة محذوفة"}</span>
                <span class="badge" style="background:${meta.color}22;color:${meta.color};border:1px solid ${meta.color}55;">${meta.label}</span>
                ${r.isManual ? `<span class="badge" style="background:var(--warning)22;color:var(--warning);border:1px solid var(--warning)55;">📝 يدوي</span>` : ""}
              </div>
              <div class="muted fs-12">${esc(r.customerName)} · ${esc(r.customerPhone)} · ${r.startDate} → ${r.endDate} · ${fmtMoney(r.totalPrice)}</div>
              ${statusInfo}
            </div>
          </div>
          ${actions ? `<div class="actions-wrap">${actions}</div>` : ""}
        </div>`;
    }).join("")}
  `;
}

App.confirmRes = (id) => {
  const reservation = state.db.reservations.find(r => r.id === id);
  const car = state.db.cars.find(c => c.id === reservation.carId);

  const exitTime = nowStr();

  const financeEntry = {
    id: uid(),
    type: "income",
    category: "إيجار",
    amount: reservation.totalPrice,
    carId: reservation.carId,
    date: exitTime,
    note: `خروج السيارة ${car.brand} ${car.model} - ${reservation.customerName}`
  };

  App_updateDb({
    ...state.db,
    reservations: state.db.reservations.map((x) => (x.id === id ? { 
      ...x, 
      status: "confirmed",
      exitTime: exitTime
    } : x)),
    cars: state.db.cars.map((c) => (c.id === reservation.carId ? { 
      ...c, 
      status: "rented"
    } : c)),
    finances: [financeEntry, ...state.db.finances]
  });

  showToast(`✅ تم تأكيد الكراء ${exitTime} - السيارة الآن غير متاحة`);
};

App.rejectRes = (id) => {
  const r = state.db.reservations.find((x) => x.id === id);
  const car = state.db.cars.find(c => c.id === r.carId);

  const financeEntry = {
    id: uid(),
    type: "expense",
    category: "إلغاء حجز",
    amount: r.totalPrice,
    carId: r.carId,
    date: nowStr(),
    note: `إلغاء حجز - ${car.brand} ${car.model} - ${r.customerName} (خصم ${fmtMoney(r.totalPrice)})`
  };

  App_updateDb({
    ...state.db,
    reservations: state.db.reservations.map((x) => (x.id === id ? { ...x, status: "cancelled" } : x)),
    cars: state.db.cars.map((c) => (c.id === r.carId ? { ...c, status: "available" } : c)),
    finances: [financeEntry, ...state.db.finances]
  });

App.submitReturn = () => {
  const r = state.db.reservations.find((x) => x.id === state.modal.resId);
  const car = state.db.cars.find((c) => c.id === r.carId);
  const km = Number(document.getElementById("return-km").value);
  if (!km || km < car.currentKm) return showToast("قراءة الكيلومترات غير صحيحة", "error");

  const returnTime = nowStr();
  const delayDays = Number(document.getElementById("return-delay").value) || 0;
  let delayPenalty = 0;
  let financeEntries = [];

  if (delayDays > 0) {
    delayPenalty = Math.round(delayDays * car.dailyPrice * 1.5);
    financeEntries.push({
      id: uid(),
      type: "expense",
      category: "غرامة تأخير",
      amount: delayPenalty,
      carId: r.carId,
      date: returnTime,
      note: `تأخير ${delayDays} يوم - ${car.brand} ${car.model} - ${r.customerName}`
    });
  }

  state.modal = null;
  App_updateDb({
    ...state.db,
    reservations: state.db.reservations.map((x) => (x.id === r.id ? { 
      ...x, 
      status: "completed",
      returnTime: returnTime,
      delayDays: delayDays,
      delayPenalty: delayPenalty
    } : x)),
    cars: state.db.cars.map((c) => (c.id === r.carId ? { 
      ...c, 
      status: "available",
      currentKm: km 
    } : c)),
    kmHistory: [{ id: uid(), carId: r.carId, km, date: todayStr(), note: "إرجاع السيارة" }, ...state.db.kmHistory],
    finances: [...financeEntries, ...state.db.finances],
  });

  if (delayDays > 0) {
    showToast(`✅ تم الإرجاع مع ${delayDays} يوم تأخير - غرامة ${fmtMoney(delayPenalty)}`, "warning");
  } else {
    showToast(`✅ تم إتمام الإرجاع ${returnTime} - السيارة الآن متاحة`);
  }
};

App.toggleCustFlag = (id, field) => {
  App_updateDb({
    ...state.db,
    customers: state.db.customers.map((c) => {
      if (c.id !== id) return c;
      if (field === "whitelisted") return { ...c, whitelisted: !c.whitelisted, blacklisted: false };
      return { ...c, blacklisted: !c.blacklisted, whitelisted: false };
    }),
  });
  showToast("تم تحديث حالة العميل");
};

App.deleteCustomer = (id) => {
  const customer = state.db.customers.find(c => c.id === id);
  if (!customer) return showToast("الزبون غير موجود", "error");
  
  const reservationCount = state.db.reservations.filter(r => r.customerId === id).length;
  if (!confirm(`تأكيد حذف الزبون "${customer.name}" مع ${reservationCount} حجز مرتبط به؟`)) return;
  
  App_updateDb({
    ...state.db,
    customers: state.db.customers.filter(c => c.id !== id),
    reservations: state.db.reservations.filter(r => r.customerId !== id)
  });
  showToast(`تم حذف الزبون ${customer.name} وجميع حجوزاته`);
};

App.submitAddCustomer = () => {
  const name = document.getElementById("ac-name").value.trim();
  const phone = document.getElementById("ac-phone").value.trim();

  if (!name || !phone) return showToast("أدخل الاسم ورقم الهاتف", "error");

  const db = state.db;
  const existing = db.customers.find(c => c.phone === phone);

  if (existing) {
    if (existing.whitelisted) return showToast("هذا الزبون مميز بالفعل", "error");
    App_updateDb({
      ...db,
      customers: db.customers.map(c => 
        c.id === existing.id ? { ...c, whitelisted: true, blacklisted: false } : c
      )
    });
    state.modal = null;
    showToast(`تم ترقية ${name} إلى زبون مميز`);
    return;
  }

  const newCustomer = {
    id: uid(),
    name: name,
    phone: phone,
    whitelisted: true,
    blacklisted: false,
    password: "123456",
    createdAt: todayStr()
  };

  state.modal = null;
  App_updateDb({ ...db, customers: [...db.customers, newCustomer] });
  showToast(`تم إضافة الزبون المميز ${name}`);
};

/* ---------- معالجة طلبات استعادة الرمز السري ---------- */
App.resetPassword = (requestId) => {
  const db = state.db;
  const requests = db.passwordResetRequests || [];
  const request = requests.find(r => r.id === requestId);
  
  if (!request) return showToast("الطلب غير موجود", "error");

  const customer = db.customers.find(c => c.id === request.customerId);
  
  if (!customer) {
    return showToast("الزبون غير موجود", "error");
  }

  const currentPassword = customer.password;

  const updatedRequests = requests.map(r => 
    r.id === requestId ? { 
      ...r, 
      status: "resolved", 
      resolvedAt: nowStr(), 
      resentPassword: currentPassword
    } : r
  );

  App_updateDb({
    ...db,
    passwordResetRequests: updatedRequests
  });

  showToast(`📤 تم إعادة إرسال الرمز السري للزبون ${customer.name}: ${currentPassword}`);
};

App.rejectPasswordReset = (requestId) => {
  const db = state.db;
  const requests = db.passwordResetRequests || [];
  
  const updatedRequests = requests.map(r => 
    r.id === requestId ? { ...r, status: "rejected", resolvedAt: nowStr() } : r
  );

  App_updateDb({
    ...db,
    passwordResetRequests: updatedRequests
  });

  showToast("تم رفض طلب استعادة الرمز السري");
};

              <td style="padding:10px;">
                <button onclick="App.deleteFinance('${f.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;">🗑️</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

App.deleteFinance = (id) => { App_updateDb({ ...state.db, finances: state.db.finances.filter((f) => f.id !== id) }); };
App.openFinanceAdd = () => { state.modal = { type: "financeAdd" }; render(); };
App.submitFinanceAdd = () => {
  const category = document.getElementById("fa-category").value.trim();
  const amount = Number(document.getElementById("fa-amount").value);
  const carId = document.getElementById("fa-car").value || null;
  const note = document.getElementById("fa-note").value.trim();

  if (!category || !amount) return showToast("أدخل الفئة والمبلغ", "error");

  const entry = {
    id: uid(),
    type: document.getElementById("fa-type").value,
    category: category,
    amount: amount,
    carId: carId,
    date: document.getElementById("fa-date").value || todayStr(),
    note: note
  };

  state.modal = null;
  App_updateDb({ ...state.db, finances: [entry, ...state.db.finances] });
  showToast("تمت إضافة العملية");
};

/* ---------- الإعدادات ---------- */
function renderSettingsSection() {
  const db = state.db;
  const contact = db.contact || { phone: "", platformLink: "", platformLabel: "" };
  return `
    <div class="font-display" style="font-weight:800;margin-bottom:12px;">⚙️ إعدادات التواصل مع الزبائن</div>
    <div class="card">
      <div class="field"><label>رقم الهاتف (للزبائن)</label><input id="set-phone" class="input" value="${esc(contact.phone)}" placeholder="05xxxxxxxx" /></div>
      <div class="field"><label>رابط المنصة (واتساب، تليجرام، إلخ)</label><input id="set-platform" class="input" value="${esc(contact.platformLink)}" placeholder="https://wa.me/2135xxxxxxxx" /></div>
      <div class="field"><label>اسم المنصة (للعرض)</label><input id="set-platform-label" class="input" value="${esc(contact.platformLabel)}" placeholder="واتساب" /></div>
      <button class="btn btn-primary btn-block" onclick="App.saveContactSettings()">حفظ الإعدادات</button>
    </div>
  `;
}
App.saveContactSettings = () => {
  const contact = {
    phone: document.getElementById("set-phone").value.trim(),
    platformLink: document.getElementById("set-platform").value.trim(),
    platformLabel: document.getElementById("set-platform-label").value.trim()
  };
  App_updateDb({ ...state.db, contact });
  showToast("تم حفظ إعدادات التواصل");
};

/* ============================ النوافذ المنبثقة (Modals) ============================ */
App.closeModal = () => { state.modal = null; render(); };

function renderModal() {
  const m = state.modal;
  let title = "", content = "", wide = false;

  if (m.type === "carForm") {
    const car = m.carId ? state.db.cars.find((c) => c.id === m.carId) : null;
    title = car ? "تعديل سيارة" : "إضافة سيارة جديدة"; wide = true;
    const v = (k, d) => esc(car ? car[k] : d);
    content = `
      <div class="grid cols-2">
        <div class="field"><label>رقم اللوحة</label><input id="cf-plate" class="input" value="${v("plate", "")}" /></div>
        <div class="field"><label>الحالة</label><select id="cf-status" class="input">${Object.entries(STATUS_META).map(([k, mm]) => `<option value="${k}" ${car && car.status === k ? "selected" : ""}>${mm.label}</option>`).join("")}</select></div>
        <div class="field"><label>الماركة</label><input id="cf-brand" class="input" value="${v("brand", "")}" /></div>
        <div class="field"><label>الموديل</label><input id="cf-model" class="input" value="${v("model", "")}" /></div>
        <div class="field"><label>سنة الصنع</label><input id="cf-year" type="number" class="input" value="${v("year", new Date().getFullYear())}" /></div>
        <div class="field"><label>السعر اليومي (د.ج)</label><input id="cf-price" type="number" class="input" value="${v("dailyPrice", 10000)}" /></div>
        <div class="field"><label>الكيلومترات الحالية</label><input id="cf-km" type="number" class="input" value="${v("currentKm", 0)}" /></div>
        <div class="field"><label>دورية تغيير الزيت (كم)</label><input id="cf-oilinterval" type="number" class="input" value="${v("oilIntervalKm", 5000)}" /></div>
        <div class="field"><label>آخر تغيير زيت عند (كم)</label><input id="cf-lastoil" type="number" class="input" value="${v("lastOilKm", 0)}" /></div>
        <div class="field"><label>انتهاء التأمين</label><input id="cf-insurance" type="date" class="input" value="${v("insuranceExpiry", addDays(todayStr(), 180))}" /></div>
        <div class="field"><label>انتهاء الفحص الفني</label><input id="cf-inspection" type="date" class="input" value="${v("inspectionExpiry", addDays(todayStr(), 180))}" /></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="App.submitCarForm()">حفظ</button>
    `;
  }

  else if (m.type === "kmUpdate") {
    const car = state.db.cars.find((c) => c.id === m.carId);
    title = `تحديث كيلومترات ${esc(car.brand)} ${esc(car.model)}`;
    content = `
      <div class="field"><label>القراءة الحالية: ${fmtKm(car.currentKm)}</label><input id="km-value" type="number" class="input" placeholder="القراءة الجديدة" /></div>
      <button class="btn btn-primary btn-block" onclick="App.submitKmUpdate()">حفظ</button>
    `;
  }

  else if (m.type === "returnRes") {
    const r = state.db.reservations.find((x) => x.id === m.resId);
    const car = state.db.cars.find((c) => c.id === r.carId);
    title = "إتمام إرجاع السيارة";
    const maxDelay = Math.max(0, daysBetween(r.endDate, todayStr()));
    content = `
      <div class="field">
        <label>قراءة الكيلومترات عند الإرجاع (الحالية: ${fmtKm(car.currentKm)})</label>
        <input id="return-km" type="number" class="input" placeholder="أدخل القراءة الجديدة" />
      </div>
      <div class="field">
        <label>عدد أيام التأخير (إن وجدت)</label>
        <input id="return-delay" type="number" class="input" placeholder="0" value="${Math.max(0, maxDelay)}" />
        <div class="fs-12 muted">📌 غرامة التأخير: ${fmtMoney(car.dailyPrice * 1.5)} لكل يوم تأخير (حسب العقد)</div>
      </div>
      <button class="btn btn-success btn-block" onclick="App.submitReturn()">✅ تأكيد الإرجاع</button>
    `;
  }

  else if (m.type === "maintResolve") {
    title = "تسجيل عملية صيانة";
    content = `
      <div class="field"><label>تكلفة العملية (اختياري، د.ج)</label><input id="maint-amount" type="number" class="input" placeholder="0" /></div>
      <button class="btn btn-primary btn-block" onclick="App.submitMaintResolve()">تأكيد وتحديث السيارة</button>
    `;
  }

  else if (m.type === "financeAdd") {
    title = "إضافة عملية مالية";
    const carOptions = state.db.cars.map(c => 
      `<option value="${c.id}">${esc(c.brand)} ${esc(c.model)} - ${esc(c.plate)}</option>`
    ).join("");
    content = `
      <div class="field"><label>النوع</label><select id="fa-type" class="input"><option value="income">إيراد</option><option value="expense">مصروف</option></select></div>
      <div class="field"><label>الفئة</label><input id="fa-category" class="input" placeholder="مثال: إيجار، صيانة، وقود" /></div>
      <div class="field"><label>المبلغ (د.ج)</label><input id="fa-amount" type="number" class="input" /></div>
      <div class="field"><label>السيارة (اختياري)</label><select id="fa-car" class="input"><option value="">عمومي (بدون سيارة)</option>${carOptions}</select></div>
      <div class="field"><label>التاريخ</label><input id="fa-date" type="date" class="input" value="${todayStr()}" /></div>
      <div class="field"><label>ملاحظة / تبرير</label><input id="fa-note" class="input" placeholder="مثال: تغيير زيت، إصلاح فرامل..." /></div>
      <button class="btn btn-primary btn-block" onclick="App.submitFinanceAdd()">حفظ</button>
    `;
  }

  else if (m.type === "addCustomer") {
    title = "➕ إضافة زبون مميز";
    content = `
      <div class="field"><label>الاسم الكامل</label><input id="ac-name" class="input" placeholder="مثال: عبدالله ناصر" /></div>
      <div class="field"><label>رقم الهاتف</label><input id="ac-phone" class="input" placeholder="05xxxxxxxx" /></div>
      <div class="field" style="margin-bottom:16px;">
        <label>الحالة</label>
        <div style="display:flex;gap:8px;">
          <span class="badge" style="background:var(--success)22;color:var(--success);border:1px solid var(--success)55;">🛡️ زبون مميز (whitelisted)</span>
        </div>
      </div>
      <button class="btn btn-primary btn-block" onclick="App.submitAddCustomer()">إضافة الزبون المميز</button>
    `;
  }

  else if (m.type === "manualRental") {
    title = "📝 كراء يدوي (من الأدمن)";
    const availableCars = state.db.cars.filter(c => c.status === "available");
    const carOptions = availableCars.map(c => 
      `<option value="${c.id}">${esc(c.brand)} ${esc(c.model)} - ${esc(c.plate)} (${fmtMoney(c.dailyPrice)}/يوم)</option>`
    ).join("");
    
    content = `
      <div class="field">
        <label>السيارة</label>
        <select id="mr-car" class="input">
          <option value="">اختر السيارة</option>
          ${carOptions}
        </select>
      </div>
      <div class="field">
        <label>اسم الزبون</label>
        <input id="mr-customer" class="input" placeholder="مثال: عبدالله ناصر" />
      </div>
      <div class="field">
        <label>رقم هاتف الزبون</label>
        <input id="mr-phone" class="input" placeholder="05xxxxxxxx" />
      </div>
      <div class="grid cols-2">
        <div class="field">
          <label>تاريخ الاستلام</label>
          <input id="mr-start" type="date" class="input" value="${todayStr()}" />
        </div>
        <div class="field">
          <label>تاريخ التسليم</label>
          <input id="mr-end" type="date" class="input" value="${addDays(todayStr(), 1)}" />
        </div>
      </div>
      <div class="field" style="margin-bottom:16px;">
        <label>ملاحظة</label>
        <input id="mr-note" class="input" placeholder="ملاحظات إضافية (اختياري)" />
      </div>
      <button class="btn btn-success btn-block" onclick="App.submitManualRental()">✅ تأكيد الكراء اليدوي</button>
    `;
  }

  return `
    <div class="modal-backdrop" onclick="if(event.target===this)App.closeModal()">
      <div class="modal ${wide ? "wide" : ""}">
        <div class="modal-head"><h3 class="font-display">${title}</h3><button class="modal-close" onclick="App.closeModal()">✕</button></div>
        ${content}
      </div>
    </div>
  `;
}

/* ============================ Service Worker ============================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ============================ الإقلاع الأولي ============================ */
(function initialRender() {
  try {
    const cached = localStorage.getItem(STORAGE_KEY);
    state.db = cached ? JSON.parse(cached) : seedData();
    state.previousResCount = (state.db.reservations || []).length;
  } catch (e) {
    state.db = seedData();
    state.previousResCount = state.db.reservations.length;
  }
  render();
})();

let __firstLoad = true;
let __firebaseResponded = false;

setTimeout(() => {
  if (!__firebaseResponded) {
    showToast("تعذر الاتصال بالخادم، البيانات المعروضة قديمة", "error");
  }
}, 8000);

dbRef.on("value", (snapshot) => {
  __firebaseResponded = true;
  const remote = snapshot.val();
  if (remote) {
    const oldResCount = state.db ? (state.db.reservations || []).length : 0;
    state.db = remote;
    
    const newCount = (remote.reservations || []).length;
    if (newCount > oldResCount) {
      checkNewRequests();
    }
    
  } else if (__firstLoad) {
    state.db = seedData();
    state.previousResCount = state.db.reservations.length;
    dbRef.set(state.db);
  }
  __firstLoad = false;
  render();
}, () => {
  __firebaseResponded = true;
  const cached = localStorage.getItem(STORAGE_KEY);
  if (cached) {
    state.db = JSON.parse(cached);
    state.previousResCount = (state.db.reservations || []).length;
  } else {
    state.db = seedData();
    state.previousResCount = state.db.reservations.length;
  }
  render();
  showToast("تعذر الاتصال بالخادم، البيانات المعروضة قديمة", "error");
});

startAutoSync();

</script>
</body>
</html>
