    color: #8B93A1;
    margin-top: 4px;

    border: 3px solid #232833;
    border-top-color: #F2B134;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;

    font-size: 12px;
    color: #5B8DEF;

const todayStr = () => new Date().toISOString().slice(0, 10);
const nowStr = () => new Date().toISOString().slice(0, 10) + ' ' + new Date().toTimeString().slice(0, 5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const addDays = (dateStr, n) => { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtMoney = (n) => `${Number(n || 0).toLocaleString("en-US")} د.ج`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let currentLang = localStorage.getItem('app_lang') || 'ar';

function t(key) {
  return LANG[currentLang][key] || key;
}

function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('app_lang', lang);
  // تحديث اتجاه الصفحة
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  render();
  showToast(lang === 'ar' ? '🌍 تم التبديل إلى العربية' : '🌍 Basculé vers le français', 'info');
}

function showToast(msg, type = "success") {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.className = "toast"; }, 3500);
}

let db;
let dbRef = null;
let firebaseReady = false;
let appStarted = false;

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  db = saved ? JSON.parse(saved) : getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
} catch (e) {
  db = getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
}

function saveData() {
  saveLocal();
  if (dbRef && firebaseReady) {
    dbRef.set(db).catch(() => {});
  }
}

/* ============================================================
   🔥 تهيئة Firebase
   ============================================================ */
function initFirebase() {
  const statusEl = document.getElementById('splash-status');
  
  try {
    if (typeof firebase === 'undefined') {
      throw new Error('Firebase غير محمل');
    }
    
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref(STORAGE_KEY);
    firebaseReady = true;
    
    if (statusEl) statusEl.textContent = t('synced');
    startSync();
    
  } catch (e) {
    console.warn('فشل تهيئة Firebase:', e.message);
    if (statusEl) statusEl.textContent = t('offline');
    setTimeout(() => {
      if (!appStarted) {
        appStarted = true;
        hideSplash();
        render();
        showToast(t('offline'), 'warning');
      }
    }, 3000);
  }
}

/* ============================================================
   🔄 المزامنة مع Firebase
   ============================================================ */
let firstSync = true;

function startSync() {
  if (!dbRef) return;
  
  dbRef.on('value', (snapshot) => {
    const remote = snapshot.val();
    if (remote) {
      db = remote;
      saveLocal();
      if (firstSync) {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast(t('synced'), 'success');
        }
      } else {
        render();
      }
    } else if (firstSync) {
      dbRef.set(db).then(() => {
        console.log('✅ تم إرسال البيانات الأولية');
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast(t('synced'), 'success');
        }
      }).catch(() => {
        firstSync = false;
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast(t('offline'), 'warning');
        }
      });
    }
  }, () => {
    if (firstSync && !appStarted) {
      firstSync = false;
      setTimeout(() => {
        if (!appStarted) {
          appStarted = true;
          hideSplash();
          render();
          showToast(t('offline'), 'warning');
        }
      }, 3000);
    }
  });
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (el) {
    el.classList.add('hidden');
    setTimeout(() => { el.style.display = 'none'; }, 500);
  }
}

          </button>
        ` : isAvailable ? `
          ${hasPendingReservation ? `
            <button class="btn btn-sm" style="background:#F2B13422;color:#F2B134;border:1px solid #F2B13444;" disabled>${t('pending')}</button>
          ` : `
            <button class="btn btn-sm btn-primary" onclick="openBooking('${car.id}')">${t('book')}</button>
          `}
        ` : `
          <button class="btn btn-sm btn-subtle" style="opacity:0.4;cursor:not-allowed;" disabled>${t('unavailable')}</button>
        `}
      </div>
      
      ${!isPremium ? `
        <div style="margin-top:8px;font-size:10px;color:#3F485A;text-align:center;border-top:1px solid #1F2633;padding-top:8px;">
          ⭐ ${t('vip_required')} · ${t('contact_admin')}
        </div>
      ` : ''}
    </div>
  `;
}

/* ============================================================
   📋 تفاصيل السيارة
   ============================================================ */
function viewCarDetails(carId) {
  state.modal = { type: 'carDetails', carId };
  render();
}

/* ============================================================
   📅 حجوزاتي
   ============================================================ */
function renderReservations() {
  const myRes = db.reservations.filter(r => r.customerId === state.customer.id);
  const sorted = [...myRes].sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
  
  const statusMap = {
    pending: { label: t('pending_status'), cls: 'badge-warning' },
    confirmed: { label: t('confirmed_status'), cls: 'badge-success' },
    completed: { label: t('completed_status'), cls: 'badge-info' },
    cancelled: { label: t('cancelled_status'), cls: 'badge-danger' }
  };
  
  return `
    <div style="font-weight:700;margin-bottom:12px;font-size:16px;">${t('my_reservations')} (${myRes.length})</div>
    
    ${myRes.length === 0 ? `
      <div class="empty">
        <div class="icon">📭</div>
        <div>${t('no_reservations')}</div>
        <button class="btn btn-primary btn-sm" onclick="setTab('cars')" style="width:auto;margin-top:8px;">${t('browse')}</button>
      </div>
    ` : sorted.map(r => {
      const car = db.cars.find(c => c.id === r.carId);
      const st = statusMap[r.status] || statusMap.pending;
      const days = daysBetween(r.startDate, r.endDate);
      const dayLabel = days === 1 ? t('days') : t('days_plural');
      return `
        <div class="card">
          <div class="flex-between">
            <div>
              <div style="font-weight:700;">${car ? esc(car.brand) + ' ' + esc(car.model) : 'Véhicule supprimé'}</div>
              <div class="info">📅 ${r.startDate} → ${r.endDate} · ${days} ${dayLabel}</div>
              ${r.exitTime ? `<div class="info" style="color:#5B8DEF;">🕒 Sortie: ${r.exitTime}</div>` : ''}
              ${r.returnTime ? `<div class="info" style="color:#3FA796;">🔄 Retour: ${r.returnTime}</div>` : ''}
            </div>
            <div style="text-align:left;">
              <span class="badge ${st.cls}" style="display:block;margin-bottom:4px;">${st.label}</span>
              <div style="color:#F2B134;font-weight:700;font-size:15px;">${fmtMoney(r.totalPrice)}</div>
            </div>
          </div>
          ${r.status === 'pending' ? `
            <button class="btn btn-danger btn-sm" onclick="cancelReservation('${r.id}')" style="width:auto;margin-top:8px;">${t('cancel')}</button>
          ` : ''}
        </div>
      `;
    }).join('')}
  `;
}

/* ============================================================
   👤 حسابي
   ============================================================ */
function renderProfile() {
  const c = state.customer;
  const count = db.reservations.filter(r => r.customerId === c.id).length;
  const isPremium = c.whitelisted === true;
  
  return `
    <div class="card text-center">
      <div style="font-size:56px;">${isPremium ? '⭐' : '👤'}</div>
      <div style="font-size:20px;font-weight:700;">${esc(c.name)}</div>
      <div style="color:#8B93A1;font-size:14px;">📱 ${esc(c.phone)}</div>
      ${isPremium ? `
        <span class="badge badge-premium" style="margin-top:8px;">${t('vip_account')}</span>
        <div style="margin-top:6px;font-size:12px;color:#F2B134;">${t('vip_desc')}</div>
      ` : `
        <span class="badge badge-info" style="margin-top:8px;">${t('standard_account')}</span>
        <div style="margin-top:6px;font-size:12px;color:#5B657A;">${t('standard_desc')}</div>
      `}
      <div style="margin-top:12px;color:#8B93A1;font-size:13px;">${t('reservations_count')}: ${count}</div>
      <div style="color:#8B93A1;font-size:13px;">${t('joined')}: ${c.createdAt}</div>

    <button class="btn btn-danger" onclick="customerLogout()">${t('logout_btn')}</button>
  `;
}

/* ============================================================
   🖼️ المودال
   ============================================================ */
function renderModal() {
  const m = state.modal;
  if (!m) return '';
  
  let title = '', content = '';
  
  if (m.type === 'register') {
    title = t('register_title');
    content = `
      <div class="input-group"><label>${t('full_name')}</label><input id="reg-name" class="input" placeholder="Ahmed Mohamed" /></div>
      <div class="input-group"><label>${t('phone')}</label><input id="reg-phone" class="input" placeholder="${t('phone_placeholder')}" /></div>
      <div class="input-group"><label>${t('password')}</label><input id="reg-password" class="input" type="password" placeholder="${t('password_placeholder')}" /></div>
      <div class="input-group"><label>${t('confirm_password')}</label><input id="reg-confirm" class="input" type="password" placeholder="${t('password_placeholder')}" /></div>
      <button class="btn btn-primary" onclick="submitRegister()">${t('register_submit')}</button>
    `;
  }
  
  if (m.type === 'forgotPassword') {
    title = t('forgot_title');
    content = `
      <div class="input-group"><label>${t('phone')}</label><input id="forgot-phone" class="input" placeholder="${t('phone_placeholder')}" /></div>
      <div class="text-muted" style="font-size:12px;margin-bottom:12px;">${t('forgot_sub')}</div>
      <button class="btn btn-primary" onclick="submitForgotPassword()">${t('forgot_submit')}</button>
    `;
  }
  
  if (m.type === 'carDetails') {
    const car = db.cars.find(c => c.id === m.carId);
    if (!car) return '';
    const isPremium = state.customer.whitelisted === true;
    const isAvailable = car.status === 'available';
    const statusMap = {
      available: { label: t('available'), cls: 'badge-success' },
      rented: { label: t('rented'), cls: 'badge-danger' },
      maintenance: { label: t('maintenance'), cls: 'badge-warning' }
    };
    const st = statusMap[car.status] || statusMap.available;
    
    title = `📋 ${esc(car.brand)} ${esc(car.model)}`;
    content = `
      <div class="car-detail-image">${car.image || '🚗'}</div>
      
      <div class="flex-between">
        <div><strong style="font-size:18px;">${esc(car.brand)} ${esc(car.model)}</strong></div>
        <span class="badge ${st.cls}">${st.label}</span>
      </div>
      
      <div class="details-grid" style="grid-template-columns:1fr 1fr;margin:12px 0;">
        <div><span class="label">${t('year')}</span><br><span>${car.year}</span></div>
        <div><span class="label">${t('color')}</span><br><span>${esc(car.color || '—')}</span></div>
        <div><span class="label">${t('km')}</span><br><span>${car.currentKm.toLocaleString()} km</span></div>
        <div><span class="label">💰 Prix/Jour</span><br><span style="color:#F2B134;font-weight:700;">${fmtMoney(car.dailyPrice)}</span></div>
        <div><span class="label">${t('last_oil')}</span><br><span>${car.lastOilKm.toLocaleString()} km</span></div>
        <div><span class="label">${t('plate')}</span><br><span>${esc(car.plate)}</span></div>
      </div>
      
      ${car.description ? `<div style="background:#1A212E;border-radius:8px;padding:10px 14px;font-size:13px;color:#8B93A1;margin-bottom:12px;">${esc(car.description)}</div>` : ''}
      
      ${!isPremium ? `
        <div style="background:#F2B13408;border:1px solid #F2B13433;border-radius:8px;padding:10px 14px;font-size:12px;color:#5B657A;text-align:center;margin-bottom:12px;">
          ⭐ ${t('vip_required')} · ${t('contact_admin')}
        </div>
      ` : ''}
      
      <div class="flex-between">
        <button class="btn btn-sm btn-subtle" onclick="closeModal()">${t('close')}</button>
        ${isPremium && isAvailable ? `
          <button class="btn btn-sm btn-primary" onclick="closeModal();openBooking('${car.id}')">${t('reserve_now')}</button>
        ` : isPremium && !isAvailable ? `
          <span class="text-muted" style="font-size:13px;">${t('unavailable')}</span>
        ` : ''}
      </div>
    `;
  }
  
  if (m.type === 'booking') {
    const car = state.selectedCar;
    if (!car) return '';
    const days = daysBetween(state.startDate, state.endDate);
    const total = days * car.dailyPrice;
    const dayLabel = days === 1 ? t('days') : t('days_plural');
    
    title = `📅 Réserver ${esc(car.brand)} ${esc(car.model)}`;
    content = `
      <div style="margin-bottom:12px;">
        <div class="text-muted">${esc(car.brand)} ${esc(car.model)} · ${car.year}</div>
        <div style="font-weight:700;color:#F2B134;font-size:20px;">${fmtMoney(car.dailyPrice)} / ${t('days')}</div>
        <div class="text-muted" style="font-size:12px;">${esc(car.color || '')} · ${esc(car.plate)}</div>
      </div>
      
      <div class="input-group"><label>📅 Date de début</label><input id="book-start" class="input" type="date" value="${state.startDate}" onchange="updateBookingTotal()" /></div>
      <div class="input-group"><label>📅 Date de fin</label><input id="book-end" class="input" type="date" value="${state.endDate}" onchange="updateBookingTotal()" /></div>
      
      <div id="booking-total" style="background:#1A212E;border-radius:10px;padding:14px;text-align:center;margin-bottom:12px;">
        <div class="text-muted" style="font-size:12px;">💰 Total</div>
        <div style="font-size:22px;font-weight:700;color:#F2B134;">${fmtMoney(total)}</div>
        <div style="font-size:12px;color:#5B657A;">${days} ${dayLabel} × ${fmtMoney(car.dailyPrice)}</div>
      </div>
      
      <button class="btn btn-success" onclick="submitBooking()">✅ Confirmer la réservation</button>
    `;
  }
  
  return `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-box">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        ${content}
      </div>
    </div>
  `;
}

/* ============================================================
   🎯 دوال الزبون
   ============================================================ */
function customerLogin() {
  const phone = document.getElementById('login-phone').value.trim();
  const password = document.getElementById('login-password').value.trim();
  if (!phone || !password) return showToast(t('fill_fields'), 'error');
  
  const customer = db.customers.find(c => c.phone === phone && c.password === password);
  if (!customer) return showToast(t('invalid_credentials'), 'error');
  if (customer.blacklisted) return showToast(t('account_blocked'), 'error');
  
  state.customer = customer;
  state.tab = 'cars';
  render();
  showToast(`${t('login_success')} ${customer.name}`, 'success');
}

function customerLogout() {
  state.customer = null;
  state.tab = 'cars';
  render();
  showToast(t('logout_success'), 'info');
}

function openRegister() {
  state.modal = { type: 'register' };
  render();
}

function submitRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-password').value.trim();
  const confirm = document.getElementById('reg-confirm').value.trim();
  
  if (!name || !phone || !password) return showToast(t('fill_fields'), 'error');
  if (password.length < 4) return showToast(t('min_password'), 'error');
  if (password !== confirm) return showToast(t('password_mismatch'), 'error');
  if (db.customers.find(c => c.phone === phone)) return showToast(t('phone_exists'), 'error');
  
  const newCustomer = { 
    id: uid(), 
    name, 
    phone, 
    password, 
    whitelisted: false, 
    blacklisted: false, 
    createdAt: todayStr() 
  };
  
  db.customers.push(newCustomer);
  saveData();
  state.customer = newCustomer;
  state.modal = null;
  state.tab = 'cars';
  render();
  showToast(`${t('register_success')} ${name}`, 'success');
}

function openForgotPassword() {
  state.modal = { type: 'forgotPassword' };
  render();
}

function submitForgotPassword() {
  const phone = document.getElementById('forgot-phone').value.trim();
  if (!phone) return showToast(t('phone_required'), 'error');
  const customer = db.customers.find(c => c.phone === phone);
  if (!customer) return showToast(t('phone_not_found'), 'error');
  
  if (!db.passwordResetRequests) db.passwordResetRequests = [];
  db.passwordResetRequests.push({ 
    id: uid(), 
    customerId: customer.id, 
    name: customer.name, 
    phone: customer.phone, 
    requestedAt: todayStr(), 
    status: 'pending' 
  });
  saveData();
  state.modal = null;
  render();
  showToast(t('reset_sent'), 'success');
}

function openBooking(carId) {
  const isPremium = state.customer.whitelisted === true;
  if (!isPremium) {
    return showToast(t('vip_required'), 'error');
  }
  
  state.selectedCar = db.cars.find(c => c.id === carId);
  if (!state.selectedCar) return;
  if (state.selectedCar.status !== 'available') {
    return showToast(t('booking_error'), 'error');
  }
  state.startDate = todayStr();
  state.endDate = addDays(todayStr(), 1);
  state.modal = { type: 'booking' };
  render();
}

function updateBookingTotal() {
  const start = document.getElementById('book-start').value;
  const end = document.getElementById('book-end').value;
  if (!start || !end || !state.selectedCar) return;
  
  const days = daysBetween(start, end);
  if (days < 1) {
    document.getElementById('booking-total').innerHTML = `
      <div style="color:#E5573F;font-size:13px;">⚠️ ${t('booking_invalid')}</div>
    `;
    return;
  }
  
  const total = days * state.selectedCar.dailyPrice;
  const el = document.getElementById('booking-total');
  if (el) {
    const dayLabel = days === 1 ? t('days') : t('days_plural');
    el.innerHTML = `
      <div class="text-muted" style="font-size:12px;">💰 Total</div>
      <div style="font-size:22px;font-weight:700;color:#F2B134;">${fmtMoney(total)}</div>
      <div style="font-size:12px;color:#5B657A;">${days} ${dayLabel} × ${fmtMoney(state.selectedCar.dailyPrice)}</div>
    `;
  }
}

function submitBooking() {
  const car = state.selectedCar;
  const startDate = document.getElementById('book-start').value;
  const endDate = document.getElementById('book-end').value;
  
  if (!startDate || !endDate) return showToast(t('booking_dates'), 'error');
  if (daysBetween(startDate, endDate) < 1) return showToast(t('booking_invalid'), 'error');
  
  const overlapping = db.reservations.some(r => 
    r.carId === car.id && 
    r.status !== 'cancelled' && 
    r.status !== 'completed' &&
    ((startDate >= r.startDate && startDate < r.endDate) || 
     (endDate > r.startDate && endDate <= r.endDate) ||
     (startDate <= r.startDate && endDate >= r.endDate))
  );
  
  if (overlapping) return showToast(t('booking_conflict'), 'error');
  
  const days = daysBetween(startDate, endDate);
  const totalPrice = days * car.dailyPrice;
  
  db.reservations.push({
    id: uid(),
    carId: car.id,
    customerId: state.customer.id,
    customerName: state.customer.name,
    customerPhone: state.customer.phone,
    startDate,
    endDate,
    status: 'pending',
    totalPrice,
    createdAt: todayStr()
  });
  
  saveData();
  state.modal = null;
  render();
  showToast(t('booking_success'), 'success');
}

function cancelReservation(resId) {
  if (!confirm(t('confirm_cancel'))) return;
  const r = db.reservations.find(r => r.id === resId);
  if (!r || r.status !== 'pending') return showToast(t('cannot_cancel'), 'error');
  
  r.status = 'cancelled';
  saveData();
  render();
  showToast(t('cancel_success'), 'info');
}

function setTab(tab) {
  state.tab = tab;
  render();
}

function setFilter(filter) {
  state.filter = filter;
  render();
}

function closeModal() {
  state.modal = null;
  render();
}
